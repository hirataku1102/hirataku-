<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>コース表</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#181b16">
<style>
  :root, :root[data-theme="light"]{
    --bg:#f6f6f3; --card:#ffffff; --border:rgba(0,0,0,.1); --border2:rgba(0,0,0,.25);
    --text:#1b1f19; --sub:#6b6f68; --orange:#e8630f; --teal:#2f8a6f; --red:#cf4335; --blue:#2f6fe0;
    --surface1:rgba(0,0,0,.06); --surface2:rgba(0,0,0,.045); --surface3:rgba(0,0,0,.03);
    --input-bg:rgba(0,0,0,.035); --input-border:rgba(0,0,0,.16); --overlay-bg:rgba(0,0,0,.45);
    --key-bg:rgba(47,138,111,.13); --key-fg:#1f6b53;
    --nokey-bg:rgba(207,67,53,.13); --nokey-fg:#a3392b;
    --type-bg:rgba(0,0,0,.05); --type-fg:#50544c;
    --days-bg:rgba(47,111,224,.12); --days-fg:#1f4fb0;
    --orangechip-bg:rgba(232,99,15,.14); --orangechip-fg:#a3480c;
  }
  :root[data-theme="dark"]{
    --bg:#181b16; --card:#20241f; --border:rgba(255,255,255,.1); --border2:rgba(255,255,255,.2);
    --text:#f4f2ec; --sub:#9a9a92; --orange:#FF7A29; --teal:#4FA88D; --red:#E85D4E; --blue:#4C8DFF;
    --surface1:rgba(255,255,255,.1); --surface2:rgba(255,255,255,.08); --surface3:rgba(255,255,255,.05);
    --input-bg:rgba(0,0,0,.25); --input-border:rgba(255,255,255,.18); --overlay-bg:rgba(0,0,0,.75);
    --key-bg:rgba(79,168,141,.2); --key-fg:#8fd8c2;
    --nokey-bg:rgba(232,93,78,.2); --nokey-fg:#f2a89e;
    --type-bg:rgba(255,255,255,.08); --type-fg:#cfcfc7;
    --days-bg:rgba(76,141,255,.15); --days-fg:#9dbdfb;
    --orangechip-bg:rgba(255,122,41,.18); --orangechip-fg:#ffb37a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
  header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 14px 8px;z-index:10}
  h1{margin:0 0 8px;font-size:17px;font-weight:900;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .themebtn{border:1px solid var(--border2);background:transparent;border-radius:999px;width:30px;height:30px;font-size:14px;color:var(--text);cursor:pointer;flex:0 0 auto}
  .toprow{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
  .toprow button{flex:0 0 auto;border:1px solid var(--border);border-radius:999px;padding:8px 13px;font-weight:800;font-size:13px;color:var(--sub);background:transparent;display:flex;align-items:center;gap:5px}
  .toprow button.active{border-color:var(--border2);background:var(--surface1);color:var(--text)}
  .courserow{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
  .courserow button{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:7px 12px;font-weight:700;font-size:12.5px;color:var(--sub);background:transparent}
  .courserow button.active{border-color:var(--border2);background:var(--surface2);color:var(--text)}
  .dayrow{display:flex;gap:6px;overflow-x:auto;padding:6px 0 2px}
  .dayrow button{flex:0 0 auto;border:1px solid var(--border);border-radius:999px;padding:6px 11px;font-weight:800;font-size:12.5px;color:var(--sub);background:transparent}
  .dayrow button.active{border-color:var(--orange);background:var(--orangechip-bg);color:var(--orangechip-fg)}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  main{padding:12px 14px 50px;max-width:640px;margin:0 auto}
  .search{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font-size:15px;margin-bottom:10px}
  .search::placeholder{color:var(--sub)}
  .meta{font-size:12px;color:var(--sub);margin-bottom:8px}
  .card{display:flex;align-items:center;gap:10px;border:1px solid var(--border);background:var(--card);border-radius:14px;padding:11px;margin-bottom:7px}
  .num{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--surface1);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;color:var(--text)}
  .info{flex:1;min-width:0}
  .name{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .addr{font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .badge{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700;white-space:nowrap}
  .badge.key{background:var(--key-bg);color:var(--key-fg)}
  .badge.nokey{background:var(--nokey-bg);color:var(--nokey-fg)}
  .badge.type{background:var(--type-bg);color:var(--type-fg)}
  .badge.days{background:var(--days-bg);color:var(--days-fg)}
  .badgeline{display:flex;gap:5px;margin-top:4px}
  .maplink{flex:0 0 auto;width:40px;height:40px;border-radius:10px;background:var(--days-bg);color:var(--blue);display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:17px}
  .routecheck{flex:0 0 auto;width:22px;height:22px;accent-color:var(--orange);cursor:pointer}
  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;display:none;align-items:center;gap:8px;background:var(--orange);color:#fff;font-weight:800;font-size:14px;padding:12px 20px;border-radius:999px;border:none;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:40}
  .fab.show{display:flex}
  .thumb{flex:0 0 auto;width:40px;height:40px;border-radius:9px;object-fit:cover;border:1px solid var(--border);cursor:pointer}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:80;padding:20px}
  .lightbox.show{display:flex}
  .lightbox-strip{display:flex;gap:12px;overflow-x:auto;max-width:100%;max-height:100%;scroll-snap-type:x mandatory}
  .lightbox-strip img{max-width:88vw;max-height:80vh;border-radius:10px;scroll-snap-align:center}
  .lightbox-close{position:fixed;top:16px;right:16px;background:rgba(255,255,255,.15);color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:18px;z-index:81}
  .thumbwrap{position:relative;flex:0 0 auto}
  .thumbcount{position:absolute;bottom:-4px;right:-4px;background:var(--orange);color:#fff;font-size:9px;font-weight:800;border-radius:999px;padding:1px 5px;line-height:1.3}
  .photostrip{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px}
  .photostrip img{flex:0 0 auto;width:120px;height:120px;object-fit:cover;border-radius:10px;border:1px solid var(--border);cursor:pointer}
  .empty{text-align:center;color:var(--sub);padding:50px 20px;font-size:14px;line-height:1.7}
  .overlay{position:fixed;inset:0;background:var(--overlay-bg);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .overlay.show{display:flex}
  .sheet{width:100%;max-height:88vh;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;border-top:1px solid var(--border)}
  .sheet-head{position:sticky;top:0;background:var(--card);display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--border)}
  .sheet-head h2{margin:0;font-size:17px;font-weight:900}
  .closebtn{background:var(--surface1);border:none;color:var(--text);width:32px;height:32px;border-radius:50%;font-size:18px}
  .sheet-body{padding:16px}
  .photo{width:100%;border-radius:12px;display:block;margin-bottom:14px;background:var(--surface3);object-fit:cover;max-height:280px}
  .photo-ph{width:100%;border-radius:12px;background:var(--surface3);color:var(--sub);display:flex;align-items:center;justify-content:center;height:100px;font-size:12px;margin-bottom:14px}
  .typeblock{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
  .typeblock .th{font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .typeblock .tv{font-size:13px;color:var(--sub)}
  .row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)}
  .row:last-child{border-bottom:none}
  .row .label{font-size:12px;color:var(--sub);font-weight:700}
  .row .val{font-size:14.5px;font-weight:700;text-align:right}
  .bigmap{display:block;text-align:center;margin-top:14px;background:var(--blue);color:#fff;font-weight:900;padding:13px;border-radius:12px;text-decoration:none;font-size:15px}
  .updated{color:var(--sub);font-size:11px;text-align:center;padding:10px 0 0}
  .updated a{color:var(--sub);text-decoration:underline}
  .courserow button.locked{opacity:.55}
  .lockscreen{position:fixed;inset:0;background:var(--bg);color:var(--text);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
  .lockscreen input{width:220px;text-align:center;font-size:18px;letter-spacing:2px;padding:11px 12px;border-radius:10px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text)}
  .lockscreen button{border:none;border-radius:10px;padding:11px 22px;font-weight:800;font-size:14px;background:var(--orange);color:#fff;cursor:pointer}
  .banner{display:block;width:100%;aspect-ratio:1200/335;object-fit:cover;background:#1a2a4a}
</style>
</head>
<body>

<div id="errBanner" style="display:none;position:fixed;top:0;left:0;right:0;background:#cf4335;color:#fff;font-size:12px;padding:10px 14px;z-index:999;white-space:pre-wrap;word-break:break-word"></div>

<div class="lockscreen" id="lockscreen">
  <div style="font-size:34px">🔒</div>
  <div style="font-weight:800">閲覧用パスコード</div>
  <input type="text" id="passInput" autocapitalize="off" autocorrect="off" placeholder="パスコード">
  <button id="passBtn">開く</button>
  <div id="passErr" style="color:#cf4335;font-size:12px;display:none">パスコードが違います</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
/* ==== エラーを画面に表示（デバッグ用） ==== */
function hideErr() { const b = document.getElementById('errBanner'); if (b && b.dataset.sticky !== '1') b.style.display = 'none'; }
function showErr(msg, sticky = true) {
  const b = document.getElementById('errBanner');
  b.textContent = '⚠️ ' + msg + '（タップで閉じる）';
  b.dataset.sticky = sticky ? '1' : '0';
  b.style.display = 'block';
  b.onclick = () => { b.style.display = 'none'; };
}
window.addEventListener('error', e => showErr('スクリプトエラー: ' + (e.message || e) + (e.filename ? ` (${e.filename}:${e.lineno})` : '')));
window.addEventListener('unhandledrejection', e => showErr('通信/非同期エラー: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)));
if (typeof firebase === 'undefined') {
  showErr('Firebaseの読み込みに失敗しました。通信環境をご確認のうえ、リロードしてください。（広告ブロッカー等が原因の場合もあります）');
}

const firebaseConfig = {
  apiKey: "AIzaSyD8JW9526h0TKa9_hEaGrmlpVG8NeW4c3Q",
  authDomain: "hirataku1102.firebaseapp.com",
  projectId: "hirataku1102",
  storageBucket: "hirataku1102.firebasestorage.app",
  messagingSenderId: "219252490669",
  appId: "1:219252490669:web:bb3d9dc019a17a5a01e124"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ==== パスコード（24時間以上操作がない時だけ再確認） ==== */
const VIEW_PASSCODE = "daybreak2026"; // ← パスコードを変えたい場合はここを編集してください
const IDLE_LIMIT_MS = 24 * 60 * 60 * 1000; // 24時間
function markActive() { try { localStorage.setItem('cm_view_unlocked_at', String(Date.now())); } catch (e) {} }
function recentlyUnlocked() {
  try {
    const t = localStorage.getItem('cm_view_unlocked_at');
    return !!t && (Date.now() - parseInt(t, 10)) < IDLE_LIMIT_MS;
  } catch (e) { return false; }
}
/* 閲覧範囲：full=全コース / limited=選ばれたコースのみ（editorの🔑で登録） */
const ACCESS_DOC_ID = '_access';
let access = { type: 'full' };
try { const a = JSON.parse(localStorage.getItem('cm_view_access') || 'null'); if (a && a.type) access = a; } catch (e) {}
function saveAccess() { try { localStorage.setItem('cm_view_access', JSON.stringify(access)); } catch (e) {} }
function isLimited() { return access.type === 'limited'; }
function canView(courseId) { return !isLimited() || (access.courseIds || []).includes(courseId); }
let unlocked = recentlyUnlocked();
if (unlocked) { document.getElementById('lockscreen').style.display = 'none'; markActive(); }
document.addEventListener('click', () => { if (document.getElementById('lockscreen').style.display === 'none') markActive(); });
document.getElementById('passBtn').onclick = tryUnlock;
document.getElementById('passInput').addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
function showLock(msg) {
  try { localStorage.removeItem('cm_view_unlocked_at'); } catch (e) {}
  unlocked = false;
  document.getElementById('passInput').value = '';
  const err = document.getElementById('passErr');
  if (msg) { err.textContent = msg; err.style.display = 'block'; } else err.style.display = 'none';
  document.getElementById('lockscreen').style.display = 'flex';
}
function clearViewCache() { try { localStorage.removeItem(CACHE_KEY); } catch (e) {} }
async function tryUnlock() {
  const v = document.getElementById('passInput').value.trim();
  const err = document.getElementById('passErr');
  const btn = document.getElementById('passBtn');
  if (!v) return;
  let next = null;
  if (v === VIEW_PASSCODE) next = { type: 'full' };
  else {
    btn.disabled = true; btn.textContent = '確認中…';
    try {
      const d = await getWithRetry(db.collection('cm_courses').doc(ACCESS_DOC_ID), 2);
      const pass = d.exists ? (d.data().passes || []).find(p => p.code === v) : null;
      if (pass) next = { type: 'limited', passId: pass.id, label: pass.label || '', courseIds: pass.courseIds || [] };
    } catch (e) { console.error(e); err.textContent = '通信に失敗しました。電波の良い場所でもう一度お試しください'; err.style.display = 'block'; btn.disabled = false; btn.textContent = '開く'; return; }
    btn.disabled = false; btn.textContent = '開く';
  }
  if (!next) { err.textContent = 'パスコードが違います'; err.style.display = 'block'; return; }
  const changed = JSON.stringify(next) !== JSON.stringify(access);
  access = next; saveAccess(); markActive(); unlocked = true;
  document.getElementById('lockscreen').style.display = 'none';
  err.style.display = 'none';
  if (changed) { clearViewCache(); mode = 'search'; activeCourseId = null; }
  await load(changed);
}
/* 制限付きの場合、editor側で変更・削除されていないか確認 */
async function refreshAccess() {
  if (!isLimited()) return true;
  let d;
  try { d = await getWithRetry(db.collection('cm_courses').doc(ACCESS_DOC_ID), 2); } catch (e) { return true; } // 圏外時は前回の範囲で表示
  const pass = d.exists ? (d.data().passes || []).find(p => p.id === access.passId) : null;
  if (!pass) { access = { type: 'full' }; saveAccess(); clearViewCache(); showLock('パスワードが変更されました。新しいパスワードを入力してください'); return false; }
  const next = { type: 'limited', passId: pass.id, label: pass.label || '', courseIds: pass.courseIds || [] };
  access = next; saveAccess();
  return true;
}

function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('cm_theme_viewer', t); } catch (e) {}
}
let savedTheme = 'dark'; // viewerの初期設定はダーク（editorとは別に記憶）
try { savedTheme = localStorage.getItem('cm_theme_viewer') || 'dark'; } catch (e) {}
applyTheme(savedTheme);
document.getElementById('themeBtn').onclick = () => applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');

const WASTE_TYPES = [
  { key: 'combustible', label: '可燃ゴミ', icon: '🔥' },
  { key: 'cardboard', label: 'ダンボール', icon: '📦' },
  { key: 'beverage', label: '飲料容器', icon: '🥤' },
  { key: 'styrofoam', label: '発泡スチロール', icon: '🧊' },
  { key: 'vinyl', label: 'ビニール', icon: '🛍️' },
];
function storagePath(custId, photoId) { return photoId === '__legacy__' ? `course-photos/${custId}.jpg` : `course-photos/${custId}__${photoId}.jpg`; }
function photoUrlFor(custId, photoId) { return `https://firebasestorage.googleapis.com/v0/b/${firebaseConfig.storageBucket}/o/${encodeURIComponent(storagePath(custId, photoId))}?alt=media`; }
function customerPhotoIds(cu) { if (cu.photos && cu.photos.length) return cu.photos; if (cu.hasPhoto) return ['__legacy__']; return []; }
function openLightbox(custId) {
  const cu = customers.find(c => c.id === custId);
  const ids = cu ? customerPhotoIds(cu) : [];
  document.getElementById('lightboxStrip').innerHTML = ids.map(id => `<img src="${photoUrlFor(custId, id)}">`).join('');
  document.getElementById('lightbox').classList.add('show');
}
document.getElementById('lightboxClose').onclick = () => document.getElementById('lightbox').classList.remove('show');
function mapsUrl(addr) { return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(addr); }
function esc(s) { return (s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

let courses = [];
let customers = [];
let mode = 'search'; // 'search' | wasteType key
let activeCourseId = null;
let dayFilter = 'all'; // 'all' | '日'..'土'
function todayChar() { return ['日','月','火','水','木','金','土'][new Date().getDay()]; }

let loadedCourseIds = new Set();
let allCustomersLoaded = false;
const CACHE_KEY = 'cm_view_cache_v2';

function normalizeDoc(d) {
  const data = { id: d.id, ...d.data() };
  if (data.updatedAt && data.updatedAt.toMillis) data.updatedAt = data.updatedAt.toMillis();
  return data;
}
function saveCache() {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({ courses, customers, loadedCourseIds: [...loadedCourseIds], allCustomersLoaded, savedAt: Date.now() }));
  } catch (e) { /* 容量オーバー等は無視（キャッシュなしで動作） */ }
}
function readCache() {
  try { const t = localStorage.getItem(CACHE_KEY); return t ? JSON.parse(t) : null; } catch (e) { return null; }
}
async function getWithRetry(queryRef, tries = 4) {
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try { return await queryRef.get({ source: 'server' }); }
    catch (e) { lastErr = e; if (i < tries - 1) await new Promise(r => setTimeout(r, 800 * (i + 1))); }
  }
  throw lastErr;
}
function mergeCustomersInto(docs) {
  const fetched = docs.map(normalizeDoc);
  const ids = new Set(fetched.map(c => c.id));
  customers = customers.filter(c => !ids.has(c.id)).concat(fetched);
}
async function ensureAllCustomersLoaded() {
  if (allCustomersLoaded) return;
  const snap = await getWithRetry(db.collection('cm_customers'));
  mergeCustomersInto(snap.docs);
  allCustomersLoaded = true;
  for (const c of courses) loadedCourseIds.add(c.id);
  saveCache();
}
async function ensureCourseLoaded(courseId) {
  if (!courseId || allCustomersLoaded || loadedCourseIds.has(courseId)) return;
  const snap = await getWithRetry(db.collection('cm_customers').where('courseIds', 'array-contains', courseId));
  if (snap.empty && !isLimited()) { await ensureAllCustomersLoaded(); return; } // 旧形式データへの保険
  mergeCustomersInto(snap.docs);
  loadedCourseIds.add(courseId);
  saveCache();
}
function showUpdated(ts) {
  document.getElementById('updatedAt').textContent = ts ? 'データ取得: ' + new Date(ts).toLocaleString('ja-JP', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }) + '（🔄で最新に更新）' : '';
}
function showListLoading() { document.getElementById('list').innerHTML = `<div class="empty">読み込み中…</div>`; }
function showListError(retryFn) {
  document.getElementById('list').innerHTML = '<div class="empty">データを読み込めませんでした。通信環境をご確認ください。<br><button style="margin-top:12px;background:var(--orange);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-weight:800" onclick="' + retryFn + '">再読み込み</button></div>';
}
async function load(forceFresh = false) {
  if (!unlocked) return;
  if (!(await refreshAccess())) return;
  const cache = forceFresh ? null : readCache();
  if (cache && cache.courses && cache.courses.length) {
    courses = cache.courses; customers = cache.customers || [];
    loadedCourseIds = new Set(cache.loadedCourseIds || []); allCustomersLoaded = !!cache.allCustomersLoaded;
    showUpdated(cache.savedAt);
  } else {
    courses = []; customers = []; loadedCourseIds = new Set(); allCustomersLoaded = false;
    showListLoading();
    try {
      const snap = await getWithRetry(db.collection('cm_courses'));
      courses = snap.docs.filter(d => !d.id.startsWith('_')).map(normalizeDoc);
      saveCache();
      showUpdated(Date.now());
    } catch (e) { console.error(e); showListError('load(true)'); return; }
  }
  if (isLimited() && mode === 'search') {
    const firstAllowed = WASTE_TYPES.find(w => sortedCoursesOf(w.key).some(c => canView(c.id)));
    mode = firstAllowed ? firstAllowed.key : WASTE_TYPES[0].key;
    activeCourseId = null;
  }
  if (mode !== 'search' && !courses.some(c => c.id === activeCourseId)) activeCourseId = defaultCourseFor(mode);
  renderTopTabs(); renderCourseTabs(); renderDayTabs(); renderAccessInfo();
  await openActiveCourse();
}
function sortedCoursesOf(type) { return courses.filter(c => c.wasteType === type).sort((a,b)=>(a.order??0)-(b.order??0)); }
function defaultCourseFor(type) {
  const list = sortedCoursesOf(type);
  const first = list.find(c => canView(c.id)) || list[0];
  return first ? first.id : null;
}
function renderAccessInfo() {
  const el = document.getElementById('accessInfo');
  el.innerHTML = isLimited()
    ? `閲覧範囲：${esc(access.label || '限定')}（${(access.courseIds || []).filter(id => courses.some(c => c.id === id)).length}コース）　<a href="#" id="changePassLink">パスワードを変更</a>`
    : `<a href="#" id="changePassLink">パスワードを変更</a>`;
  document.getElementById('changePassLink').onclick = e => { e.preventDefault(); showLock(''); };
}
async function openActiveCourse() {
  if (mode !== 'search' && activeCourseId && !canView(activeCourseId)) { renderList(); return; }
  if (mode !== 'search' && activeCourseId && !allCustomersLoaded && !loadedCourseIds.has(activeCourseId)) {
    showListLoading();
    try { await ensureCourseLoaded(activeCourseId); } catch (e) { console.error(e); showListError('openActiveCourse()'); return; }
  }
  renderList();
}

function renderTopTabs() {
  const box = document.getElementById('topTabs');
  box.innerHTML = (isLimited() ? '' : `<button data-m="search" class="${mode === 'search' ? 'active' : ''}">🔎 検索</button>`) +
    WASTE_TYPES.map(w => `<button data-m="${w.key}" class="${mode === w.key ? 'active' : ''}">${w.icon} ${w.label}</button>`).join('');
  box.querySelectorAll('button').forEach(b => b.onclick = () => {
    mode = b.dataset.m;
    dayFilter = 'all';
    selectedIds.clear();
    if (mode !== 'search') activeCourseId = defaultCourseFor(mode);
    document.getElementById('search').value = '';
    updateFab();
    renderTopTabs(); renderCourseTabs(); renderDayTabs(); openActiveCourse();
  });
}

function renderDayTabs() {
  const box = document.getElementById('dayTabs');
  if (mode === 'search' || (activeCourseId && !canView(activeCourseId))) { box.innerHTML = ''; return; }
  const today = todayChar();
  const chips = [
    { key: 'all', label: '全て' },
    { key: today, label: `今日（${today}）` },
    ...['日','月','火','水','木','金','土'].filter(d => d !== today).map(d => ({ key: d, label: d })),
  ];
  box.innerHTML = chips.map(c => `<button data-d="${c.key}" class="${dayFilter === c.key ? 'active' : ''}">${c.label}</button>`).join('');
  box.querySelectorAll('button').forEach(b => b.onclick = () => { dayFilter = b.dataset.d; renderDayTabs(); renderList(); });
}

function renderCourseTabs() {
  const box = document.getElementById('courseTabs');
  if (mode === 'search') { box.innerHTML = ''; return; }
  const list = courses.filter(c => c.wasteType === mode).sort((a,b)=>(a.order??0)-(b.order??0));
  box.innerHTML = list.map(c => `
    <button data-c="${c.id}" class="${c.id === activeCourseId ? 'active' : ''}${canView(c.id) ? '' : ' locked'}">${canView(c.id) ? `<span class="dot" style="background:${c.color}"></span>` : '🔒 '}${esc(courseLabel(c))}</button>
  `).join('');
  box.querySelectorAll('button').forEach(b => b.onclick = () => { activeCourseId = b.dataset.c; dayFilter = 'all'; selectedIds.clear(); updateFab(); renderCourseTabs(); renderDayTabs(); openActiveCourse(); });
}

function courseLabel(c) { return c ? (c.group ? `${c.group}（${c.name}）` : c.name) : '未設定'; }
function matchesQuery(cu, q) {
  return (cu.name||'').toLowerCase().includes(q) || (cu.address||'').toLowerCase().includes(q) || (cu.mgmtNo||'').toLowerCase().includes(q);
}
function getAssignments(cu, type) {
  const it = cu.items && cu.items[type];
  if (!it) return [];
  return Array.isArray(it) ? it : [it];
}
function findAssignment(cu, type, courseId) {
  return getAssignments(cu, type).find(a => a.courseId === courseId) || null;
}
function withLegacyFallback(cu, a) {
  if (!a) return null;
  return {
    ...a,
    hasKey: a.hasKey !== undefined ? a.hasKey : (cu.hasKey || false),
    keyNumber: a.keyNumber !== undefined ? a.keyNumber : (cu.keyNumber || ''),
    memo: a.memo !== undefined ? a.memo : (cu.memo || ''),
  };
}
function customerTypeBadges(cu, excludeType) {
  return WASTE_TYPES.filter(w => w.key !== excludeType).flatMap(w =>
    getAssignments(cu, w.key).map(raw => {
      const a = withLegacyFallback(cu, raw);
      const course = courses.find(c => c.id === a.courseId);
      const daysStr = a.days && a.days.length ? a.days.join('') : '';
      return `<div class="badgeline"><span class="badge type">${w.icon} ${esc(courseLabel(course))}</span>${daysStr ? `<span class="badge days">${daysStr}</span>` : ''}</div>`;
    })
  ).join('');
}

async function renderList() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const list = document.getElementById('list');

  if (mode === 'search') {
    if (isLimited()) { list.innerHTML = ''; return; }
    if (!q) { document.getElementById('meta').textContent = ''; list.innerHTML = `<div class="empty">得意先名・住所・管理番号を入力して検索してください。</div>`; return; }
    if (!allCustomersLoaded) {
      showListLoading();
      try { await ensureAllCustomersLoaded(); } catch (e) { console.error(e); list.innerHTML = `<div class="empty">読み込みに失敗しました。通信環境をご確認ください。</div>`; return; }
      if (document.getElementById('search').value.trim().toLowerCase() !== q) return;
    }
    document.getElementById('meta').textContent = '検索結果';
    const results = customers.filter(c => matchesQuery(c, q));
    if (!results.length) { list.innerHTML = `<div class="empty">該当する得意先が見つかりません。</div>`; return; }
    list.innerHTML = results.map(cu => `
      <div class="card" onclick="openSheet('${cu.id}')">
        ${cu.hasPhoto || (cu.photos && cu.photos.length) ? `<div class="thumbwrap"><img class="thumb" src="${photoUrlFor(cu.id, customerPhotoIds(cu)[0])}" onclick="event.stopPropagation();openLightbox('${cu.id}')" onerror="this.parentElement.remove()">${customerPhotoIds(cu).length>1?`<span class="thumbcount">${customerPhotoIds(cu).length}</span>`:''}</div>` : ''}
        <div class="info">
          <div class="name">${esc(cu.name)}</div>
          ${cu.address ? `<div class="addr">${esc(cu.address)}</div>` : ''}
          ${customerTypeBadges(cu)}
        </div>
        ${cu.address ? `<a class="maplink" href="${mapsUrl(cu.address)}" target="_blank" onclick="event.stopPropagation()">📍</a>` : ''}
      </div>
    `).join('');
    return;
  }

  const course = courses.find(c => c.id === activeCourseId);
  if (course && !canView(course.id)) {
    document.getElementById('meta').textContent = courseLabel(course);
    list.innerHTML = `<div class="empty">🔒 閲覧権限がありません。<br><span style="font-size:12.5px">このコースを見る必要がある場合は、管理者にパスワードを確認してください。</span></div>`;
    return;
  }
  if (!course) { document.getElementById('meta').textContent = ''; list.innerHTML = `<div class="empty">この品目にはまだコースが登録されていません。</div>`; return; }
  let items = customers.filter(c => findAssignment(c, mode, course.id));
  items.sort((a, b) => (findAssignment(a, mode, course.id).order ?? 0) - (findAssignment(b, mode, course.id).order ?? 0));
  if (dayFilter !== 'all') items = items.filter(c => { const a = findAssignment(c, mode, course.id); return a.days && a.days.includes(dayFilter); });
  if (q) items = items.filter(c => matchesQuery(c, q));
  document.getElementById('meta').textContent = `${courseLabel(course)}${dayFilter !== 'all' ? '　' + dayFilter + '曜日のみ' : ''}　${items.length}件`;
  if (!items.length) { list.innerHTML = `<div class="empty">${dayFilter !== 'all' ? `${dayFilter}曜日の得意先はありません。` : (q ? '該当する得意先がありません。' : 'このコースにはまだ得意先が登録されていません。')}</div>`; return; }
  list.innerHTML = items.map((cu, i) => {
    const it = withLegacyFallback(cu, findAssignment(cu, mode, course.id));
    return `
    <div class="card" onclick="openSheet('${cu.id}')">
      <div class="num">${i + 1}</div>
      ${cu.hasPhoto || (cu.photos && cu.photos.length) ? `<div class="thumbwrap"><img class="thumb" src="${photoUrlFor(cu.id, customerPhotoIds(cu)[0])}" onclick="event.stopPropagation();openLightbox('${cu.id}')" onerror="this.parentElement.remove()">${customerPhotoIds(cu).length>1?`<span class="thumbcount">${customerPhotoIds(cu).length}</span>`:''}</div>` : ''}
      <div class="info">
        <div class="name">${esc(cu.name)}</div>
        <div class="badges">
          ${it.hasKey ? `<span class="badge key">🔑 ${esc(it.keyNumber || '鍵あり')}</span>` : ''}
          ${it.days && it.days.length ? `<span class="badge days">${it.days.join('')}</span>` : ''}
        </div>
        ${it.memo ? `<div class="addr">📝 ${esc(it.memo)}</div>` : ''}
        ${customerTypeBadges(cu, mode)}
      </div>
      ${cu.address ? `<input type="checkbox" class="routecheck" data-route="${cu.id}" ${selectedIds.has(cu.id) ? 'checked' : ''}>` : ''}
      ${cu.address ? `<a class="maplink" href="${mapsUrl(cu.address)}" target="_blank" onclick="event.stopPropagation()">📍</a>` : ''}
    </div>`;
  }).join('');
  list.querySelectorAll('[data-route]').forEach(cb => cb.addEventListener('click', e => {
    e.stopPropagation();
    if (cb.checked) selectedIds.add(cb.dataset.route); else selectedIds.delete(cb.dataset.route);
    updateFab();
  }));
}

let selectedIds = new Set();
function updateFab() {
  const fab = document.getElementById('routeFab');
  if (selectedIds.size >= 1) { fab.classList.add('show'); fab.textContent = `📍 選択した${selectedIds.size}件をまとめて開く`; }
  else fab.classList.remove('show');
}
document.getElementById('routeFab').onclick = () => {
  const course = courses.find(c => c.id === activeCourseId);
  if (!course) return;
  const items = customers.filter(c => findAssignment(c, mode, course.id) && selectedIds.has(c.id));
  items.sort((a, b) => (findAssignment(a, mode, course.id).order ?? 0) - (findAssignment(b, mode, course.id).order ?? 0));
  const addrs = items.map(c => c.address).filter(Boolean);
  if (!addrs.length) return;
  if (addrs.length === 1) { window.open(mapsUrl(addrs[0]), '_blank'); return; }
  const destination = addrs[addrs.length - 1];
  const waypoints = addrs.slice(0, -1);
  const url = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(destination)}&waypoints=${waypoints.map(encodeURIComponent).join('|')}&travelmode=driving`;
  window.open(url, '_blank');
};

function openSheet(custId) {
  const cu = customers.find(c => c.id === custId);
  document.getElementById('sheetName').textContent = cu.name;
  const photoIds = customerPhotoIds(cu);
  const photoHtml = photoIds.length
    ? `<div class="photostrip">${photoIds.map(pid => `<img src="${photoUrlFor(cu.id, pid)}" onclick="openLightbox('${cu.id}')" onerror="this.style.display='none'">`).join('')}</div>`
    : `<div class="photo-ph">写真なし</div>`;
  const typeBlocks = WASTE_TYPES.flatMap(w =>
    getAssignments(cu, w.key).map(raw => {
      const it = withLegacyFallback(cu, raw);
      const course = courses.find(c => c.id === it.courseId);
      return `<div class="typeblock">
        <div class="th">${w.icon} ${w.label}</div>
        <div class="tv">${esc(courseLabel(course))}${it.days && it.days.length ? '　回収曜日: ' + it.days.join('・') : ''}</div>
        ${it.hasKey ? `<div class="tv">🔑 ${esc(it.keyNumber || '鍵あり')}</div>` : ''}
        ${it.memo ? `<div class="tv">📝 ${esc(it.memo)}</div>` : ''}
      </div>`;
    })
  ).join('') || `<p style="color:var(--sub);font-size:13px">登録されている品目がありません。</p>`;
  document.getElementById('sheetBody').innerHTML = `
    ${photoHtml}
    ${typeBlocks}
    ${cu.address ? `<div class="row"><span class="label">住所</span><span class="val">${esc(cu.address)}</span></div>` : ''}
    ${cu.address ? `<a class="bigmap" href="${mapsUrl(cu.address)}" target="_blank">📍 Googleマップで開く</a>` : ''}
  `;
  document.getElementById('overlay').classList.add('show');
}
function closeSheet() { document.getElementById('overlay').classList.remove('show'); }
document.getElementById('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeSheet(); });
document.getElementById('search').addEventListener('input', renderList);

const loadTimeout = setTimeout(() => showErr('読み込みに時間がかかっています。電波の良い場所で開き直すか、しばらくしてから再度お試しください。', false), 25000);
document.getElementById('reloadBtn').onclick = async () => {
  const btn = document.getElementById('reloadBtn'); btn.disabled = true;
  await load(true);
  btn.disabled = false;
};
load().finally(() => { clearTimeout(loadTimeout); hideErr(); });

</script>
</body>
</html>
