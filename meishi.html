<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="名刺管理">
<meta name="theme-color" content="#ffffff">
<title>名刺管理</title>
<style>
:root{
  --bg:#ffffff;--bg2:#f4f5f7;--card:#ffffff;--line:#e2e4e8;--text:#1d1f23;--sub:#6b7079;
  --accent:#1a6fd1;--accent-bg:#e8f1fc;--danger:#d23b3b;--star:#f0a500;--ok:#1f9d55;
  --shadow:0 2px 10px rgba(0,0,0,.08);
}
:root[data-theme="dark"]{
  --bg:#15171b;--bg2:#1e2127;--card:#22262d;--line:#33373f;--text:#e9ebee;--sub:#9aa0a9;
  --accent:#5aa2f0;--accent-bg:#1f2f44;--danger:#f06a6a;--star:#ffc23d;--ok:#4cc985;
  --shadow:0 2px 10px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ロック画面 */
#lock{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:100;padding:24px}
#lock h1{font-size:22px;margin:0}
#lock input{width:220px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);text-align:center;font-size:18px}
#lock .err{color:var(--danger);font-size:13px;min-height:18px}

/* ヘッダー */
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
.hrow{display:flex;align-items:center;gap:6px}
.hrow h1{font-size:17px;margin:0 auto 0 0;white-space:nowrap}
.icon-btn{border:none;background:var(--bg2);border-radius:9px;width:36px;height:36px;font-size:17px;display:flex;align-items:center;justify-content:center}
.search{margin-top:8px;position:relative}
.search input{width:100%;padding:10px 34px 10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);font-size:16px}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--sub);font-size:18px}
.filters{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters select,.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:6px 10px;font-size:13px}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.countline{font-size:12px;color:var(--sub);margin-top:6px;display:flex;justify-content:space-between}

/* 一覧 */
main{padding:0 34px 120px 12px}
.sec-h{position:sticky;top:var(--hh,150px);z-index:5;background:var(--bg2);color:var(--sub);font-weight:700;font-size:13px;padding:4px 10px;margin:10px -34px 6px -12px}
.row{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line)}
.row .th{width:92px;height:56px;border-radius:6px;background:var(--bg2);object-fit:cover;flex:none;border:1px solid var(--line)}
.row .info{min-width:0;flex:1}
.row .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .kn{font-size:11px;color:var(--sub);font-weight:400;margin-left:4px}
.row .co{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.tag{font-size:11px;padding:1px 6px;border-radius:5px;background:var(--accent-bg);color:var(--accent)}
.tag.cust{background:#e7f6ec;color:#1f7a43}
:root[data-theme="dark"] .tag.cust{background:#1d3626;color:#6fd69a}
.tag.fu{background:#fdecec;color:var(--danger)}
.stars{color:var(--star);font-size:12px;letter-spacing:-1px}
.empty{text-align:center;color:var(--sub);padding:60px 10px;line-height:1.8}

/* 五十音インデックス */
#idx{position:fixed;right:2px;top:50%;transform:translateY(-50%);z-index:30;display:flex;flex-direction:column;align-items:center;background:var(--bg2);border-radius:14px;padding:6px 2px;touch-action:none;user-select:none;-webkit-user-select:none}
#idx span{font-size:12px;font-weight:700;color:var(--accent);padding:3px 6px;line-height:1.15}
#idx span.off{color:var(--line)}
#bubble{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);width:84px;height:84px;border-radius:18px;background:rgba(0,0,0,.65);color:#fff;font-size:44px;font-weight:700;display:flex;align-items:center;justify-content:center;z-index:90;pointer-events:none}

/* FAB */
.fab{position:fixed;right:44px;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:25;border:none;background:var(--accent);color:#fff;border-radius:28px;padding:14px 20px;font-size:15px;font-weight:700;box-shadow:var(--shadow)}
.fab2{right:auto;left:14px;background:var(--card);color:var(--text);border:1px solid var(--line)}

/* スライド表示 */
#slider{position:fixed;inset:0;background:#0f1013;z-index:60;display:flex;flex-direction:column}
#slider .top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;color:#fff}
#slider .top .gy{font-size:22px;font-weight:700;min-width:36px}
#slider .top .pos{font-size:13px;color:#aaa;margin-right:auto}
#slider .top button{background:#2a2d33;color:#fff;border:none;border-radius:9px;padding:8px 12px}
#track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#track::-webkit-scrollbar{display:none}
.slide{flex:none;width:100vw;scroll-snap-align:center;scroll-snap-stop:normal;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 18px 20px;gap:12px}
.slide .imgwrap{width:100%;max-width:560px;aspect-ratio:91/55;background:#22252b;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.slide img{max-width:100%;max-height:100%;object-fit:contain}
.slide .noimg{color:#777;font-size:13px}
.slide .cap{color:#fff;text-align:center}
.slide .cap .n{font-size:20px;font-weight:700}
.slide .cap .c{font-size:14px;color:#bbb;margin-top:2px}
.slide .cap .hint{font-size:11px;color:#777;margin-top:6px}
.slide .open{background:#fff;color:#111;border:none;border-radius:20px;padding:8px 22px;font-weight:700}
#slider #idx2{position:absolute;right:2px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;background:rgba(255,255,255,.08);border-radius:14px;padding:6px 2px;touch-action:none;user-select:none;-webkit-user-select:none}
#idx2 span{font-size:12px;font-weight:700;color:#8fc0ff;padding:3px 6px;line-height:1.15}
#idx2 span.off{color:#444}

/* モーダル */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom) + 20px)}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:16px}}
.sheet-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;position:sticky;top:-14px;background:var(--bg);padding:6px 0;z-index:2}
.sheet-h h2{font-size:17px;margin:0 auto 0 0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.dng{color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* 詳細 */
.dimg{position:relative;width:100%;aspect-ratio:91/55;background:var(--bg2);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.dimg img{max-width:100%;max-height:100%;object-fit:contain}
.dimg .flip{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:14px;padding:5px 10px;font-size:12px}
.dname{font-size:22px;font-weight:700;margin-top:12px}
.dkana{font-size:12px;color:var(--sub)}
.dco{font-size:15px;margin-top:4px}
.dtitle{font-size:13px;color:var(--sub)}
.dl{margin-top:12px;border-top:1px solid var(--line)}
.dl .it{display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);align-items:flex-start}
.dl .k{width:76px;flex:none;color:var(--sub);font-size:12px;padding-top:2px}
.dl .v{flex:1;word-break:break-all;white-space:pre-wrap}
.dl .v a{color:var(--accent);text-decoration:none}
.dl .act{flex:none;border:none;background:var(--bg2);border-radius:7px;padding:4px 8px;font-size:12px}
details.raw{margin-top:10px;font-size:13px;color:var(--sub)}
details.raw pre{white-space:pre-wrap;background:var(--bg2);padding:10px;border-radius:8px;font-family:inherit}

/* 編集 */
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{border:2px dashed var(--line);border-radius:10px;aspect-ratio:91/55;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;overflow:hidden;background:var(--bg2);color:var(--sub);font-size:13px;text-align:center}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--bg2)}
.slot .ctl{position:absolute;bottom:4px;right:4px;display:flex;gap:4px;z-index:2}
.slot .ctl button{border:none;background:rgba(0,0,0,.6);color:#fff;border-radius:7px;padding:4px 7px;font-size:12px}
.slot input{position:absolute;inset:0;opacity:0;z-index:1}
.ocrbar{display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap}
.ocrbar .msg{font-size:12px;color:var(--sub);flex:1}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.f{display:flex;flex-direction:column;gap:3px}
.f.full{grid-column:1/-1}
.f label{font-size:12px;color:var(--sub)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg2);border-radius:8px;padding:9px 10px;font-size:16px;width:100%}
.f textarea{min-height:64px;resize:vertical}
.f .hl{font-size:11px;color:var(--sub)}
.stars-in{display:flex;gap:4px}
.stars-in button{border:1px solid var(--line);background:var(--bg2);border-radius:8px;padding:6px 10px;font-size:13px}
.stars-in button.on{background:var(--star);border-color:var(--star);color:#fff}
.groupt{grid-column:1/-1;font-size:13px;font-weight:700;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.sug{position:relative}
.sugbox{position:absolute;left:0;right:0;top:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:5;max-height:220px;overflow-y:auto}
.sugbox div{padding:9px 10px;border-bottom:1px solid var(--line);font-size:14px}
.sugbox div small{display:block;color:var(--sub);font-size:11px}
.warn{background:#fff6e0;color:#8a5a00;border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px}
:root[data-theme="dark"] .warn{background:#3a2f12;color:#ffd277}

/* 読み込み */
#busy{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:95;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#fff}
.spin{width:42px;height:42px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:99;max-width:90vw;text-align:center}
#zoom{position:fixed;inset:0;background:#000;z-index:98;display:flex;align-items:center;justify-content:center;overflow:auto}
#zoom img{max-width:100%;max-height:100%;touch-action:pinch-zoom}
#zoom button{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:12px;background:#333;color:#fff;border:none;border-radius:20px;padding:8px 14px}
.set-sec{border-top:1px solid var(--line);padding:12px 0}
.set-sec h3{font-size:14px;margin:0 0 8px}
.set-sec p{font-size:12px;color:var(--sub);margin:4px 0 8px;line-height:1.6}
.listedit{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.listedit span{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:4px 6px 4px 10px;font-size:13px;display:flex;align-items:center;gap:4px}
.listedit span button{border:none;background:none;color:var(--sub);font-size:14px;padding:0 2px}
.inl{display:flex;gap:6px}
.inl input,.inl select{flex:1;border:1px solid var(--line);background:var(--bg2);border-radius:8px;padding:8px 10px;font-size:16px;min-width:0}
</style>
</head>
<body>

<!-- ロック -->
<div id="lock">
  <div style="font-size:40px">📇</div>
  <h1>名刺管理</h1>
  <input id="passIn" type="password" inputmode="text" placeholder="パスコード" autocomplete="current-password">
  <button class="btn pri" id="passBtn" style="width:220px">開く</button>
  <div class="err" id="passErr"></div>
</div>

<header id="hdr">
  <div class="hrow">
    <h1>📇 名刺管理</h1>
    <button class="icon-btn" id="btnSlide" title="スライドで探す">🃏</button>
    <button class="icon-btn" id="btnReload" title="最新化">🔄</button>
    <button class="icon-btn" id="btnTheme" title="表示切替">🌙</button>
    <button class="icon-btn" id="btnSet" title="設定">⚙️</button>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="名前・会社・住所・電話・メモ… 何でも検索" autocomplete="off">
    <button class="clear hidden" id="qClear">✕</button>
  </div>
  <div class="filters">
    <select id="fSort">
      <option value="kana">人名 あいうえお順</option>
      <option value="company">会社名 あいうえお順</option>
      <option value="date">交換日 新しい順</option>
      <option value="imp">重要度 高い順</option>
    </select>
    <select id="fCat"><option value="">分類：すべて</option></select>
    <select id="fOwner"><option value="">担当：すべて</option></select>
    <select id="fImp">
      <option value="">重要度：すべて</option>
      <option value="3">★★★のみ</option>
      <option value="2">★★以上</option>
    </select>
    <button class="chip" id="fFollow">🔔 要フォロー</button>
    <button class="chip" id="fNoCust">得意先未設定</button>
  </div>
  <div class="countline"><span id="count"></span><span id="loadedAt"></span></div>
</header>

<main id="list"></main>
<div id="idx"></div>

<button class="fab fab2" id="fabSlide">🃏 めくって探す</button>
<button class="fab" id="fabAdd">＋ 名刺を追加</button>

<!-- スライド -->
<div id="slider" class="hidden">
  <div class="top">
    <span class="gy" id="slGy">あ</span>
    <span class="pos" id="slPos"></span>
    <button id="slClose">✕ 閉じる</button>
  </div>
  <div id="track"></div>
  <div id="idx2"></div>
</div>

<!-- 詳細 -->
<div class="modal hidden" id="mDetail"><div class="sheet" id="detailBody"></div></div>
<!-- 編集 -->
<div class="modal hidden" id="mEdit"><div class="sheet" id="editBody"></div></div>
<!-- 設定 -->
<div class="modal hidden" id="mSet"><div class="sheet" id="setBody"></div></div>

<div id="busy" class="hidden"><div class="spin"></div><div id="busyMsg">処理中…</div></div>
<div id="bubble" class="hidden"></div>
<div id="toast" class="hidden"></div>
<div id="zoom" class="hidden"><button id="zoomClose">✕ 閉じる</button><img id="zoomImg" alt=""></div>

<script type="module">
/* =========================================================
   名刺管理アプリ  meishi.html
   ・Firebase(コース表と同じプロジェクト)  Firestore: mc_cards / mc_settings
   ・画像: Storage の meishi/ 以下
   ・文字起こし: Google Gemini API(キーはこの端末にだけ保存)
   ========================================================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, getDocs, getDoc, setDoc, deleteDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

/* ★★★ ここだけ設定 ★★★
   apiKey / authDomain は editor.html の firebaseConfig と同じ値を貼ってください */
const firebaseConfig = {
  apiKey: "AIzaSyD8JW9526h0TKa9_hEaGrmlpVG8NeW4c3Q",
  authDomain: "hirataku1102.firebaseapp.com",
  projectId: "hirataku1102",
  storageBucket: "hirataku1102.firebasestorage.app",
  messagingSenderId: "219252490669",
  appId: "1:219252490669:web:bb3d9dc019a17a5a01e124"
};
const PASSCODE = "meishi2026";          // 開くときのパスコード(変更OK)
const PASS_HOURS = 24;                  // 再入力までの時間
const COL_CARDS = "mc_cards";
const COL_SET = "mc_settings";
const COL_CUSTOMERS = "cm_customers";   // コース表の得意先(読むだけ)
const DEFAULT_MODEL = "gemini-flash-latest";
const DEFAULT_CATS = ["管理会社","直営顧客","元請・ゼネコン","協力業者・同業","行政・組合","見込み客","その他"];
const DEFAULT_OWNERS = ["Takuya"];

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const st = getStorage(app);

/* ---------- 小物 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS = {
  get(k, d){ try{ const v = localStorage.getItem("mc_"+k); return v===null? d : JSON.parse(v);}catch{ return d; } },
  set(k, v){ try{ localStorage.setItem("mc_"+k, JSON.stringify(v)); }catch{} }
};
function toast(msg, ms=2200){ const t=$("#toast"); t.textContent=msg; t.classList.remove("hidden"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.add("hidden"), ms); }
function busy(on, msg="処理中…"){ $("#busyMsg").textContent=msg; $("#busy").classList.toggle("hidden", !on); }
const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const toHira = s => String(s||"").replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0)-0x60));
const norm = s => toHira(String(s||"").normalize("NFKC").toLowerCase()).replace(/[\s\-‐ー−―‑()（）・.,、。]/g, m => m==="ー" ? "ー" : "");
const digits = s => String(s||"").normalize("NFKC").replace(/\D/g,"");

/* 五十音の行 */
const ROWS = [["あ","あいうえお"],["か","かきくけこ"],["さ","さしすせそ"],["た","たちつてと"],["な","なにぬねの"],["は","はひふへほ"],["ま","まみむめも"],["や","やゆよ"],["ら","らりるれろ"],["わ","わをん"]];
const ROW_KEYS = [...ROWS.map(r=>r[0]), "A", "他"];
const SMALL = {"ぁ":"あ","ぃ":"い","ぅ":"う","ぇ":"え","ぉ":"お","っ":"つ","ゃ":"や","ゅ":"ゆ","ょ":"よ","ゎ":"わ","ゕ":"か","ゖ":"け"};
function rowOf(s){
  let c = toHira(String(s||"").normalize("NFKC").trim()).charAt(0);
  if(!c) return "他";
  c = c.normalize("NFD").charAt(0);
  c = SMALL[c] || c;
  for(const [k,chars] of ROWS) if(chars.includes(c)) return k;
  if(/[a-z]/i.test(c)) return "A";
  return "他";
}
const collator = new Intl.Collator("ja");

/* ---------- 状態 ---------- */
let cards = [];           // 全名刺
let settings = { categories: DEFAULT_CATS.slice(), owners: DEFAULT_OWNERS.slice() };
let customers = null;     // 得意先(必要時に読む)
let view = [];            // 表示中(絞り込み後)
let onlyFollow = false, onlyNoCust = false;

/* ---------- パスコード ---------- */
function unlocked(){ const t = LS.get("unlockAt", 0); return Date.now() - t < PASS_HOURS*3600*1000; }
function tryPass(){
  if($("#passIn").value === PASSCODE){ LS.set("unlockAt", Date.now()); $("#lock").classList.add("hidden"); start(); }
  else { $("#passErr").textContent = "パスコードが違います"; }
}
$("#passBtn").onclick = tryPass;
$("#passIn").addEventListener("keydown", e => { if(e.key==="Enter") tryPass(); });

/* ---------- テーマ ---------- */
function applyTheme(){
  const t = LS.get("theme","light");
  document.documentElement.dataset.theme = t;

async function loadAll(){

  try{
    const [snap, sdoc] = await Promise.all([ getDocs(collection(db, COL_CARDS)), getDoc(doc(db, COL_SET, "main")) ]);
    cards = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    if(sdoc.exists()){
      const s = sdoc.data();
      if(Array.isArray(s.categories) && s.categories.length) settings.categories = s.categories;
      if(Array.isArray(s.owners) && s.owners.length) settings.owners = s.owners;
    }
    const d = new Date();
    $("#loadedAt").textContent = `${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")} 読込`;
  }catch(e){
    console.error(e);
    alert("読み込みに失敗しました。\n・firebaseConfig の apiKey\n・Firestore のルール(mc_cards の読み書き許可)\nを確認してください。\n\n" + e.message);
  }
  busy(false);
  fillFilterOptions();
  render();
}
async function saveSettings(){
  await setDoc(doc(db, COL_SET, "main"), { categories: settings.categories, owners: settings.owners, updatedAt: serverTimestamp() }, { merge:true });

async function loadCustomers(){
  if(customers) return customers;
  try{
    const cached = sessionStorage.getItem("mc_customers");
    if(cached){ customers = JSON.parse(cached); return customers; }
  }catch{}
  busy(true, "得意先リストを読み込み中…");
  try{
    const snap = await getDocs(collection(db, COL_CUSTOMERS));
    customers = snap.docs.map(d => {
      const x = d.data();
      const name = x.name ?? x.customerName ?? x.title ?? "";
      return { id:d.id, name, address: x.address ?? "", code: x.code ?? x.kanriNo ?? x.managementNo ?? "" };
    }).filter(c => c.name);

/* ---------- 検索・並び替え ---------- */
function searchText(c){
  return norm([c.name,c.kana,c.company,c.companyKana,c.dept,c.title,c.zip,c.address,c.tel,c.mobile,c.fax,c.email,c.url,c.other,c.rawText,
    c.category,c.customerName,c.owner,c.memo,c.place,(c.tags||[]).join(" ")].join(" ")) + " " + digits([c.tel,c.mobile,c.fax,c.zip].join(" "));
}
function sortKey(c, mode){
  if(mode==="company") return toHira((c.companyKana || c.company || c.kana || c.name || "").normalize("NFKC"));
  return toHira((c.kana || c.name || c.companyKana || c.company || "").normalize("NFKC"));
}
function computeView(){
  const q = norm($("#q").value).trim();
  const terms = $("#q").value.trim() ? $("#q").value.trim().split(/[\s　]+/).map(t => ({ t: norm(t), d: digits(t) })) : [];
  const cat = $("#fCat").value, owner = $("#fOwner").value, imp = +$("#fImp").value || 0;
  const mode = $("#fSort").value;
  const td = today();
  let v = cards.filter(c => {
    if(cat && c.category !== cat) return false;
    if(owner && c.owner !== owner) return false;
    if(imp && (c.importance||0) < imp) return false;
    if(onlyFollow && !(c.followUp && c.followUp <= td)) return false;
    if(onlyNoCust && c.customerName) return false;
    if(terms.length){
      const s = c._s || (c._s = searchText(c));
      return terms.every(({t,d}) => (t && s.includes(t)) || (d.length>=3 && s.includes(d)));
    }
    return true;
  });
  if(mode==="date") v.sort((a,b) => (b.exchangedAt||"").localeCompare(a.exchangedAt||"") || collator.compare(sortKey(a,"kana"), sortKey(b,"kana")));
  else if(mode==="imp") v.sort((a,b) => (b.importance||0)-(a.importance||0) || collator.compare(sortKey(a,"kana"), sortKey(b,"kana")));
  else v.sort((a,b) => {
    const ra = ROW_KEYS.indexOf(rowOf(sortKey(a,mode))), rb = ROW_KEYS.indexOf(rowOf(sortKey(b,mode)));
    return ra - rb || collator.compare(sortKey(a,mode), sortKey(b,mode));
  });
  return v;
}
const stars = n => n ? "★".repeat(n) + `<span style="opacity:.25">${"★".repeat(3-n)}</span>` : "";

function groupLabel(c){
  const mode = $("#fSort").value;
  if(mode==="date"){ return c.exchangedAt ? c.exchangedAt.slice(0,7).replace("-","年") + "月" : "交換日なし"; }
  if(mode==="imp"){ return c.importance ? "★".repeat(c.importance) : "重要度なし"; }
  const r = rowOf(sortKey(c, mode));
  return r==="A" ? "英数字" : r==="他" ? "その他" : r + "行";
}

/* ---------- 五十音インデックス(指でなぞってジャンプ) ---------- */
function buildIndex(el, onJump){
  const kanaMode = ["kana","company"].includes($("#fSort").value);
  el.classList.toggle("hidden", !kanaMode || !view.length);
  if(!kanaMode) return;
  const has = new Set(view.map(c => c._row));
  el.innerHTML = ROW_KEYS.map(k => `<span data-k="${k}" class="${has.has(k)?"":"off"}">${k==="A"?"A":k}</span>`).join("");
  const pick = (x,y) => { const t = document.elementFromPoint(x,y); const k = t && t.dataset && t.dataset.k; if(k){ showBubble(k==="A"?"A":k); onJump(k); } };
  el.ontouchstart = el.ontouchmove = e => { e.preventDefault(); const p = e.touches[0]; pick(p.clientX, p.clientY); };
  el.ontouchend = () => hideBubble();
  el.onclick = e => { const k = e.target.dataset.k; if(k){ showBubble(k); onJump(k); setTimeout(hideBubble, 500); } };
}
function showBubble(k){ const b=$("#bubble"); b.textContent=k; b.classList.remove("hidden"); }
function hideBubble(){ setTimeout(()=>$("#bubble").classList.add("hidden"), 250); }
function nearestRowIndex(k){
  let i = ROW_KEYS.indexOf(k);
  for(let j=i; j<ROW_KEYS.length; j++){ const idx = view.findIndex(c => c._row === ROW_KEYS[j]); if(idx>=0) return idx; }
  for(let j=i-1; j>=0; j--){ const idx = view.findIndex(c => c._row === ROW_KEYS[j]); if(idx>=0) return idx; }
  return -1;
}
function jumpList(k){
  const i = nearestRowIndex(k); if(i<0) return;
  const el = document.querySelector(`.row[data-id="${view[i].id}"]`);
  if(el){ const sec = el.previousElementSibling && el.previousElementSibling.classList.contains("sec-h") ? el.previousElementSibling : el;
    window.scrollTo({ top: sec.getBoundingClientRect().top + window.scrollY - $("#hdr").offsetHeight, behavior:"auto" }); }
}

    idx2.ontouchstart = idx2.ontouchmove = e => { e.preventDefault(); const p=e.touches[0]; pick(p.clientX,p.clientY); };

function jumpSlide(k){ const i = nearestRowIndex(k); if(i>=0){ const tr=$("#track"); tr.scrollLeft = i*tr.clientWidth; updateSlidePos(); } }
function updateSlidePos(){

$("#track").addEventListener("scroll", () => { cancelAnimationFrame(updateSlidePos._r); updateSlidePos._r = requestAnimationFrame(updateSlidePos); }, { passive:true });

/* vCard(iPhoneの連絡先に追加) */
function downloadVcf(c){
  const e = s => String(s||"").replace(/([,;\\])/g,"\\$1").replace(/\n/g,"\\n");
  const n = (c.name||"").split(/[\s　]+/), k = (c.kana||"").split(/[\s　]+/);
  const lines = ["BEGIN:VCARD","VERSION:3.0",
    `N:${e(n[0]||"")};${e(n.slice(1).join(" "))};;;`, `FN:${e(c.name||c.company||"")}`,
    c.kana ? `X-PHONETIC-LAST-NAME:${e(k[0]||"")}` : "", c.kana && k[1] ? `X-PHONETIC-FIRST-NAME:${e(k.slice(1).join(" "))}` : "",
    c.company ? `ORG:${e(c.company)}${c.dept?";"+e(c.dept):""}` : "", c.title ? `TITLE:${e(c.title)}` : "",
    c.mobile ? `TEL;TYPE=CELL:${e(c.mobile)}` : "", c.tel ? `TEL;TYPE=WORK,VOICE:${e(c.tel)}` : "", c.fax ? `TEL;TYPE=WORK,FAX:${e(c.fax)}` : "",
    c.email ? `EMAIL;TYPE=WORK:${e(c.email)}` : "", c.address ? `ADR;TYPE=WORK:;;${e(c.address)};;;${e(c.zip||"")};日本` : "",
    c.url ? `URL:${e(c.url)}` : "", `NOTE:${e(["名刺交換 "+(c.exchangedAt||""), c.memo].filter(Boolean).join("\n"))}`, "END:VCARD"].filter(Boolean);
  const blob = new Blob([lines.join("\r\n")], { type:"text/vcard" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `${c.name||c.company||"meishi"}.vcf`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}

/* ---------- 画像処理 ---------- */
function loadImage(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }
async function fileToCanvas(file, maxSide=1600){
  const url = URL.createObjectURL(file);
  try{
    const img = await loadImage(url);
    const s = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement("canvas"); cv.width = Math.round(img.naturalWidth*s); cv.height = Math.round(img.naturalHeight*s);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); return cv;
  } finally { URL.revokeObjectURL(url); }
}
function rotateCanvas(cv){
  const r = document.createElement("canvas"); r.width = cv.height; r.height = cv.width;
  const g = r.getContext("2d"); g.translate(r.width,0); g.rotate(Math.PI/2); g.drawImage(cv,0,0); return r;
}
function scaled(cv, maxSide){
  const s = Math.min(1, maxSide/Math.max(cv.width,cv.height)); if(s===1) return cv;
  const r = document.createElement("canvas"); r.width=Math.round(cv.width*s); r.height=Math.round(cv.height*s);
  r.getContext("2d").drawImage(cv,0,0,r.width,r.height); return r;
}
const toBlob = (cv,q=.85) => new Promise(r => cv.toBlob(r, "image/jpeg", q));
const toB64 = cv => cv.toDataURL("image/jpeg", .85).split(",")[1];

/* ---------- Gemini で文字起こし ---------- */
const OCR_PROMPT = `あなたは日本の名刺を正確に読み取るOCRです。画像(1枚目が表面、2枚目があれば裏面)から情報を読み取り、次のJSONだけを返してください。
{
 "name": "氏名(姓と名の間に半角スペース)",
 "kana": "氏名のよみ(ひらがな、姓と名の間に半角スペース。ふりがな・ローマ字表記があればそれを優先、なければ一般的な読みを推定)",
 "company": "会社名・団体名(株式会社等も含め表記どおり)",
 "companyKana": "会社名のよみ(ひらがな。株式会社・有限会社・(株)などの法人格は除いた部分の読み)",
 "dept": "部署",
 "title": "役職",
 "zip": "郵便番号(数字とハイフン)",
 "address": "住所(ビル名含む。複数あれば本社/主たるもの)",
 "tel": "代表・会社電話",
 "mobile": "携帯電話",
 "fax": "FAX",
 "email": "メールアドレス",
 "url": "WebサイトURL",
 "other": "上記以外の重要な情報(資格・許可番号・営業所・SNS・2つ目の住所など)を改行区切り",
 "rawText": "名刺に書かれている文字をすべて、読める順に改行区切りで書き起こしたもの"
}
読めない項目は空文字""にしてください。推測で作らないこと(よみは除く)。縦書きにも対応してください。`;

async function geminiOCR(canvases){
  const key = LS.get("geminiKey",""); if(!key) throw new Error("Gemini APIキーが未設定です(⚙️設定から入力)");
  const model = LS.get("geminiModel", DEFAULT_MODEL) || DEFAULT_MODEL;
  const parts = [{ text: OCR_PROMPT }, ...canvases.map(cv => ({ inline_data: { mime_type:"image/jpeg", data: toB64(scaled(cv,1600)) } }))];
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
    method:"POST", headers:{ "Content-Type":"application/json", "x-goog-api-key": key },
    body: JSON.stringify({ contents:[{ role:"user", parts }], generationConfig:{ temperature:0, responseMimeType:"application/json" } })
  });
  const js = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error((js.error && js.error.message) || ("HTTP "+res.status));
  const text = (js.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("");
  const clean = text.replace(/^```(?:json)?\s*/i,"").replace(/```\s*$/,"").trim();
  const obj = JSON.parse(clean);
  return Array.isArray(obj) ? obj[0] : obj;
}

function checkDup(){

async function runOCR(){
  if(!edit.front.cv && !edit.front.url){ toast("先に表面の画像を入れてください"); return; }
  readForm();
  busy(true,"🤖 名刺を読み取り中…(数秒〜十数秒)");
  try{
    const cvs = [];
    for(const side of ["front","back"]){
      const s = edit[side];
      if(s.cv) cvs.push(s.cv);
      else if(s.url){ const blob = await (await fetch(s.url)).blob(); cvs.push(await fileToCanvas(blob)); }
    }
    const r = await geminiOCR(cvs);
    let filled = 0;
    for(const [k] of FIELDS){
      const v = (r[k]||"").toString().trim();
      if(v && (!edit.data[k] || edit.isNew)){ edit.data[k] = v; filled++; }
    }
    if(r.rawText) edit.data.rawText = String(r.rawText);
    busy(false); renderEdit();
    $("#ocrMsg").textContent = `✅ 読み取りました(${filled}項目)。間違いがないか確認してください`;
  }catch(err){
    busy(false); console.error(err);
    alert("読み取りに失敗しました。\n" + err.message + "\n\n手入力で登録することもできます。");
  }
}

  if(!d.name && !d.company && !edit.front.cv && !edit.front.url){ alert("氏名・会社名・画像のどれかは入れてください"); return; }
  busy(true,"保存中…");
  try{
    const id = edit.id; const out = {};
    for(const k of ["name","kana","company","companyKana","dept","title","zip","address","tel","mobile","fax","email","url","other","rawText",
      "category","owner","exchangedAt","place","customerName","customerId","followUp","memo"]) out[k] = d[k] || "";
    out.kana = toHira(out.kana); out.companyKana = toHira(out.companyKana);
    out.tags = d.tags || []; out.importance = d.importance || 0;
    if(edit.front.changed && edit.front.cv){
      const fp = `meishi/${id}/front.jpg`, tp = `meishi/${id}/thumb.jpg`;
      await uploadBytes(ref(st, fp), await toBlob(scaled(edit.front.cv,1600)), { contentType:"image/jpeg" });
      await uploadBytes(ref(st, tp), await toBlob(scaled(edit.front.cv,360),.7), { contentType:"image/jpeg" });
      out.frontPath = fp; out.thumbPath = tp;
      out.frontUrl = await getDownloadURL(ref(st, fp)); out.thumbUrl = await getDownloadURL(ref(st, tp));
    }
    if(edit.back.changed){
      const bp = `meishi/${id}/back.jpg`;
      if(edit.back.cv){
        await uploadBytes(ref(st, bp), await toBlob(scaled(edit.back.cv,1600)), { contentType:"image/jpeg" });
        out.backPath = bp; out.backUrl = await getDownloadURL(ref(st, bp));
      } else if(edit.back.removed){ await deleteObject(ref(st, bp)).catch(()=>{}); out.backPath = ""; out.backUrl = ""; }
    }
    if(edit.isNew) out.createdAt = serverTimestamp();
    out.updatedAt = serverTimestamp();
    await setDoc(doc(db, COL_CARDS, id), out, { merge:true });
    const local = { ...(cards.find(c=>c.id===id)||{ id }), ...out };
    if(edit.isNew) local.createdAt = { toDate: () => new Date() };
    delete local._s;
    cards = cards.filter(c=>c.id!==id).concat(local);
    if(out.owner) LS.set("lastOwner", out.owner);
    LS.set("lastCat", out.category);
    busy(false); toast("保存しました");
    const kc = edit.keepCount;
    closeModal("#mEdit"); render();
    if(next) openEdit(null, kc+1);
  }catch(err){ busy(false); console.error(err); alert("保存に失敗しました。\n" + err.message); }
}

function vcfText(c){
  const e = s => String(s||"").replace(/([,;\\])/g,"\\$1").replace(/\n/g,"\\n");
  const n = (c.name||"").split(/[\s　]+/);
  return ["BEGIN:VCARD","VERSION:3.0",`N:${e(n[0]||"")};${e(n.slice(1).join(" "))};;;`,`FN:${e(c.name||c.company||"")}`,
    c.company?`ORG:${e(c.company)}`:"", c.title?`TITLE:${e(c.title)}`:"", c.mobile?`TEL;TYPE=CELL:${e(c.mobile)}`:"", c.tel?`TEL;TYPE=WORK:${e(c.tel)}`:"",
    c.email?`EMAIL:${e(c.email)}`:"", c.address?`ADR;TYPE=WORK:;;${e(c.address)};;;${e(c.zip||"")};日本`:"", "END:VCARD"].filter(Boolean).join("\r\n");
}
function dl(blob, name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),5000); }
function exportCSV(){
  const cols = [["name","氏名"],["kana","よみ"],["company","会社名"],["companyKana","会社よみ"],["dept","部署"],["title","役職"],["zip","郵便番号"],["address","住所"],
    ["tel","電話"],["mobile","携帯"],["fax","FAX"],["email","メール"],["url","Web"],["category","分類"],["customerName","得意先名"],["importance","重要度"],
    ["owner","担当者"],["exchangedAt","交換日"],["place","交換場所"],["followUp","フォロー予定"],["tags","タグ"],["memo","メモ"],["other","その他"]];
  const q = v => `"${String(Array.isArray(v)?v.join(" "):(v??"")).replace(/"/g,'""')}"`;
  const rows = [cols.map(c=>q(c[1])).join(",")].concat(view.map(c => cols.map(([k]) => q(c[k])).join(",")));
  dl(new Blob(["﻿"+rows.join("\r\n")],{type:"text/csv"}), `名刺一覧_${today()}.csv`);
}
