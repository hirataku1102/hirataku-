<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>分別ホームラン</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap">
<style>
/* 夜のスタジアム×ネオンのアーケード風(第1弾「分別ラッシュ」と同じ世界観)。上=HUDバー、中=球場、下=光沢の分別ボタン */
:root{
  --bg1:#0d2152; --bg2:#050b22; --panel:rgba(8,20,58,.78); --neon:#2ec6ff; --ink:#ffffff; --muted:#a9bde6;
  --lime:#7cf03a; --yellow:#ffe14a; --heart:#ff3b55; --splash-bg:#fefeff; --splash-ink:#14213d; --sun:#ff8a1f;
  --logo:"Dela Gothic One","M PLUS Rounded 1c",sans-serif;
  --ui:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg2);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}

#splash{position:fixed;inset:0;z-index:50;background:var(--splash-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(28px,8vh,64px);padding-inline:24px;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
.splash-logo{width:min(560px,86vw);height:auto;animation:logoIn .9s cubic-bezier(.2,.8,.2,1) both}
.splash-note{margin:0;font-family:var(--ui);font-weight:700;font-size:13px;letter-spacing:.2em;color:var(--splash-ink);opacity:.7;animation:logoIn .9s .3s both}
@keyframes logoIn{from{opacity:0;transform:translateY(12px) scale(.96)}}

.app{position:relative;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-inline:14px;padding-block:10px;box-sizing:border-box;
  background:
   radial-gradient(120% 70% at 50% 38%,rgba(46,198,255,.22),transparent 60%),
   radial-gradient(90% 60% at 50% 40%,var(--bg1),var(--bg2) 75%);
  overflow:hidden;overflow:clip}
.app::before{content:"";position:absolute;inset:-20%;pointer-events:none;opacity:.35;
  background:repeating-conic-gradient(from 0deg at 50% 40%,rgba(46,198,255,0) 0 7deg,rgba(46,198,255,.18) 7deg 8deg,rgba(0,0,0,0) 8deg 15deg)}
.app>*{position:relative}

.hud{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--neon);border-radius:999px;padding:6px 8px 6px 18px;
  box-shadow:0 0 14px rgba(46,198,255,.55),inset 0 0 12px rgba(46,198,255,.25);font-variant-numeric:tabular-nums}
.cell{display:flex;align-items:center;gap:8px;padding-right:10px;border-right:2px solid rgba(46,198,255,.35)}
.cell small{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.06em;line-height:1}
.cell b{font-family:var(--ui);font-weight:900;font-size:24px;line-height:1}
#lv{color:var(--lime);text-shadow:0 0 8px rgba(124,240,58,.7)}
.cell.score{flex:1;justify-content:space-between}
.cell.life{border-right:0}
.lives{display:flex;gap:2px;font-size:18px;line-height:1}
.lives .off{filter:grayscale(1) brightness(.5);opacity:.6}
.snd{margin-left:auto;display:flex;align-items:center;gap:6px;border:2px solid var(--lime);background:rgba(10,40,20,.6);color:var(--lime);
  font-family:var(--ui);font-weight:900;font-size:13px;border-radius:999px;padding:6px 12px;cursor:pointer;box-shadow:0 0 10px rgba(124,240,58,.45);white-space:nowrap}
.snd[aria-pressed="false"]{border-color:#5a6a8a;color:#8a9aba;box-shadow:none;background:rgba(20,28,50,.6)}
.snd:focus-visible,.bin:focus-visible,.go:focus-visible,.close:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

.stage{position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 6px;overflow:hidden;background:rgba(5,11,34,.55)}
/* 画面が低いブラウザでもはみ出さないよう、中身ごと縮める */
.ovin{display:flex;flex-direction:column;align-items:center;gap:12px;transform-origin:center center;flex:none}
.deco{position:absolute;font-size:44px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));animation:bob 3s ease-in-out infinite;pointer-events:none}
@keyframes bob{50%{transform:translateY(-10px) rotate(var(--r,8deg))}}

.logo{position:relative;padding:18px 8px 6px}
.ring{position:absolute;left:50%;top:50%;width:150px;height:150px;transform:translate(-50%,-55%);opacity:.9;filter:drop-shadow(0 0 10px rgba(124,240,58,.8))}
.logo h1{position:relative;margin:0;font-family:var(--logo);font-weight:400;font-size:clamp(34px,10.6vw,56px);line-height:1;letter-spacing:-.01em;transform:skewX(-10deg) rotate(-3deg);white-space:nowrap}
.logo h1 span{-webkit-text-stroke:7px #0a2a78;paint-order:stroke fill;filter:drop-shadow(0 4px 0 #061445) drop-shadow(0 0 14px rgba(46,198,255,.7))}
.logo .a{color:#eaf8ff;background:linear-gradient(180deg,#ffffff 30%,#8fe3ff);-webkit-background-clip:text;background-clip:text}
.logo .b{color:var(--lime);background:linear-gradient(180deg,#f4ff6a 20%,#4fd61c);-webkit-background-clip:text;background-clip:text}
.bolt{position:absolute;top:50%;width:70px;height:8px;border-radius:4px;background:linear-gradient(90deg,transparent,var(--yellow),#ff9a1f)}
.bolt.l{left:-30px;transform:skewX(-30deg) rotate(-12deg)}
.bolt.r{right:-30px;transform:skewX(-30deg) rotate(-12deg) scaleX(-1)}
.tag{margin:0;font-family:var(--logo);font-weight:400;font-size:clamp(17px,5.4vw,24px);transform:rotate(-2deg);text-shadow:0 3px 0 #061445,0 0 10px rgba(0,0,0,.6)}
.tag em{font-style:normal;color:var(--yellow);background:linear-gradient(transparent 70%,rgba(124,240,58,.75) 70% 90%,transparent 90%)}
.desc{margin:0;font-size:13px;font-weight:700;line-height:1.7;color:#dce8ff;max-width:32ch;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.desc b{color:var(--yellow)}
.legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:100%}
.chip{display:flex;align-items:center;gap:4px;padding:5px 10px 5px 7px;border-radius:12px;font-weight:900;font-size:13px;color:#fff;line-height:1.05;
  border:2px solid rgba(255,255,255,.35);box-shadow:0 0 10px var(--c),inset 0 1px 0 rgba(255,255,255,.5);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 70%,#000))}
.chip i{font-style:normal;font-size:15px}
.chip small{display:block;font-size:9px;font-weight:800;opacity:.9}
.best{font-weight:900;font-size:15px;color:#fff;text-shadow:0 0 8px rgba(255,225,74,.5)}
.best:empty{display:none}
.go{border:3px solid #d8ff9a;color:#fff;font-family:var(--logo);font-weight:400;font-size:clamp(22px,7vw,30px);padding:12px 34px 14px;border-radius:999px;cursor:pointer;letter-spacing:.02em;
  background:linear-gradient(180deg,#b6ff5a,#4fd61c 55%,#22a40c);text-shadow:0 3px 0 #13600a;
  box-shadow:0 0 0 4px rgba(18,70,12,.9),0 0 26px rgba(124,240,58,.8),inset 0 3px 0 rgba(255,255,255,.55);animation:pulse 1.6s ease-in-out infinite}
.go:active{transform:translateY(2px)}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(18,70,12,.9),0 0 40px rgba(124,240,58,1),inset 0 3px 0 rgba(255,255,255,.55)}}
.result{display:flex;flex-direction:column;align-items:center;gap:6px}
.result .over{font-family:var(--logo);font-size:34px;color:#ff6b6b;text-shadow:0 3px 0 #4a0a14,0 0 14px rgba(255,59,85,.7);transform:skewX(-8deg);white-space:nowrap}
.result .over.clear{color:var(--lime);text-shadow:0 3px 0 #13600a,0 0 16px rgba(124,240,58,.8);font-size:clamp(28px,9vw,38px)}
.result .big{font-family:var(--logo);font-size:52px;line-height:1.1;color:var(--yellow);text-shadow:0 4px 0 #6a4a00,0 0 18px rgba(255,225,74,.6);font-variant-numeric:tabular-nums}
.result .big small{font-size:18px;color:#dce8ff;text-shadow:none}
.result .sub{font-weight:800;font-size:14px;color:#dce8ff}
.result .next{margin-top:4px;font-weight:900;font-size:14px;color:var(--ink);background:rgba(8,20,58,.85);border:2px solid var(--neon);border-radius:12px;padding:8px 14px;box-shadow:0 0 12px rgba(46,198,255,.5);max-width:30ch;line-height:1.5}
.result .nb{font-weight:900;color:var(--lime);text-shadow:0 0 10px rgba(124,240,58,.8)}
.stats{display:grid;grid-template-columns:repeat(5,auto);gap:4px 6px;background:rgba(8,20,58,.85);border:2px solid rgba(46,198,255,.5);border-radius:12px;padding:8px 10px;font-variant-numeric:tabular-nums}
.stats span{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:800;color:var(--muted);min-width:44px}
.stats b{font-family:var(--ui);font-weight:900;font-size:20px;color:var(--c,#fff)}

.bins{display:grid;gap:7px;grid-template-columns:repeat(3,1fr)}
.bin{--c:#888;position:relative;min-width:0;border-radius:14px;padding:8px 2px 10px;cursor:pointer;color:#fff;font-family:var(--ui);
  border:3px solid color-mix(in srgb,var(--c) 55%,#fff);
  background:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--c) 55%,#fff),transparent 60%),linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 65%,#000));
  box-shadow:0 5px 0 color-mix(in srgb,var(--c) 45%,#000),0 0 16px color-mix(in srgb,var(--c) 70%,transparent),inset 0 2px 0 rgba(255,255,255,.5);
  transition:transform .07s,filter .15s;display:flex;flex-direction:row;justify-content:center;align-items:center;gap:4px}
.bin .ic{font-size:clamp(20px,6vw,28px);line-height:1.1;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
.bin .nm{font-weight:900;font-size:clamp(13px,4vw,18px);line-height:1.1;-webkit-text-stroke:4px color-mix(in srgb,var(--c) 40%,#000);paint-order:stroke fill;white-space:nowrap}
.bin.off{--c:#4a5570;opacity:.55;cursor:default;filter:saturate(.3)}
.bin.off:active{transform:none}
.bin .lk{position:absolute;top:-8px;right:-4px;background:#0a1430;border:1px solid #6a7896;color:#cfd8ea;font-size:10px;font-weight:900;padding:1px 6px;border-radius:999px;line-height:1.4}
.bin:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 45%,#000),0 0 16px color-mix(in srgb,var(--c) 70%,transparent),inset 0 2px 0 rgba(255,255,255,.5)}
.bin.flash-ok{filter:brightness(1.4)}
.bin.flash-ng{animation:shake .3s}
.bin.new{animation:pop .6s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.1)}}
.toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(8,20,58,.92);border:2px solid var(--yellow);color:var(--yellow);font-weight:900;padding:7px 14px;border-radius:999px;font-size:13px;white-space:nowrap;pointer-events:none;transition:opacity .3s;box-shadow:0 0 14px rgba(255,225,74,.5);z-index:2}
.note{font-size:10px;font-weight:700;color:var(--muted);text-align:center;border-top:1px solid rgba(46,198,255,.35);padding-top:6px}
.ico-img{width:1.1em;height:1.1em;vertical-align:-.15em}

.modal{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(2,6,20,.72)}
.card{--c:var(--neon);width:100%;max-width:340px;box-sizing:border-box;text-align:center;padding:20px 18px 18px;border-radius:20px;
  background:linear-gradient(180deg,#12306e,#08143a);border:3px solid var(--c);box-shadow:0 0 28px color-mix(in srgb,var(--c) 70%,transparent);animation:pop .4s}
.card .eyebrow{font-weight:900;font-size:12px;letter-spacing:.12em;color:var(--yellow)}
.card h2{margin:6px 0 10px;font-family:var(--logo);font-weight:400;font-size:24px;line-height:1.25;color:#fff;text-wrap:balance;text-shadow:0 0 12px color-mix(in srgb,var(--c) 80%,transparent)}
.card .icons{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;font-size:30px;margin-bottom:10px}
.card .icons .ico-img{width:34px;height:34px}
.card p{margin:0 0 12px;font-weight:700;font-size:14px;line-height:1.75;color:#dce8ff;text-align:left;white-space:pre-line}
.card .pitch{display:flex;align-items:center;gap:8px;margin:0 0 16px;padding:8px 12px;border-radius:12px;background:rgba(0,0,0,.3);border:1px dashed color-mix(in srgb,var(--c) 70%,#fff);text-align:left;font-weight:800;font-size:13px;color:#fff}
.card .pitch:empty{display:none}
.card .pitch b{color:var(--yellow);font-size:15px}
.close{border:2px solid #fff;background:var(--c);color:#fff;font-family:var(--ui);font-weight:900;font-size:16px;padding:10px 40px;border-radius:999px;cursor:pointer;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 45%,#000)}
.close:active{transform:translateY(2px)}
@media (prefers-reduced-motion:reduce){.deco,.go,.bin.new,.bin.flash-ng,.card,.splash-logo,.splash-note{animation:none}}

/* ===== サウンド(Web Audioで合成。外部ファイル不要) ===== */
const Snd=(()=>{
  let ac=null,master=null,bgmGain=null,noise=null,on=true,timer=null,step=0,nextT=0,bpm=120;
  try{on=localStorage.getItem("bunbetsu-hr-sound")!=="off"}catch(e){}
  const hz=m=>440*Math.pow(2,(m-69)/12);
  function init(){
    if(ac){if(ac.state==="suspended")ac.resume();return}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    ac=new AC();master=ac.createGain();master.gain.value=on?1:0;master.connect(ac.destination);
    bgmGain=ac.createGain();bgmGain.gain.value=.45;bgmGain.connect(master);
    noise=ac.createBuffer(1,ac.sampleRate*.3,ac.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  function tone(m,t,d,type="square",vol=.12,dest=master,slide=0){
    if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(hz(m),t);if(slide)o.frequency.exponentialRampToValueAtTime(hz(m+slide),t+d);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.02);
  }
  function burst(t,d,freq,vol){
    if(!ac)return;const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
    s.buffer=noise;f.type="bandpass";f.frequency.value=freq;f.Q.value=1.2;
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+.02);
  }
  /* 球場オルガン風のBGM(オリジナル)。16分音符で「テレテレテテテレ…」と駆け上がり、最後に「ドン・ドン・ドン」 */
  const MEL=[
    67,69,67,69, 67,69,71,67, 72,74,72,74, 72,74,76,72,
    76,77,76,74, 72,74,76,79, 76,0,72,0,   0,0,0,0,
    67,69,71,72, 74,76,77,79, 81,79,77,76, 74,72,71,74,
    72,0,0,0,    -1,0,0,0,    -1,0,0,0,    -1,0,0,0     // -1 = ドン!
  ];
  const BASS=[48,48,43,43, 43,43,48,48, 53,53,55,55, 48,48,48,48]; // 8分音符ごとの低音(4小節分)
  function organ(m,t,d,vol){ // ドローバーオルガン風:倍音を重ねて、ゆらぎ(トレモロ)を少し
    [[0,1],[12,.5],[19,.3],[24,.22]].forEach(([iv,g])=>tone(m+iv,t,d,"sine",vol*g,bgmGain));
  }
  function don(t){ // ドン!(バスドラム+手拍子+和音)
    const o=ac.createOscillator(),g=ac.createGain();o.type="sine";
    o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+.22);
    g.gain.setValueAtTime(.55,t);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(g);g.connect(bgmGain);o.start(t);o.stop(t+.32);
    const s=ac.createBufferSource(),f=ac.createBiquadFilter(),ng=ac.createGain();s.buffer=noise;f.type="bandpass";f.frequency.value=1400;f.Q.value=.8;
    ng.gain.setValueAtTime(.32,t);ng.gain.exponentialRampToValueAtTime(.0001,t+.14);s.connect(f);f.connect(ng);ng.connect(bgmGain);s.start(t);s.stop(t+.16);
    [60,64,67,72].forEach(m=>organ(m,t,.22,.05));
  }
  function sched(){
    const sd=60/bpm/4; // 16分音符
    while(nextT<ac.currentTime+.12){
      const s=step%64,m=MEL[s];
      if(m>0)organ(m,nextT,sd*.85,.075);
      else if(m<0)don(nextT);
      if(s%2===0&&s<52){const r=BASS[Math.floor(s/4)%16];tone(r,nextT,sd*1.7,"triangle",.16,bgmGain)}
      if(s%4===2&&s<48)tone(96,nextT,.025,"square",.012,bgmGain); // ハイハット代わり
      nextT+=sd;step++;
    }
  }
  const now=()=>ac?ac.currentTime:0;
  return{
    init,
    get on(){return on},
    toggle(){on=!on;try{localStorage.setItem("bunbetsu-hr-sound",on?"on":"off")}catch(e){}
      if(on)init();if(master)master.gain.setTargetAtTime(on?1:0,ac.currentTime,.02);return on},
    bgmStart(){if(!ac)return;this.bgmStop();step=0;nextT=ac.currentTime+.1;timer=setInterval(sched,25)},
    bgmStop(){clearInterval(timer);timer=null},
    tempo(lv){bpm=Math.min(150,118+(lv-1)*6)},
    pitch(){if(!ac)return;const t=now();burst(t,.18,1800,.08);tone(76,t,.16,"triangle",.05,master,10)},
    bat(){if(!ac)return;const t=now();burst(t,.08,3200,.5);tone(88,t,.06,"square",.08)},
    whiff(){if(!ac)return;const t=now();burst(t,.14,900,.12)},
    mitt(){if(!ac)return;const t=now();burst(t,.06,500,.35);tone(45,t,.09,"triangle",.22)},
    hit(n){if(!ac)return;const t=now()+.05;[79,84,88,91].slice(0,n+1).forEach((m,i)=>tone(m,t+i*.06,.1,"square",.07))},
    bang(){if(!ac)return;const t=now();
      burst(t,.05,4200,.9);burst(t,.16,1400,.9);burst(t,.45,260,.8);
      const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(38,t+.35);
      g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.0001,t+.4);o.connect(g);g.connect(master);o.start(t);o.stop(t+.42);
      tone(96,t,.05,"square",.12)},
    cheer(){if(!ac)return;const t=now()+.15,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
      const len=ac.sampleRate*2.2,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
      s.buffer=buf;f.type="bandpass";f.frequency.value=900;f.Q.value=.6;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.35);g.gain.exponentialRampToValueAtTime(.0001,t+2.1);
      s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+2.2)},
    kyuin(){ // ホームランの「キュインッ」×8(高く・速く)
      if(!ac)return;const t0=now()+.02;
      const one=(t,vol)=>{
        [1,1.006,.994].forEach(det=>{
          [["square",.5,1],["sine",.25,2],["sine",.1,3]].forEach(([ty,g,h])=>{
            const o=ac.createOscillator(),gn=ac.createGain();o.type=ty;
            o.frequency.setValueAtTime(900*det*h,t);o.frequency.exponentialRampToValueAtTime(4140*det*h,t+.065);o.frequency.linearRampToValueAtTime(3520*det*h,t+.13);
            gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(vol*g/3,t+.005);gn.gain.setValueAtTime(vol*g/3,t+.1);gn.gain.linearRampToValueAtTime(0,t+.13);
            o.connect(gn);gn.connect(master);o.start(t);o.stop(t+.14);
          });
        });
      };
      for(let i=0;i<8;i++){const t=t0+i*.16;one(t,.16);one(t+.07,.05);one(t+.14,.025)} // 本体+エコー2回
    },
    thud(){if(!ac)return;const t=now();burst(t,.12,700,.3);tone(40,t,.12,"triangle",.18)},
    hr(){if(!ac)return;const t=now()+.05;[72,76,79,84,79,84,88,91].forEach((m,i)=>tone(m,t+i*.07,.16,"square",.08));tone(60,t,.6,"triangle",.15)},
    out(){if(!ac)return;const t=now();tone(55,t,.25,"sawtooth",.1,master,-4)},
    ng(){if(!ac)return;const t=now();tone(50,t,.28,"sawtooth",.12,master,-5)},
    level(){if(!ac)return;const t=now();[72,76,79,84,79,84].forEach((m,i)=>tone(m,t+i*.08,.14,"square",.08))},
    start(){if(!ac)return;const t=now();[67,72,76,79].forEach((m,i)=>tone(m,t+i*.07,.12,"square",.08))},
    pop(){if(!ac)return;const t=now();tone(79,t,.08,"square",.07);tone(86,t+.07,.12,"square",.07)},
    over(){if(!ac)return;const t=now();[72,71,69,67,64,60].forEach((m,i)=>tone(m,t+i*.16,.22,"triangle",.16))}
  };
})();

const cv=$("cv"),ctx=cv.getContext("2d"),stage=$("stage");
let W=0,H=0,dpr=1,city=[],G={};
function resize(){

function nextPitch(wait){

  {const wt=a.map(x=>x.from===S.lv&&S.lv>1?1.3:1);let r=Math.random()*wt.reduce((s,v)=>s+v,0);c=a.find((x,i)=>(r-=wt[i])<0)||a[0]} // 基本は均等、新しい区分だけ少し多め
  const it=c.items[Math.floor(Math.random()*c.items.length)];

function release(){

    dx0:(Math.random()-.5)*.04,swung:false,done:false,gone:false,trail:[]};

/* 球の軌道:p=0 投げた瞬間 → p=1 ホームベース上 */
function traj(b,p){
  const A=Math.min(W,H)*.2*b.k;let dx=b.dx0*W*p,lift=0;
  const q=Math.min(p,1);
  switch(b.cat){
    case"nonburn":dx+=-A*1.2*4*q*(1-q)*(1-q*.2);lift=H*.02*q;break;            // カーブ:いつも左へふくらんで右へ戻る
    case"res":dx+=A*1.7*(q-Math.pow(q,4));break;                                 // シュート:右寄りから手元で左へ鋭く(カーブの逆)
    case"pla":lift=H*.05*4*q*(1-q);break;                                       // チェンジアップ:ふわっと遅い
    case"haz":lift=H*.1*b.k*2.6*q*Math.sqrt(Math.max(0,1-q));break;             // フォーク:浮いてからストンと落ちる
    case"kaden":dx+=A*.55*Math.sin(q*13+b.ph)*q;lift=H*.025*Math.sin(q*9+b.ph*2)*q;break; // ナックル:ゆらゆら
  }
  const y0=G.yM-46*pSc(),x0=G.cx+8*pSc();
  // 遠近感:奥ではゆっくり、手前で速く大きく見える
  const e=Math.pow(q,1.6)+(p>1?(p-1)*1.6:0);
  return{x:x0+(G.cx-x0)*q+dx,y:y0+(G.yHit-y0)*e-lift,r:BALL_R,e};
}
const BALL_R=19; // 投球中のボールの大きさ(ピッチャーからキャッチャーまで一定)
function pSc(){return (.64+.05*(S?S.lv:1))*Math.max(.8,Math.min(1.4,H/420))}

function swing(id){
  if(!S||S.state!=="play"||S.phase!=="flight"||!S.ball||S.ball.swung)return;
  const b=S.ball,btn=$("bin-"+id);b.swung=true;S.swingT=0;
  if(b.cat!==id){ // 品目ちがい → アウト+説明

    showModal({eyebrow:"ざんねん!",title:`${b.name}は「${c.full}」です`,color:c.color,icons:[b.e],body:c.desc,pitch:pitchHTML(c),
      onClose:()=>{S.state="play";Snd.init();Snd.bgmStart();nextPitch();last=performance.now();requestAnimationFrame(loop)}});
    return;
  }
  const extra=Math.min(.05,(performance.now()-last)/1000); // フレームの間に押した分も正確に

  if(h){
    flash(btn,"flash-ok");if(h.k==="hr"){Snd.bang();Snd.cheer();setTimeout(()=>{if(S&&S.state==="play")Snd.kyuin()},120);setTimeout(()=>{if(S&&S.state==="play")Snd.hr()},1500)}else{Snd.bat();Snd.hit(3-HITS.findIndex(x=>x.k===h.k))}record(h.k,h.pts);
    const pos=traj(b,b.p);b.gone=true;startHit(h.k,pos);
    banner(h.txt,h.c,`+${h.pts}点 ・ ${PITCH[b.cat].n}`);
    if(h.k==="hr"){S.shake=.45;S.flashT=0;setTimeout(()=>{if(S&&S.state==="play")fireworks()},900);if(navigator.vibrate)try{navigator.vibrate([60,30,120])}catch(e){}}
    S.phase="result";S.phT=0;S.resT=h.k==="hr"?2.6:1.8;
  }else if(ad<=OUT_W){ // 当たったけどアウト
    flash(btn,"flash-ok");Snd.bat();record("out");
    const pos=traj(b,b.p);b.gone=true;startHit(d<0?"gout":"fout",pos);
    const nm=d<0?["引っかけてゴロ","ボテボテのゴロ","サードゴロ"]:["詰まってフライ","ポップフライ","ファーストフライ"];
    banner(nm[Math.floor(Math.random()*nm.length)]+"!","#ff3b55",d<0?"ちょっと早い・アウト":"ちょっと遅い・アウト");
    setTimeout(()=>{if(S&&S.state==="play")Snd.out()},350);

  }else{ // 空振り

}
function record(k,pts=0){S.st[k]++;S.results.push(k);S.lvPts+=pts;S.score+=pts;hud()}
function banner(txt,c,sub){S.banner={txt,c,sub,t:0}}
/* 打球:hr=スタンドへ / b3・b2=フェンス直撃 / b1=外野のフェンス手前 / gout=内野ゴロ / fout=内野フライ */
function startHit(k,from){
  const side=Math.random()<.5?-1:1,fy=G.fy;
  const P={
    hr:  {x:G.cx+(Math.random()-.5)*W*.06,y:-H*.25,arc:.1,dur:1.9},   // いつもセンターのバックスクリーン方向
    b3:  {x:G.cx+side*W*(.12+.18*Math.random()),y:fy+2,arc:.3,dur:1.2},
    b2:  {x:G.cx+side*W*(.44+.04*Math.random()),y:fy+H*.015,arc:.22,dur:1.05},
    b1:  {x:G.cx+side*W*(.2+.2*Math.random()),y:fy+3,arc:.14,dur:1.05},
    gout:{x:G.cx+side*W*(.12+.15*Math.random()),y:H*.43,arc:.03,dur:.8},
    fout:{x:G.cx+side*W*.12*Math.random(),y:H*.5,arc:.42,dur:1.35}
  }[k];
  S.hitBall={k,x0:from.x,y0:from.y,x1:P.x,y1:P.y,arc:P.arc,r0:from.r,t:0,dur:P.dur,e:S.ball.e,img:S.ball.img,landed:false,x:from.x,y:from.y,r:from.r};
}
/* 打球の位置と大きさ */
function hitPos(hb){
  const q=Math.min(1,hb.t/hb.dur);
  let e=hb.k==="gout"?q:1-Math.pow(1-q,2);
  let lift=Math.sin(q*Math.PI)*H*hb.arc;
  if(hb.k==="gout")lift=Math.abs(Math.sin(q*Math.PI*3))*H*.035*(1-q);       // ゴロ:3回バウンド
  // ホームランは2塁打・3塁打と同じ弧のまま、画面の外まで飛んでいく
  let r;
  if(hb.k==="hr"){ // 手前に飛び出して今の3倍まで大きく → 遠くへ小さく
    r=hb.r0*(1+2*Math.sin(Math.min(1,q/.2)*Math.PI/2)); // 3倍まで大きくなって、そのまま場外へ
  }else if(hb.k==="fout"){r=hb.r0*(1+.5*Math.sin(q*Math.PI))*(1-.5*q)}
  else r=hb.r0*(1-.72*e)+2;
  return{x:hb.x0+(hb.x1-hb.x0)*e,y:hb.y0+(hb.y1-hb.y0)*e-lift,r:Math.max(4,r),q};
}
/* 2塁打以上は炎と煙を出す */
function emitTrail(hb,dt){
  const lvl={b2:1,b3:2,hr:3}[hb.k];if(!lvl||hb.landed)return;
  const n=Math.ceil(lvl*2.2*(dt*60));
  for(let i=0;i<n;i++){
    const j=hb.r*.5;
    S.trail.push({x:hb.x+(Math.random()-.5)*j,y:hb.y+(Math.random()-.5)*j,vx:(Math.random()-.5)*30,vy:-3-Math.random()*8,
      r:Math.min(hb.r,40)*(.45+.35*Math.random())*(lvl===3?1.1:.8),t:0,life:.35+.15*lvl,fire:true});
    if(Math.random()<.5)S.trail.push({x:hb.x,y:hb.y,vx:(Math.random()-.5)*20,vy:-6,r:Math.min(hb.r*.5,14),t:0,life:.7+.2*lvl,fire:false});
  }
  if(lvl===3&&Math.random()<.6)S.trail.push({x:hb.x,y:hb.y,vx:(Math.random()-.5)*160,vy:(Math.random()-.5)*160,r:2.5,t:0,life:.5,spark:true});
}
function landHit(hb){
  hb.landed=true;
  if(hb.k==="hr")return;
  const big=hb.k==="b2"||hb.k==="b3";
  for(let i=0;i<(big?18:9);i++)S.trail.push({x:hb.x,y:hb.y,vx:(Math.random()-.5)*(big?120:70),vy:-Math.random()*(big?70:40),r:3+Math.random()*4,t:0,life:.6,dust:true});

}
function fireworks(){
  const cols=["#ffe14a","#7cf03a","#2ec6ff","#ff3d9a","#ff8a1f"];
  for(let j=0;j<3;j++){const x=W*(.2+.3*j),y=H*(.12+.08*(j%2));
    for(let i=0;i<22;i++){const a=i/22*6.283,v=60+Math.random()*80;S.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:-j*.25,c:cols[(i+j)%5]})}}

function levelEnd(){

        `<div class="next">ここからが本番…<b style="color:#ff5a5a">☠ 地獄モード</b>突入!<br>球速1.3倍で、小学生からもう一周。LIFEは全回復!</div>`;
      $("start").textContent="▶ 地獄モードへ";$("best").hidden=true;showOv();draw();return;
    }

      `<div class="big">${S.lvPts}<small> 点 / 目標${GOAL}点</small></div>${stats}`;
    if(!S.fire)r.innerHTML+=`<div class="next">次は<b>🔥闘志モード</b>の${LV_NAME[S.lv-1]}ピッチャー!球が速くなるぞ</div>`;

function end(clear,stats){

function fitOv(){
  const ov=$("ov"),inn=$("ovin");if(ov.hidden)return;
  inn.style.transform="none";
  const s=Math.min(1,(ov.clientHeight-12)/inn.offsetHeight,(ov.clientWidth-8)/inn.offsetWidth);

}
function showOv(){$("ov").hidden=false;fitOv()}
function hud(){
  $("lv").textContent=S?(S.hell?"☠":"")+S.lv+(S.fire?"🔥":""):1;$("lv").style.color=S&&S.hell?"#ff5a5a":"";$("sc").textContent=S?S.score:0;
  const l=S?Math.max(0,S.life):3;let h="";for(let i=0;i<3;i++)h+=`<span class="${i<l?"":"off"}">❤️</span>`;$("lf").innerHTML=h;
}
hud();

/* ===== 毎フレームの更新 ===== */
let last=0;
function loop(now){
  if(!S||S.state!=="play"){draw();return}
  const dt=Math.min(.05,(now-last)/1000);last=now;S.clock+=dt;
  update(dt);draw();
  if(S.state==="play")requestAnimationFrame(loop);
}
function update(dt){
  S.phT+=dt;S.swingT+=dt;
  const b=S.ball;
  if(b&&!b.gone){
    b.t+=dt;b.p=b.t/b.T;const pos=traj(b,b.p);b.trail.push(pos);if(b.trail.length>9)b.trail.shift();
    if(b.p>1.32){b.gone=true;Snd.mitt()}
  }
  if(S.phase==="windup"){if(S.phT>=S.windT)release()}
  else if(S.phase==="flight"){
    if(!b.swung&&b.t>b.T+OUT_W*unit()+.05){ // 見逃し
      b.swung=true;record("out");Snd.out();
      const c=CATS.find(x=>x.id===b.cat);
      banner("見逃し!","#ff3b55","アウト");toast(`${b.name}は「${c.name}」ボタン`,1500);
      S.phase="result";S.phT=0;S.resT=1.4;
    }
  }
  else if(S.phase==="result"){if(S.phT>=S.resT)nextPitch()}
  const hb=S.hitBall;
  if(hb){hb.t+=dt;const p=hitPos(hb);hb.x=p.x;hb.y=p.y;hb.r=p.r;emitTrail(hb,dt);if(p.q>=1&&!hb.landed)landHit(hb)}
  for(const p of S.trail){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.dust)p.vy+=160*dt}
  S.trail=S.trail.filter(p=>p.t<p.life);
  if(S.shake>0)S.shake-=dt;
  if(S.flashT!=null)S.flashT+=dt;
  if(S.fenceT!=null)S.fenceT+=dt;
  if(S.banner)S.banner.t+=dt;
  if(S.gauge)S.gauge.t+=dt;

/* バッター:野球盤のように、ホームベース横の軸を中心に回るバット(地面の上を上から見た形) */
const BAT_SWING=[ // [時間, 角度(度) 0=ホームベースの上で水平・プラス=キャッチャー側]
  [0,140],[.1,0],[.2,-72],[.45,-72],[.8,140]

function batAngle(){
  const t=S?Math.min(S.swingT,.8):.8;
  let i=0;while(i<BAT_SWING.length-2&&t>BAT_SWING[i+1][0])i++;
  const a=BAT_SWING[i],b=BAT_SWING[i+1],k=Math.min(1,(t-a[0])/(b[0]-a[0]));
  const s=i===0?k*k:k*k*(3-2*k);                       // 振り出しは加速、ほかはなめらか
  return(a[1]+(b[1]-a[1])*s)*Math.PI/180;
}

}
function drawBoard(){
  const done=S.results.length,cur=Math.min(S.count,PITCHES);
  ctx.save();ctx.fillStyle="rgba(8,20,58,.85)";ctx.strokeStyle="rgba(46,198,255,.8)";ctx.lineWidth=2;
  rr(8,8,128,46,10);ctx.fill();ctx.stroke();
  txt(`${cur}球目`,16,22,15,"#ffffff",900,"left");txt(`/ ${PITCHES}`,80,22,11,"#a9bde6",800,"left");
  for(let i=0;i<PITCHES;i++){const k=S.results[i];ctx.fillStyle=k?KCOL[k]:(i===done?"rgba(255,255,255,.75)":"rgba(255,255,255,.18)");ctx.beginPath();ctx.arc(18+i*11.4,42,4,0,6.283);ctx.fill()}
  const w=118,x=W-8-w;
  ctx.fillStyle="rgba(8,20,58,.85)";rr(x,8,w,46,10);ctx.fill();ctx.stroke();
  txt(`${S.lvPts}`,x+10,22,16,S.lvPts>=GOAL?"#7cf03a":"#ffe14a",900,"left");txt(`点 / 目標${GOAL}点`,x+10+ctx.measureText(String(S.lvPts)).width+4,22,11,"#a9bde6",800,"left");
  ctx.fillStyle="rgba(255,255,255,.15)";rr(x+10,37,w-20,8,4);ctx.fill();
  ctx.fillStyle=S.lvPts>=GOAL?"#7cf03a":"#ffe14a";rr(x+10,37,(w-20)*Math.min(1,S.lvPts/GOAL),8,4);ctx.fill();
  ctx.restore();
}
/* タイミングゲージ(打った位置を表示) */
function drawGauge(){
  const gw=Math.min(W*.86,360),gh=14,x0=(W-gw)/2,y=H*.47+(W<380?40:46),sx=gw/(MISS_W*2),cx=W/2;
  const a=S.gauge.t>1.3?Math.max(0,1-(S.gauge.t-1.3)/.3):1;
  ctx.save();ctx.globalAlpha=a;
  ctx.fillStyle="rgba(8,20,58,.88)";rr(x0-8,y-8,gw+16,gh+30,10);ctx.fill();
  const seg=(w0,w1,c)=>{ctx.fillStyle=c;ctx.fillRect(cx-w1*sx,y,(w1-w0)*sx,gh);ctx.fillRect(cx+w0*sx,y,(w1-w0)*sx,gh)};
  seg(OUT_W,MISS_W,"#3a4566");const hz=hits();seg(hz[hz.length-1].w,OUT_W,"#c8303f");for(let i=hz.length-1;i>=0;i--)seg(i?hz[i-1].w:0,hz[i].w,KCOL[hz[i].k]);
  ctx.strokeStyle="rgba(255,255,255,.6)";ctx.lineWidth=1.5;ctx.strokeRect(x0,y,gw,gh);
  const d=Math.max(-MISS_W,Math.min(MISS_W,S.gauge.d)),mx=cx+d*sx;
  ctx.fillStyle="#fff";ctx.shadowColor="#fff";ctx.shadowBlur=8;
  ctx.beginPath();ctx.moveTo(mx,y-2);ctx.lineTo(mx-6,y-10);ctx.lineTo(mx+6,y-10);ctx.closePath();ctx.fill();ctx.fillRect(mx-1.5,y-2,3,gh+4);ctx.shadowBlur=0;
  txt("◀ 早い",x0,y+gh+9,10,"#a9bde6",800,"left");txt("遅い ▶",x0+gw,y+gh+9,10,"#a9bde6",800,"right");txt("ジャスト",cx,y+gh+9,10,"#ffe14a",800);
  ctx.restore();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  const sh=S&&S.shake>0?S.shake*22:0;
  ctx.save();if(sh)ctx.translate((Math.random()-.5)*sh,(Math.random()-.5)*sh);
  drawScene();ctx.restore();
  if(S&&S.flashT!=null&&S.flashT<.35){ctx.fillStyle=`rgba(255,255,240,${.75*(1-S.flashT/.35)})`;ctx.fillRect(0,0,W,H)}
}
function drawScene(){
  drawField();if(S&&S.hell){ctx.fillStyle="rgba(4,0,14,.42)";ctx.fillRect(0,0,W,H)}drawLane();drawMound();drawPitcher();drawZone();drawBatter();
  if(!S)return;
  const b=S.ball;
  if(b&&!b.gone){
    b.trail.forEach((p,i)=>{ctx.globalAlpha=(i/b.trail.length)*.25;ctx.fillStyle="#bfe9ff";ctx.beginPath();ctx.arc(p.x,p.y,p.r*.8,0,6.283);ctx.fill()});ctx.globalAlpha=1;
    const p=traj(b,b.p);
    ctx.fillStyle="rgba(0,0,0,.3)";ctx.beginPath();ctx.ellipse(p.x,G.yM+(G.yP-G.yM)*Math.min(p.e,1.4)+2,p.r*.8,p.r*.25,0,0,6.283);ctx.fill();
    drawBallAt(p.x,p.y,p.r,b.e,b.img);
    if(b.p>.12)txt(b.name,p.x,p.y+p.r+11,Math.round(10+3*Math.min(b.p,1)),"#ffffff",800);
  }
  if(S.fenceT!=null&&S.fenceT<.6){ // フェンス直撃でネオンが光る
    ctx.save();ctx.globalAlpha=1-S.fenceT/.6;ctx.strokeStyle="#ffe14a";ctx.lineWidth=6;ctx.shadowColor="#ffe14a";ctx.shadowBlur=24;
    ctx.beginPath();ctx.moveTo(S.fenceX-W*.18,G.fy-7);ctx.lineTo(S.fenceX+W*.18,G.fy-7);ctx.stroke();ctx.restore()}
  // 煙(下)→炎(加算合成)
  for(const p of S.trail){const a=1-p.t/p.life;
    if(p.dust){ctx.globalAlpha=a*.7;ctx.fillStyle="#d8b48a";ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill()}
    else if(!p.fire&&!p.spark){ctx.globalAlpha=a*.35;ctx.fillStyle="#9aa6bb";ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1+p.t*2.5),0,6.283);ctx.fill()}}
  ctx.globalAlpha=1;
  ctx.save();ctx.globalCompositeOperation="lighter";
  for(const p of S.trail){if(!p.fire&&!p.spark)continue;const a=1-p.t/p.life;
    if(p.spark){ctx.globalAlpha=a;ctx.fillStyle="#fff3b0";ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();continue}
    const r=p.r*(1-.5*p.t/p.life),g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
    g.addColorStop(0,`rgba(255,250,200,${.9*a})`);g.addColorStop(.35,`rgba(255,170,40,${.7*a})`);g.addColorStop(1,"rgba(255,40,0,0)");
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r,0,6.283);ctx.fill()}
  ctx.restore();ctx.globalAlpha=1;
  const hb=S.hitBall;
  if(hb&&!(hb.k==="hr"&&hb.landed)){
    if(hb.k==="hr"||hb.k==="b3"){ctx.save();ctx.shadowColor=hb.k==="hr"?"#ffe14a":"#ff9a1f";ctx.shadowBlur=30;ctx.fillStyle="rgba(255,200,80,.35)";ctx.beginPath();ctx.arc(hb.x,hb.y,hb.r*1.15,0,6.283);ctx.fill();ctx.restore()}
    drawBallAt(hb.x,hb.y,hb.r,hb.e,hb.img,1)}
  for(const p of S.parts){if(p.t<0)continue;ctx.globalAlpha=Math.max(0,1-p.t/1.1);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,2.6,0,6.283);ctx.fill()}
  ctx.globalAlpha=1;
  if(S.banner&&S.banner.t<1.5){const bn=S.banner,q=bn.t,sc=q<.15?.6+q/.15*.5:q<.25?1.1-(q-.15):1;
    ctx.save();ctx.globalAlpha=q>1.2?Math.max(0,1-(q-1.2)/.3):1;ctx.translate(W/2,H*.47);ctx.scale(sc,sc);ctx.rotate(-.05);
    txt(bn.txt,0,0,Math.min(40,W*.1),bn.c,900);if(bn.sub)txt(bn.sub,0,Math.min(30,W*.075),14,"#ffffff",800);ctx.restore()}
  if(S.gauge)drawGauge();
  if(S.count)drawBoard();
}

function go(){
  if(!$("modal").hidden)return;
  if(S&&S.state==="clear"){if(S.fire){S.fire=false;if(S.lv>=MAX_LV){S.hell=true;S.lv=1;S.life=3;S.fireSeen=new Set()}else S.lv++}else S.fire=true;beginLevel()}
  else if(S&&S.state==="fail")beginLevel();
  else start();
}
$("start").addEventListener("click",go);
addEventListener("keydown",e=>{
  if(!$("modal").hidden){if(e.key==="Enter"||e.key==="Escape"||e.key===" "){e.preventDefault();hideModal()}return}
  if(!S||S.state!=="play"){if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}return}
  const c=CATS[+e.key-1];if(c&&c.from<=S.lv)swing(c.id);
});
resize();draw();fitOv();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitOv);
</script>

</body></html>
