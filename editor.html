<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>コース表 編集ツール（管理用）</title>
<style>
  :root, :root[data-theme="light"]{
    --bg:#f6f6f3; --card:#ffffff; --border:rgba(0,0,0,.1); --border2:rgba(0,0,0,.28);
    --text:#1b1f19; --sub:#6b6f68; --orange:#e8630f; --teal:#2f8a6f; --red:#cf4335; --blue:#2f6fe0;
    --surface1:rgba(0,0,0,.06); --surface2:rgba(0,0,0,.045); --surface3:rgba(0,0,0,.03);
    --input-bg:rgba(0,0,0,.035); --input-border:rgba(0,0,0,.16); --overlay-bg:rgba(0,0,0,.45);
    --key-bg:rgba(47,138,111,.13); --key-border:rgba(47,138,111,.4); --key-fg:#1f6b53;
    --nokey-bg:rgba(207,67,53,.13); --nokey-fg:#a3392b;
    --type-bg:rgba(0,0,0,.05); --type-fg:#50544c;
    --days-bg:rgba(47,111,224,.12); --days-fg:#1f4fb0;
    --danger-bg:rgba(207,67,53,.1); --danger-border:rgba(207,67,53,.4); --danger-fg:#a3392b;
    --orangechip-bg:rgba(232,99,15,.14); --orangechip-fg:#a3480c;
    --chip-fg:#fff;
  }
  :root[data-theme="dark"]{
    --bg:#181b16; --card:#20241f; --border:rgba(255,255,255,.1); --border2:rgba(255,255,255,.25);
    --text:#f4f2ec; --sub:#9a9a92; --orange:#FF7A29; --teal:#4FA88D; --red:#E85D4E; --blue:#4C8DFF;
    --surface1:rgba(255,255,255,.1); --surface2:rgba(255,255,255,.08); --surface3:rgba(255,255,255,.05);
    --input-bg:rgba(0,0,0,.3); --input-border:rgba(255,255,255,.18); --overlay-bg:rgba(0,0,0,.75);
    --key-bg:rgba(79,168,141,.2); --key-border:rgba(79,168,141,.4); --key-fg:#8fd8c2;
    --nokey-bg:rgba(232,93,78,.2); --nokey-fg:#f2a89e;
    --type-bg:rgba(255,255,255,.08); --type-fg:#cfcfc7;
    --days-bg:rgba(76,141,255,.18); --days-fg:#9dbdfb;
    --danger-bg:rgba(232,93,78,.15); --danger-border:rgba(232,93,78,.5); --danger-fg:#f2a89e;
    --orangechip-bg:rgba(255,122,41,.18); --orangechip-fg:#ffb37a;
    --chip-fg:#fff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
  header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 14px 8px;z-index:10}
  h1{margin:0 0 8px;font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:space-between;gap:8px}
  h1 .btns{display:flex;gap:6px}
  .themebtn{border:1px solid var(--border2);background:transparent;border-radius:999px;width:32px;height:32px;font-size:15px;color:var(--text);cursor:pointer;flex:0 0 auto}
  .toprow{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
  .toprow button{flex:0 0 auto;border:1px solid var(--border);border-radius:999px;padding:8px 13px;font-weight:800;font-size:13px;color:var(--sub);background:transparent}
  .toprow button.active{border-color:var(--border2);background:var(--surface1);color:var(--text)}
  .courserow{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
  .courserow button{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:7px 12px;font-weight:700;font-size:12.5px;color:var(--sub);background:transparent}
  .courserow button.active{border-color:var(--border2);background:var(--surface2);color:var(--text)}
  .courserow button.add{border-style:dashed}
  .dayrow{display:flex;gap:6px;overflow-x:auto;padding:6px 0 2px}
  .dayrow button{flex:0 0 auto;border:1px solid var(--border);border-radius:999px;padding:6px 11px;font-weight:800;font-size:12.5px;color:var(--sub);background:transparent}
  .dayrow button.active{border-color:var(--orange);background:var(--orangechip-bg);color:var(--orangechip-fg)}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  main{padding:12px 14px 60px;max-width:640px;margin:0 auto}
  .btn{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:9px 13px;font-weight:800;font-size:13px;border:1px solid var(--border2);background:transparent;color:var(--text);cursor:pointer}
  .btn.primary{background:var(--orange);color:#fff;border-color:var(--orange)}
  .btn.danger{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger-fg)}
  .btn.ghost{background:transparent}
  .btn.block{width:100%;justify-content:center;padding:13px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.sm{padding:6px 10px;font-size:12px}
  .search{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font-size:15px;margin-bottom:10px}
  .card{display:flex;align-items:center;gap:10px;border:1px solid var(--border);background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px}
  .num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--surface1);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
  .posinput{flex:0 0 auto;width:44px;height:30px;padding:0;text-align:center;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font-size:13px;font-weight:800}
  .updown{display:flex;flex-direction:column;flex:0 0 auto}
  .updown button{background:none;border:none;color:var(--sub);font-size:13px;padding:1px 4px;cursor:pointer}
  .updown button:disabled{opacity:.2}
  .info{flex:1;min-width:0;cursor:pointer}
  .name{font-weight:800;font-size:15px}
  .addr{font-size:11px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
  .badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700}
  .badge.key{background:var(--key-bg);color:var(--key-fg)}
  .badge.nokey{background:var(--nokey-bg);color:var(--nokey-fg)}
  .badge.type{background:var(--type-bg);color:var(--type-fg)}
  .badge.days{background:var(--days-bg);color:var(--days-fg)}
  .badgeline{display:flex;gap:6px;margin-top:4px}
  .maplink{flex:0 0 auto;width:36px;height:36px;border-radius:10px;background:var(--days-bg);color:var(--blue);display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:15px}
  .thumb{flex:0 0 auto;width:40px;height:40px;border-radius:9px;object-fit:cover;border:1px solid var(--border);cursor:pointer}
  .thumbwrap{position:relative;flex:0 0 auto}
  .thumbcount{position:absolute;bottom:-4px;right:-4px;background:var(--orange);color:#fff;font-size:9px;font-weight:800;border-radius:999px;padding:1px 5px;line-height:1.3}
  .photogrid{display:flex;flex-wrap:wrap;gap:8px}
  .phototile{position:relative;width:84px;height:84px}
  .phototile img{width:100%;height:100%;object-fit:cover;border-radius:10px;border:1px solid var(--border)}
  .phototile .rm{position:absolute;top:-6px;right:-6px;background:rgba(0,0,0,.7);color:#fff;border:none;width:22px;height:22px;border-radius:50%;font-size:12px;line-height:1;cursor:pointer}
  .phototile.addtile{display:flex;align-items:center;justify-content:center;border:2px dashed var(--input-border);border-radius:10px;color:var(--sub);font-size:26px;background:none;cursor:pointer}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:80;padding:20px}
  .lightbox.show{display:flex}
  .lightbox-strip{display:flex;gap:12px;overflow-x:auto;max-width:100%;max-height:100%;scroll-snap-type:x mandatory}
  .lightbox-strip img{max-width:88vw;max-height:80vh;border-radius:10px;scroll-snap-align:center}
  .lightbox-close{position:fixed;top:16px;right:16px;background:rgba(255,255,255,.15);color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:18px;z-index:81}
  .empty{text-align:center;color:var(--sub);padding:50px 20px;font-size:14px;line-height:1.7}
  .section-head{display:flex;justify-content:space-between;align-items:center;margin:6px 0 10px}
  .section-head h2{margin:0;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
  .count{font-size:12px;color:var(--sub);font-weight:600}
  .overlay{position:fixed;inset:0;background:var(--overlay-bg);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .overlay.show{display:flex}
  .modal{width:100%;max-height:92vh;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;border-top:1px solid var(--border)}
  .modal-head{position:sticky;top:0;background:var(--card);display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--border)}
  .modal-head h2{margin:0;font-size:16px;font-weight:900}
  .closebtn{background:var(--surface1);border:none;color:var(--text);width:32px;height:32px;border-radius:50%;font-size:18px}
  .modal-body{padding:16px}
  .field{display:block;margin-bottom:16px}
  .field .lb{display:block;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--sub);margin-bottom:6px}
  input[type=text], input[type=search], textarea, select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font-size:15px}
  textarea{resize:vertical}
  .colorrow{display:flex;gap:8px;flex-wrap:wrap}
  .colorrow button{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer}
  .colorrow button.active{border-color:var(--text)}
  .keyrow{display:flex;gap:8px}
  .keyrow button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--input-border);background:transparent;color:var(--sub);font-weight:700;font-size:14px;cursor:pointer}
  .keyrow button.active.yes{border-color:var(--teal);background:var(--key-bg);color:var(--key-fg)}
  .keyrow button.active.no{border-color:var(--red);background:var(--nokey-bg);color:var(--nokey-fg)}
  .daysrow{display:flex;gap:6px;flex-wrap:wrap}
  .daysrow button{width:38px;height:38px;border-radius:10px;border:1px solid var(--input-border);background:transparent;color:var(--sub);font-weight:800;font-size:13px}
  .daysrow button.active{border-color:var(--blue);background:var(--days-bg);color:var(--days-fg)}
  .photobox{position:relative}
  .photobox img{width:100%;height:190px;object-fit:cover;border-radius:10px;border:1px solid var(--border)}
  .photobox .rm{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.7);border:none;color:#fff;width:30px;height:30px;border-radius:50%;font-size:15px}
  .uploadbox{height:130px;width:100%;border:2px dashed var(--input-border);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--sub);cursor:pointer;background:none}
  .modal-actions{display:flex;justify-content:space-between;gap:8px;margin-top:6px;align-items:center}
  .modal-actions .right{display:flex;gap:8px}
  .confirmbox{border:1px solid var(--danger-border);background:var(--danger-bg);border-radius:10px;padding:14px;margin-top:10px}
  .confirmbox p{margin:0 0 10px;font-size:13.5px;color:var(--danger-fg)}
  .confirm-actions{display:flex;justify-content:flex-end;gap:8px}
  .hint{font-size:12px;color:var(--sub);line-height:1.7;margin-bottom:12px}
  .hint code{background:var(--surface2);padding:1px 5px;border-radius:4px}
  .preview{margin-top:10px;border:1px solid var(--key-border);background:var(--key-bg);border-radius:10px;padding:10px;font-size:12.5px;color:var(--key-fg)}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#2a2f27;border:1px solid rgba(255,255,255,.25);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;z-index:100;display:none;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  a.maplink-inline{color:var(--blue);font-size:13px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:5px;margin-top:6px}
  .typebox{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
  .typebox .th{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .typebox .th strong{font-size:13.5px;font-weight:800}
  .togglechip{border:1px solid var(--input-border);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;color:var(--sub);background:transparent}
  .togglechip.on{border-color:var(--teal);background:var(--key-bg);color:var(--key-fg)}
  .lockscreen{position:fixed;inset:0;background:var(--bg);color:var(--text);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
  .lockscreen input{width:220px;text-align:center;font-size:18px;letter-spacing:2px}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--surface1);border-top-color:var(--text);border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
.wtrow { display: flex; flex-wrap: wrap; gap: 6px; }
.wtrow button { width: auto; height: auto; min-height: 38px; padding: 8px 12px; border-radius: 8px; white-space: nowrap; writing-mode: horizontal-tb; font-size: 13px; line-height: 1.2; flex: 0 0 auto; }
  .banner{display:block;width:100%;aspect-ratio:1046/213;object-fit:cover;background:#dfe3ea}
</style>
</head>

<div id="errBanner" style="display:none;position:fixed;top:0;left:0;right:0;background:#cf4335;color:#fff;font-size:12px;padding:10px 14px;z-index:999;white-space:pre-wrap;word-break:break-word"></div>
<div class="lockscreen" id="lockscreen">
  <div style="font-size:34px">🔒</div>
  <div style="font-weight:800">編集用パスコード</div>
  <input type="text" id="passInput" autocapitalize="off" autocorrect="off" placeholder="パスコード">
  <button class="btn primary" id="passBtn">開く</button>
  <div id="passErr" style="color:#f2a89e;font-size:12px;display:none">パスコードが違います</div>

<script>
/* ==== エラーを画面に表示（デバッグ用） ==== */
function hideErr() { const b = document.getElementById('errBanner'); if (b && b.dataset.sticky !== '1') b.style.display = 'none'; }
function showErr(msg, sticky = true) {
  const b = document.getElementById('errBanner');
  b.textContent = '⚠️ ' + msg + '（タップで閉じる）';
  b.dataset.sticky = sticky ? '1' : '0';
  b.style.display = 'block';
  b.onclick = () => { b.style.display = 'none'; };
}
window.addEventListener('error', e => showErr('スクリプトエラー: ' + (e.message || e) + (e.filename ? ` (${e.filename}:${e.lineno})` : '')));
window.addEventListener('unhandledrejection', e => showErr('通信/非同期エラー: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)));
if (typeof firebase === 'undefined') {
  showErr('Firebaseの読み込みに失敗しました。通信環境をご確認のうえ、リロードしてください。（広告ブロッカー等が原因の場合もあります）');
}

/* ==== テーマ ==== */
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('cm_theme', t); } catch (e) {}
}
let savedTheme = 'light';
try { savedTheme = localStorage.getItem('cm_theme') || 'light'; } catch (e) {}
applyTheme(savedTheme);
document.getElementById('themeBtn').onclick = () => applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');

const WASTE_TYPES = [
  { key: 'combustible', label: '可燃ゴミ', icon: '🔥' },
  { key: 'cardboard', label: 'ダンボール', icon: '📦' },
  { key: 'beverage', label: '飲料容器', icon: '🥤' },
  { key: 'styrofoam', label: '発泡スチロール', icon: '🧊' },
  { key: 'vinyl', label: 'ビニール', icon: '🛍️' },
];
const WT = Object.fromEntries(WASTE_TYPES.map(w => [w.key, w]));
const WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];
const COLORS = ['#FF7A29', '#4FA88D', '#4C8DFF', '#E8B84B', '#E85D4E', '#9B7EDE'];

/* ==== ロック画面（ブラウザ/アプリを再度開いても、24時間以上操作がない時だけ再確認） ==== */
const IDLE_LIMIT_MS = 24 * 60 * 60 * 1000; // 24時間
function markActive() { try { localStorage.setItem('cm_unlocked_at', String(Date.now())); } catch (e) {} }
function recentlyUnlocked() {
  try {
    const t = localStorage.getItem('cm_unlocked_at');
    return !!t && (Date.now() - parseInt(t, 10)) < IDLE_LIMIT_MS;
  } catch (e) { return false; }
}

/* ==== helpers ==== */
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
function mapsUrl(addr) { return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(addr); }
function esc(s) { return (s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast._h); toast._h = setTimeout(() => t.style.display = 'none', 2200); }
function storagePath(custId, photoId) { return photoId === '__legacy__' ? `course-photos/${custId}.jpg` : `course-photos/${custId}__${photoId}.jpg`; }
function photoUrlFor(custId, photoId) { return `https://firebasestorage.googleapis.com/v0/b/${firebaseConfig.storageBucket}/o/${encodeURIComponent(storagePath(custId, photoId))}?alt=media&t=${Date.now()}`; }
function customerPhotoIds(cu) { if (cu.photos && cu.photos.length) return cu.photos; if (cu.hasPhoto) return ['__legacy__']; return []; }
async function uploadPhotoAt(custId, photoId, blob) { await storage.ref(storagePath(custId, photoId)).put(blob, { contentType: 'image/jpeg' }); }
async function deletePhotoAt(custId, photoId) { try { await storage.ref(storagePath(custId, photoId)).delete(); } catch (e) {} }
function openLightbox(custId) {
  const cu = customers.find(c => c.id === custId);
  const ids = cu ? customerPhotoIds(cu) : [];
  document.getElementById('lightboxStrip').innerHTML = ids.map(id => `<img src="${photoUrlFor(custId, id)}">`).join('');
  document.getElementById('lightbox').classList.add('show');
}
document.getElementById('lightboxClose').onclick = () => document.getElementById('lightbox').classList.remove('show');
function compressImage(file, maxDim = 900, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('読み込み失敗'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('画像解析失敗'));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('変換失敗')), 'image/jpeg', quality);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ==== Firestore layer ==== */
async function getWithRetry(queryRef, tries = 4) {
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try {
      return await queryRef.get({ source: 'server' });
    } catch (e) {
      lastErr = e;
      if (i < tries - 1) await new Promise(r => setTimeout(r, 800 * (i + 1)));
    }
  }
  throw lastErr;
}
function computeCourseIds(items) {
  const ids = new Set();
  for (const k of Object.keys(items || {})) {
    const v = items[k];
    const arr = Array.isArray(v) ? v : [v];
    for (const a of arr) if (a && a.courseId) ids.add(a.courseId);
  }
  return [...ids];
}
function mergeCustomersInto(docs) {
  const fetched = docs.map(d => ({ id: d.id, ...d.data() }));
  const fetchedIds = new Set(fetched.map(c => c.id));
  customers = customers.filter(c => !fetchedIds.has(c.id)).concat(fetched);
}
async function fetchCourses() {
  const snap = await getWithRetry(db.collection('cm_courses'));
  courses = snap.docs.map(d => ({ id: d.id, ...d.data() }));
}
async function ensureCourseLoaded(courseId) {
  if (!courseId || allCustomersLoaded || loadedCourseIds.has(courseId)) return;
  const snap = await getWithRetry(db.collection('cm_customers').where('courseIds', 'array-contains', courseId));
  mergeCustomersInto(snap.docs);
  loadedCourseIds.add(courseId);
}
async function ensureAllCustomersLoaded() {
  if (allCustomersLoaded) return;
  const snap = await getWithRetry(db.collection('cm_customers'));
  mergeCustomersInto(snap.docs);
  allCustomersLoaded = true;
  for (const c of courses) loadedCourseIds.add(c.id);
}
async function saveCourseDoc(course) { await db.collection('cm_courses').doc(course.id).set(course); }
async function deleteCourseDoc(id) { await db.collection('cm_courses').doc(id).delete(); }
async function saveCustomerDoc(cu) {
  const courseIds = computeCourseIds(cu.items);
  const doc = { ...cu, courseIds, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
  await db.collection('cm_customers').doc(cu.id).set(doc);
  const i = customers.findIndex(c => c.id === cu.id);
  const cached = { ...cu, courseIds };
  if (i !== -1) customers[i] = cached; else customers.push(cached);
}
async function deleteCustomerDoc(id) {
  await db.collection('cm_customers').doc(id).delete();
  customers = customers.filter(c => c.id !== id);
}

function courseLabel(c) { return c ? (c.group ? `${c.group}（${c.name}）` : c.name) : '未設定'; }
function matchesQuery(cu, q) {
  return (cu.name||'').toLowerCase().includes(q) || (cu.address||'').toLowerCase().includes(q) || (cu.mgmtNo||'').toLowerCase().includes(q);
}
function getAssignments(cu, type) {
  const it = cu.items && cu.items[type];
  if (!it) return [];
  return Array.isArray(it) ? it : [it];
}
function findAssignment(cu, type, courseId) {
  return getAssignments(cu, type).find(a => a.courseId === courseId) || null;
}
function withLegacyFallback(cu, a) {
  if (!a) return null;
  return {
    ...a,
    hasKey: a.hasKey !== undefined ? a.hasKey : (cu.hasKey || false),
    keyNumber: a.keyNumber !== undefined ? a.keyNumber : (cu.keyNumber || ''),
    memo: a.memo !== undefined ? a.memo : (cu.memo || ''),
  };
}
function customerTypeBadges(cu, excludeType) {
  return WASTE_TYPES.filter(w => w.key !== excludeType).flatMap(w =>
    getAssignments(cu, w.key).map(raw => {
      const a = withLegacyFallback(cu, raw);
      const c = courses.find(c => c.id === a.courseId);
      const daysStr = a.days && a.days.length ? a.days.join('') : '';
      return `<div class="badgeline"><span class="badge type">${w.icon} ${esc(courseLabel(c))}</span>${daysStr ? `<span class="badge days">${daysStr}</span>` : ''}</div>`;
    })
  ).join('');
}

function renderCourseList(course) {
  let items = customers.filter(c => findAssignment(c, mode, course.id));
  items.sort((a, b) => (findAssignment(a, mode, course.id).order ?? 0) - (findAssignment(b, mode, course.id).order ?? 0));
  const filtered = dayFilter !== 'all' ? items.filter(c => { const a = findAssignment(c, mode, course.id); return a.days && a.days.includes(dayFilter); }) : items;
  document.getElementById('cnt').textContent = `${filtered.length}件${dayFilter !== 'all' ? '（' + dayFilter + '曜日のみ）' : ''}`;
  const list = document.getElementById('list');
  if (!filtered.length) { list.innerHTML = `<div class="empty">${dayFilter !== 'all' ? dayFilter + '曜日の得意先はありません。' : 'まだ得意先が登録されていません。'}</div>`; return; }
  const readOnly = dayFilter !== 'all';
  list.innerHTML = filtered.map((cu, i) => {
    const it = withLegacyFallback(cu, findAssignment(cu, mode, course.id));
    return `
    <div class="card">
      ${readOnly ? `<div class="num">${i+1}</div>` : `
      <div class="updown">
        <button data-move="-1" data-id="${cu.id}" ${i===0?'disabled':''}>▲</button>
        <button data-move="1" data-id="${cu.id}" ${i===filtered.length-1?'disabled':''}>▼</button>
      </div>
      <input type="number" class="posinput" data-pos="${cu.id}" value="${i+1}" min="1" max="${filtered.length}">`}
      ${cu.hasPhoto || (cu.photos && cu.photos.length) ? `<div class="thumbwrap"><img class="thumb" src="${photoUrlFor(cu.id, customerPhotoIds(cu)[0])}" onclick="event.stopPropagation();openLightbox('${cu.id}')" onerror="this.parentElement.remove()">${customerPhotoIds(cu).length>1?`<span class="thumbcount">${customerPhotoIds(cu).length}</span>`:''}</div>` : ''}
      <div class="info" data-edit="${cu.id}">
        <div class="name">${esc(cu.name)}</div>
        <div class="badges">
          ${it.hasKey ? `<span class="badge key">🔑 ${esc(it.keyNumber||'鍵あり')}</span>` : ''}
          ${it.days && it.days.length ? `<span class="badge days">${it.days.join('')}</span>` : ''}
        </div>
        ${it.memo ? `<div class="addr">📝 ${esc(it.memo)}</div>` : ''}
        ${customerTypeBadges(cu, mode)}
      </div>
      ${cu.address ? `<a class="maplink" href="${mapsUrl(cu.address)}" target="_blank">📍</a>` : ''}
    </div>`;
  }).join('');
  list.querySelectorAll('[data-edit]').forEach(el => el.onclick = () => openCustomerModal(customers.find(c => c.id === el.dataset.edit), mode, course.id));
  if (readOnly) return;
  list.querySelectorAll('[data-move]').forEach(btn => btn.onclick = () => moveCustomer(course, btn.dataset.id, parseInt(btn.dataset.move, 10), filtered));
  list.querySelectorAll('[data-pos]').forEach(inp => {
    inp.addEventListener('click', e => e.stopPropagation());
    inp.addEventListener('change', () => moveToPosition(course, inp.dataset.pos, parseInt(inp.value, 10), filtered));
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); });
  });
}

async function reorderCourse(courseId, newOrderItems) {
  const batch = db.batch();
  newOrderItems.forEach((cu, idx) => {
    const arr = getAssignments(cu, mode).map(a => ({ ...a }));
    const a = arr.find(x => x.courseId === courseId);
    if (a && a.order !== idx) {
      a.order = idx;
      const newItems = { ...cu.items, [mode]: arr };
      const updated = { ...cu, items: newItems };
      batch.set(db.collection('cm_customers').doc(cu.id), { ...updated, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      const i = customers.findIndex(c => c.id === cu.id); if (i !== -1) customers[i] = updated;
    }
  });
  await batch.commit();
}

async function moveToPosition(course, custId, newPos, items) {
  if (busy || !newPos || isNaN(newPos)) { renderCourseList(course); return; }
  const idx = items.findIndex(c => c.id === custId);
  if (idx === -1) return;
  const newIndex = Math.min(Math.max(newPos - 1, 0), items.length - 1);
  if (newIndex === idx) return;
  busy = true;
  try {
    const copy = [...items];
    const [moved] = copy.splice(idx, 1);
    copy.splice(newIndex, 0, moved);
    await reorderCourse(course.id, copy);
    renderCourseList(course);
  } catch (e) { toast('並び替えに失敗しました'); console.error(e); }
  busy = false;
}

async function moveCustomer(course, id, dir, items) {
  if (busy) return;
  const i = items.findIndex(c => c.id === id);
  const j = i + dir;
  if (j < 0 || j >= items.length) return;
  busy = true;
  try {
    const copy = [...items];
    [copy[i], copy[j]] = [copy[j], copy[i]];
    await reorderCourse(course.id, copy);
    renderCourseList(course);
  } catch (e) { toast('並び替えに失敗しました'); console.error(e); }
  busy = false;
}

/* ==== course modal ==== */
async function clearCourseAssignments(courseId, type) {
  await ensureCourseLoaded(courseId);
  const affected = customers.filter(c => findAssignment(c, type, courseId));
  for (const cu of affected) {
    const arr = getAssignments(cu, type).filter(a => a.courseId !== courseId);
    const items = { ...cu.items };
    if (arr.length) items[type] = arr; else delete items[type];
    const updated = { ...cu, items };
    await saveCustomerDoc(updated);
    const i = customers.findIndex(c => c.id === cu.id); if (i !== -1) customers[i] = updated;
  }
  return affected.length;
}

        <div class="daysrow" id="cDays">${WEEKDAYS.map(d => `<button data-d="${d}" class="${typicalDays.includes(d)?'active':''}">${d}</button>`).join('')}</div>
      </div>
      <div class="field"><span class="lb">色ラベル</span><div class="colorrow" id="cColors"></div></div>
      <div id="cActions"></div>
    </div>
  `);
  document.getElementById('wtRow').querySelectorAll('[data-wt]').forEach(b => b.onclick = () => {
    wasteType = b.dataset.wt;
    document.getElementById('wtRow').querySelectorAll('[data-wt]').forEach(x => x.classList.toggle('on', x === b));
  });
  document.getElementById('cDays').querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
    const d = b.dataset.d;
    if (typicalDays.includes(d)) { typicalDays = typicalDays.filter(x => x !== d); b.classList.remove('active'); }
    else { typicalDays.push(d); b.classList.add('active'); }
  });
  const colorRow = document.getElementById('cColors');
  colorRow.innerHTML = COLORS.map(hex => `<button data-hex="${hex}" style="background:${hex}" class="${hex===color?'active':''}"></button>`).join('');
  colorRow.querySelectorAll('button').forEach(b => b.onclick = () => { color = b.dataset.hex; colorRow.querySelectorAll('button').forEach(x => x.classList.toggle('active', x===b)); });
  document.getElementById('cGroup').addEventListener('change', () => {
    const g = document.getElementById('cGroup').value.trim();
    const sibling = courses.find(c => c.group === g && c.wasteType === wasteType);
    if (sibling) { color = sibling.color; colorRow.querySelectorAll('button').forEach(x => x.classList.toggle('active', x.dataset.hex === color)); }
  });

  renderCourseActions();
  document.getElementById('cName').focus();

  function renderCourseActions() {
    const box = document.getElementById('cActions');
    box.innerHTML = `
      <div class="modal-actions">
        ${course ? `<div style="display:flex;gap:6px"><button class="btn danger" id="clearCourseBtn">登録をクリア</button><button class="btn danger" id="delCourseBtn">削除</button></div>` : '<span></span>'}
        <div class="right"><button class="btn ghost" onclick="closeModal()">キャンセル</button><button class="btn primary" id="saveCourseBtn">保存</button></div>
      </div>`;
    document.getElementById('saveCourseBtn').onclick = async () => {
      const name = document.getElementById('cName').value.trim();
      if (!name) { toast('コース名を入力してください'); return; }
      try {
        const sameTypeCount = courses.filter(c => c.wasteType === wasteType && c.id !== course?.id).length;
        const group = document.getElementById('cGroup').value.trim();
        await saveCourseDoc({ id: course ? course.id : uid(), name, group, wasteType, color, typicalDays, order: course ? (course.order ?? sameTypeCount) : sameTypeCount });
        closeModal(); await refreshAfterCourseChange(wasteType);
        toast('保存しました');
      } catch (e) { toast('保存に失敗しました'); console.error(e); }
    };
    if (course) {
      document.getElementById('clearCourseBtn').onclick = () => {
        box.innerHTML = `<div class="confirmbox"><p>⚠️ このコースに登録されている得意先を全員、このコースから外します（コース自体・得意先自体・他品目や他コースの登録は残ります）。CSVで新しい回り方を登録し直す前などにお使いください。よろしいですか？</p>
          <div class="confirm-actions"><button class="btn ghost" id="cancelClear">やめる</button><button class="btn danger" id="confirmClear">クリアする</button></div></div>`;
        document.getElementById('cancelClear').onclick = renderCourseActions;
        document.getElementById('confirmClear').onclick = async () => {
          try {
            const n = await clearCourseAssignments(course.id, wasteType);
            closeModal(); await refreshAfterCourseChange();
            toast(`${n}件の登録をクリアしました`);
          } catch (e) { toast('クリアに失敗しました'); console.error(e); }
        };
      };
      document.getElementById('delCourseBtn').onclick = () => {
        box.innerHTML = `<div class="confirmbox"><p>⚠️ このコースを削除します。ここに登録されている得意先の「${WT[wasteType].label}」の割り当ても解除されます（得意先自体や他品目・他コースの情報は残ります）。よろしいですか？</p>
          <div class="confirm-actions"><button class="btn ghost" id="cancelDel">やめる</button><button class="btn danger" id="confirmDel">完全に削除</button></div></div>`;
        document.getElementById('cancelDel').onclick = renderCourseActions;
        document.getElementById('confirmDel').onclick = async () => {
          try {
            await clearCourseAssignments(course.id, wasteType);
            await deleteCourseDoc(course.id);
            if (activeCourseId === course.id) activeCourseId = null;
            closeModal(); await refreshAfterCourseChange();
            toast('削除しました');
          } catch (e) { toast('削除に失敗しました'); console.error(e); }
        };
      };
    }
  }
}

/* ==== pick existing customer to add to a course ==== */
function openPickExisting(course) {

    <div class="modal-head"><h2>既存の得意先を追加</h2><button class="closebtn" onclick="closeModal()">✕</button></div>

      <input class="search" id="pickSearch" placeholder="得意先名・住所・管理番号で検索">
      <div id="pickList"></div>
    </div>
  `);
  async function render() {
    const q = (document.getElementById('pickSearch').value || '').trim().toLowerCase();
    const box = document.getElementById('pickList');
    if (!q) { box.innerHTML = `<div class="empty">検索してください。</div>`; return; }
    if (!allCustomersLoaded) {
      box.innerHTML = `<div class="empty"><span class="spin"></span> 読み込み中…</div>`;
      try { await ensureAllCustomersLoaded(); } catch (e) { box.innerHTML = `<div class="empty">読み込みに失敗しました。</div>`; return; }

/* ==== customer modal ==== */
async function openCustomerModal(cu, presetType, presetCourseId) {
  let photoIds = cu ? customerPhotoIds(cu) : [];
  let removedIds = [];
  let newBlobs = []; // {blob, url}
  const items = {};
  for (const w of WASTE_TYPES) {
    if (cu?.items && cu.items[w.key]) {
      items[w.key] = getAssignments(cu, w.key).map(a => ({
        ...a,
        hasKey: a.hasKey !== undefined ? a.hasKey : (cu.hasKey ?? false),
        keyNumber: a.keyNumber !== undefined ? a.keyNumber : (cu.keyNumber ?? ''),
        memo: a.memo !== undefined ? a.memo : (cu.memo ?? ''),
      }));
    }
  }
  if (presetType) {
    if (!items[presetType]) items[presetType] = [];
    if (!items[presetType].some(a => a.courseId === presetCourseId)) {
      const c = courses.find(x => x.id === presetCourseId);
      items[presetType].push({ courseId: presetCourseId, order: 9999, days: c?.typicalDays ? [...c.typicalDays] : [], hasKey: false, keyNumber: '', memo: '' });
    }
  }

  openModal(`
    <div class="modal-head"><h2>${cu ? '得意先を編集' : '得意先を追加'}</h2><button class="closebtn" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="field"><span class="lb">得意先名</span><input type="text" id="uName" value="${cu ? esc(cu.name) : ''}" placeholder="例：〇〇マンション"></div>
      <div class="field"><span class="lb">管理番号（エクセルの管理番号と合わせると、他品目のコースと自動で紐づきます）</span><input type="text" id="uMgmtNo" value="${cu ? esc(cu.mgmtNo||'') : ''}" placeholder="例：10234"></div>
      <div class="field"><span class="lb">住所</span>
        <input type="text" id="uAddress" value="${cu ? esc(cu.address||'') : ''}" placeholder="住所を入力（Googleマップで検索されます）">
        <div id="uMapLink"></div>
      </div>
      <div class="field"><span class="lb">品目・コースの割り当て（鍵・メモは品目ごとに設定します）</span><div id="typeBoxes"></div></div>
      <div class="field"><span class="lb">ゴミ庫・回収場所の写真（複数枚可）</span><div id="uPhotoBox"></div><input type="file" accept="image/*" multiple id="uPhotoFile" style="display:none"></div>
      <div id="uActions"></div>
    </div>
  `);

  function updateMapLink() {
    const addr = document.getElementById('uAddress').value.trim();
    document.getElementById('uMapLink').innerHTML = addr ? `<a class="maplink-inline" href="${mapsUrl(addr)}" target="_blank">📍 Googleマップで確認</a>` : '';
  }
  document.getElementById('uAddress').addEventListener('input', updateMapLink); updateMapLink();

  function renderTypeBoxes() {
    const box = document.getElementById('typeBoxes');
    box.innerHTML = WASTE_TYPES.map(w => {
      const arr = items[w.key] || [];
      const on = arr.length > 0;
      const coursesOfType = courses.filter(c => c.wasteType === w.key);
      const usedCourseIds = arr.map(a => a.courseId);
      const canAddMore = coursesOfType.some(c => !usedCourseIds.includes(c.id));
      const assignBlocks = arr.map((cur, ai) => `
        <div class="assignblock" data-ablock="${w.key}:${ai}" style="border-top:1px solid var(--border);padding-top:10px;margin-top:10px">
          <div class="field" style="margin-bottom:8px;display:flex;gap:6px;align-items:flex-end">
            <div style="flex:1">
              <select data-course="${w.key}" data-ai="${ai}">
                ${coursesOfType.map(c => `<option value="${c.id}" ${cur.courseId===c.id?'selected':''}>${esc(courseLabel(c))}</option>`).join('')}
              </select>
            </div>
            ${arr.length > 1 ? `<button class="btn danger sm" data-removeassign="${w.key}:${ai}" type="button">✕</button>` : ''}
          </div>
          <div class="daysrow" data-days="${w.key}:${ai}" style="margin-bottom:10px">${WEEKDAYS.map(d => `<button data-d="${d}" class="${cur.days && cur.days.includes(d)?'active':''}">${d}</button>`).join('')}</div>
          <div class="keyrow" data-keyrow="${w.key}:${ai}" style="margin-bottom:8px">
            <button data-v="1" class="${cur.hasKey?'active yes':''}">🔑 鍵あり</button>
            <button data-v="0" class="${!cur.hasKey?'active no':''}">鍵なし／不要</button>
          </div>
          <div class="field" data-keynumfield="${w.key}:${ai}" style="display:${cur.hasKey?'':'none'};margin-bottom:8px">
            <input type="text" data-keynum="${w.key}:${ai}" value="${esc(cur.keyNumber||'')}" placeholder="鍵の番号（例：No.12 / 事務所保管）">
          </div>
          <textarea data-memo="${w.key}:${ai}" rows="2" placeholder="この割り当てのメモ（回収漏れ注意点など）">${esc(cur.memo||'')}</textarea>
        </div>
      `).join('');
      return `<div class="typebox">
        <div class="th"><strong>${w.icon} ${w.label}</strong><button class="togglechip ${on?'on':''}" data-toggle="${w.key}">${on?'登録中':'未登録'}</button></div>
        ${assignBlocks}
        ${on && canAddMore ? `<button class="btn ghost sm" data-addassign="${w.key}" type="button" style="margin-top:10px">＋ 別のコースにも登録（例：毎日回収・水土だけ回収 等）</button>` : ''}
      </div>`;
    }).join('');
    box.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => {
      const k = b.dataset.toggle;
      if (items[k] && items[k].length) { delete items[k]; }
      else {
        const first = courses.find(c => c.wasteType === k);
        items[k] = [{ courseId: first ? first.id : '', order: 9999, days: first?.typicalDays ? [...first.typicalDays] : [], hasKey: false, keyNumber: '', memo: '' }];
      }
      renderTypeBoxes();
    });
    box.querySelectorAll('[data-addassign]').forEach(b => b.onclick = () => {
      const k = b.dataset.addassign;
      const used = items[k].map(a => a.courseId);
      const next = courses.find(c => c.wasteType === k && !used.includes(c.id));
      if (!next) return;
      items[k].push({ courseId: next.id, order: 9999, days: next.typicalDays ? [...next.typicalDays] : [], hasKey: false, keyNumber: '', memo: '' });
      renderTypeBoxes();
    });
    box.querySelectorAll('[data-removeassign]').forEach(b => b.onclick = () => {
      const [k, ai] = b.dataset.removeassign.split(':');
      items[k].splice(parseInt(ai, 10), 1);
      if (!items[k].length) delete items[k];
      renderTypeBoxes();
    });
    box.querySelectorAll('[data-course]').forEach(sel => sel.onchange = () => {
      const k = sel.dataset.course, ai = parseInt(sel.dataset.ai, 10);
      items[k][ai].courseId = sel.value;
      const c = courses.find(c => c.id === sel.value);
      if (c?.typicalDays) items[k][ai].days = [...c.typicalDays];
      renderTypeBoxes();
    });
    box.querySelectorAll('[data-days]').forEach(row => {
      const [k, ai] = row.dataset.days.split(':');
      row.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
        const d = b.dataset.d;
        const a = items[k][ai];
        if (!a.days) a.days = [];
        if (a.days.includes(d)) a.days = a.days.filter(x => x !== d); else a.days.push(d);
        items[k][ai].days = a.days;
        b.classList.toggle('active');
      });
    });
    box.querySelectorAll('[data-keyrow]').forEach(row => {
      const [k, ai] = row.dataset.keyrow.split(':');
      row.querySelectorAll('button').forEach(b => b.onclick = () => {
        items[k][ai].hasKey = b.dataset.v === '1';
        row.querySelectorAll('button').forEach(x => x.className = '');
        b.className = items[k][ai].hasKey ? 'active yes' : 'active no';
        box.querySelector(`[data-keynumfield="${k}:${ai}"]`).style.display = items[k][ai].hasKey ? '' : 'none';
      });
    });
    box.querySelectorAll('[data-keynum]').forEach(inp => inp.addEventListener('input', () => {
      const [k, ai] = inp.dataset.keynum.split(':'); items[k][ai].keyNumber = inp.value.trim();
    }));
    box.querySelectorAll('[data-memo]').forEach(ta => ta.addEventListener('input', () => {
      const [k, ai] = ta.dataset.memo.split(':'); items[k][ai].memo = ta.value.trim();
    }));
  }
  renderTypeBoxes();

  function renderPhotoBox() {
    const pbox = document.getElementById('uPhotoBox');
    const remaining = photoIds.filter(id => !removedIds.includes(id));
    const existingTiles = remaining.map(id => `
      <div class="phototile"><img src="${photoUrlFor(cu.id, id)}"><button class="rm" data-rm-existing="${id}">✕</button></div>
    `).join('');
    const newTiles = newBlobs.map((nb, i) => `
      <div class="phototile"><img src="${nb.url}"><button class="rm" data-rm-new="${i}">✕</button></div>
    `).join('');
    pbox.innerHTML = `<div class="photogrid">${existingTiles}${newTiles}<button class="phototile addtile" id="uPhotoAddTile" type="button">📷</button></div>`;
    pbox.querySelectorAll('[data-rm-existing]').forEach(b => b.onclick = () => { removedIds.push(b.dataset.rmExisting); renderPhotoBox(); });
    pbox.querySelectorAll('[data-rm-new]').forEach(b => b.onclick = () => { newBlobs.splice(parseInt(b.dataset.rmNew, 10), 1); renderPhotoBox(); });
    document.getElementById('uPhotoAddTile').onclick = () => document.getElementById('uPhotoFile').click();
  }
  renderPhotoBox();
  document.getElementById('uPhotoFile').addEventListener('change', async e => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    for (const f of files) {
      try { const blob = await compressImage(f); newBlobs.push({ blob, url: URL.createObjectURL(blob) }); }
      catch { toast('画像の処理に失敗しました'); }
    }
    e.target.value = '';
    renderPhotoBox();
  });

  const box = document.getElementById('uActions');
  box.innerHTML = `<div class="modal-actions">
    ${cu ? `<button class="btn danger" id="delCustBtn">削除</button>` : '<span></span>'}
    <div class="right"><button class="btn ghost" onclick="closeModal()">キャンセル</button><button class="btn primary" id="saveCustBtn">保存</button></div>
  </div>`;
  document.getElementById('saveCustBtn').onclick = async () => {
    const name = document.getElementById('uName').value.trim();
    if (!name) { toast('得意先名を入力してください'); return; }
    for (const k of Object.keys(items)) for (const a of items[k]) if (!a.courseId) { toast(`${WT[k].label}のコースを選択してください`); return; }
    const btn = document.getElementById('saveCustBtn'); btn.disabled = true; btn.textContent = '保存中…';
    try {
      const id = cu ? cu.id : uid();
      for (const k of Object.keys(items)) {
        for (const a of items[k]) {
          if (a.order === 9999) {
            const existing = customers.filter(c => c.id !== id && findAssignment(c, k, a.courseId));
            a.order = existing.length;
          }
        }
      }
      let finalIds = photoIds.filter(pid => !removedIds.includes(pid));
      for (const rid of removedIds) await deletePhotoAt(id, rid);
      for (const nb of newBlobs) { const pid = uid(); await uploadPhotoAt(id, pid, nb.blob); finalIds.push(pid); }
      const hasPhoto = finalIds.length > 0;
      await saveCustomerDoc({
        id, name, mgmtNo: document.getElementById('uMgmtNo').value.trim(), address: document.getElementById('uAddress').value.trim(),
        items, hasPhoto, photos: finalIds,
      });
      closeModal(); renderContent(); toast('保存しました');
    } catch (e) { toast('保存に失敗しました'); console.error(e); btn.disabled = false; btn.textContent = '保存'; }
  };
  if (cu) {
    document.getElementById('delCustBtn').onclick = () => {
      box.innerHTML = `<div class="confirmbox"><p>⚠️ この得意先をすべての品目から完全に削除します。よろしいですか？</p>
        <div class="confirm-actions"><button class="btn ghost" id="cancelDelC">やめる</button><button class="btn danger" id="confirmDelC">完全に削除</button></div></div>`;
      document.getElementById('cancelDelC').onclick = () => { closeModal(); openCustomerModal(cu, presetType, presetCourseId); };
      document.getElementById('confirmDelC').onclick = async () => {
        try {
          await deleteCustomerDoc(cu.id);
          for (const pid of customerPhotoIds(cu)) await deletePhotoAt(cu.id, pid);
          closeModal(); renderContent(); toast('削除しました');
        } catch (e) { toast('削除に失敗しました'); console.error(e); }
      };
    };
  }
}

/* ==== CSV import ==== */
function parseCSV(text) {
  const rows = []; let row = [], field = '', inQ = false;
  const s = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for (let i=0;i<s.length;i++){const c=s[i];
    if(inQ){ if(c==='"'){ if(s[i+1]==='"'){field+='"';i++;} else inQ=false;} else field+=c; }
    else { if(c==='"')inQ=true; else if(c===','){row.push(field);field='';} else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';} else field+=c; }
  }
  if (field.length||row.length){row.push(field);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}

document.getElementById('csvBtn').onclick = () => {

  let targetCourseId = activeCourseId && mode !== 'search' ? activeCourseId : '';
  openModal(`

    <div class="modal-body">
      <div class="hint"><b>「管理番号」列を含めることを強くおすすめします。</b>他品目のCSVと管理番号が一致する行は、名前や住所の表記が多少違っても自動で同じ得意先として紐付けられます（管理番号がない場合は新規の得意先として登録されます）。<br>
        1行目を見出しにして次の列を用意してください：<br><code>管理番号, 得意先名, 住所, 鍵有無, 鍵番号, 曜日, メモ</code><br>

      const idx = {

        mgmt: header.findIndex(h=>/管理番号|管理No|管理no/i.test(h)),
        address: header.findIndex(h=>/住所/.test(h)),
        key: header.findIndex(h=>/鍵.*(有無|状態)|鍵$/.test(h)),
        keyNum: header.findIndex(h=>/鍵.*(番号|no)/i.test(h)),
        days: header.findIndex(h=>/曜日/.test(h)),
        memo: header.findIndex(h=>/メモ|備考/.test(h)),
      };
      if (idx.name === -1) { prevBox.innerHTML = `<p style="color:#f2a89e;font-size:13px">「得意先名」の列が見つかりません。</p>`; importBtn.disabled=true; preview=null; return; }
      const list = [];
      for (const r of rows.slice(1)) {
        const custName = (r[idx.name]||'').trim();
        if (!custName) continue;
        const keyRaw = idx.key!==-1 ? (r[idx.key]||'').trim() : '';
        const daysRaw = idx.days!==-1 ? (r[idx.days]||'').trim() : '';
        list.push({
          name: custName, mgmtNo: idx.mgmt!==-1 ? (r[idx.mgmt]||'').trim() : '',
          address: idx.address!==-1 ? (r[idx.address]||'').trim() : '',
          hasKey: /あり|有|yes|y|○/i.test(keyRaw), keyNumber: idx.keyNum!==-1 ? (r[idx.keyNum]||'').trim() : '',
          days: WEEKDAYS.filter(d => daysRaw.includes(d)),
          memo: idx.memo!==-1 ? (r[idx.memo]||'').trim() : '',
        });
      }
      if (!list.length) { prevBox.innerHTML = `<p style="color:#f2a89e;font-size:13px">有効なデータ行がありません。</p>`; importBtn.disabled=true; preview=null; return; }
      const withMgmt = list.filter(r => r.mgmtNo).length;
      preview = list;
      prevBox.innerHTML = `<div class="preview">${list.length}件を取り込みます（うち管理番号あり: ${withMgmt}件）。</div>`;
      importBtn.disabled = false;
    } catch { prevBox.innerHTML = `<p style="color:#f2a89e;font-size:13px">CSVの読み込みに失敗しました。</p>`; importBtn.disabled=true; preview=null; }
  }
  document.getElementById('csvPick').onclick = () => document.getElementById('csvFile').click();
  document.getElementById('csvFile').addEventListener('change', e => {
    const file = e.target.files?.[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { document.getElementById('csvText').value = reader.result; analyze(reader.result); };
    reader.readAsText(file, 'utf-8');
  });
  document.getElementById('csvText').addEventListener('input', e => analyze(e.target.value));
  document.getElementById('csvImportBtn').onclick = async () => {
    const courseId = document.getElementById('csvCourse').value;
    const type = document.getElementById('csvType').value;
    if (!preview || !courseId) { toast('登録先コースを選択してください'); return; }
    const btn = document.getElementById('csvImportBtn'); btn.disabled = true; btn.textContent = '取り込み中…';
    const prog = document.getElementById('csvProgress');
    try {
      prog.textContent = '既存データを確認中…';
      await ensureAllCustomersLoaded();
      if (document.getElementById('csvOverwrite').checked) {
        prog.textContent = '既存の登録をクリア中…';
        await clearCourseAssignments(courseId, type);
      }
      const course = courses.find(c => c.id === courseId);
      let order = customers.filter(c => findAssignment(c, type, courseId)).length;
      const seenThisBatch = {}; // mgmtNo -> id、同じCSV内での重複対策
      let mergedCount = 0, newCount = 0, errorCount = 0;
      let batch = db.batch(), pending = 0, processed = 0;
      for (const r of preview) {
        try {
          const days = r.days.length ? r.days : (course?.typicalDays || []);
          let existing = null;
          if (r.mgmtNo) {
            existing = customers.find(c => c.mgmtNo && c.mgmtNo === r.mgmtNo) || null;
            if (!existing && seenThisBatch[r.mgmtNo]) existing = customers.find(c => c.id === seenThisBatch[r.mgmtNo]) || null;
          }
          const assignment = { courseId, order: order++, days, hasKey: r.hasKey, keyNumber: r.keyNumber, memo: r.memo };
          let docId, finalDoc;
          if (existing) {
            const arr = getAssignments(existing, type).filter(a => a.courseId !== courseId);
            arr.push(assignment);
            finalDoc = { ...existing, name: existing.name || r.name, address: existing.address || r.address, items: { ...existing.items, [type]: arr } };
            docId = existing.id;
            seenThisBatch[r.mgmtNo] = docId;
            const i = customers.findIndex(c => c.id === docId); if (i !== -1) customers[i] = finalDoc;
            mergedCount++;
          } else {
            docId = uid();
            finalDoc = { id: docId, name: r.name, mgmtNo: r.mgmtNo, address: r.address, hasPhoto: false, items: { [type]: [assignment] } };
            customers.push(finalDoc);
            if (r.mgmtNo) seenThisBatch[r.mgmtNo] = docId;
            newCount++;
          }
          finalDoc.courseIds = computeCourseIds(finalDoc.items);
          batch.set(db.collection('cm_customers').doc(docId), { ...finalDoc, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
          pending++;
        } catch (rowErr) { errorCount++; console.error('行の処理でエラー:', r, rowErr); }
        processed++;
        if (pending >= 400) {
          await batch.commit();
          batch = db.batch(); pending = 0;
        }
        if (processed % 20 === 0 || processed === preview.length) {
          prog.textContent = `${processed}/${preview.length}件を処理中…（新規${newCount}・紐付け${mergedCount}${errorCount ? `・エラー${errorCount}` : ''}）`;
        }
      }
      if (pending) await batch.commit();
      closeModal(); mode = type; activeCourseId = courseId; dayFilter = 'all';
      renderTopTabs(); renderCourseTabs(); renderContent();
      toast(`取り込みました（新規${newCount}件・紐付け${mergedCount}件${errorCount ? `・エラー${errorCount}件` : ''}）`);
    } catch (e) {
      console.error(e);
      prog.textContent = '';
      prog.innerHTML = `<span style="color:var(--danger-fg)">取り込み中にエラーが発生しました: ${esc(String(e.message||e))}</span>`;
      toast('取り込みに失敗しました');
      btn.disabled = false; btn.textContent = '取り込む';
    }
  };
};

/* ==== 全データ削除 ==== */
document.getElementById('wipeBtn').onclick = () => {
  const orphans = customers.filter(cu => !WASTE_TYPES.some(w => getAssignments(cu, w.key).length)).length;
  openModal(`
    <div class="modal-head"><h2>全データを消去</h2><button class="closebtn" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="confirmbox">
        <p>⚠️ 登録されている<b>コース ${courses.length}件</b>と<b>得意先 ${customers.length}件</b>（うちどのコースにも属していない得意先 ${orphans}件）、および<b>すべての写真</b>を完全に削除します。元に戻せません。</p>
        <p>CSVで最初から登録し直す場合にお使いください。</p>
      </div>
      <div class="field" style="margin-top:14px">
        <span class="lb">実行するには下に <b>DELETE</b> と入力してください</span>
        <input type="text" id="wipeConfirm" autocapitalize="characters" autocorrect="off" placeholder="DELETE">
      </div>
      <div class="modal-actions"><span></span>
        <div class="right"><button class="btn ghost" onclick="closeModal()">キャンセル</button><button class="btn danger" id="wipeGo">完全に削除する</button></div>
      </div>
      <div id="wipeProgress" style="margin-top:10px;font-size:12px;color:var(--sub)"></div>
    </div>
  `);
  document.getElementById('wipeGo').onclick = async () => {
    if (document.getElementById('wipeConfirm').value.trim().toUpperCase() !== 'DELETE') { toast('DELETE と入力してください'); return; }
    const btn = document.getElementById('wipeGo'); btn.disabled = true; btn.textContent = '削除中…';
    const prog = document.getElementById('wipeProgress');
    try {
      prog.textContent = 'データを確認中…';
      await ensureAllCustomersLoaded();
      // 写真を削除（並列で高速化）
      const allPhotoJobs = [];
      for (const cu of customers) for (const pid of customerPhotoIds(cu)) allPhotoJobs.push([cu.id, pid]);
      let pn = 0;
      for (let i = 0; i < allPhotoJobs.length; i += 30) {
        const chunk = allPhotoJobs.slice(i, i + 30);
        await Promise.all(chunk.map(([cid, pid]) => deletePhotoAt(cid, pid)));
        pn += chunk.length;
        prog.textContent = `写真 ${pn}/${allPhotoJobs.length}件を削除中…`;
      }
      prog.textContent = `写真 ${pn}件を削除しました。得意先を削除中…`;
      // 得意先をまとめて削除
      const allCust = await db.collection('cm_customers').get();
      let batch = db.batch(), n = 0, done = 0;
      for (const d of allCust.docs) {
        batch.delete(d.ref); n++; done++;
        if (n >= 400) { await batch.commit(); batch = db.batch(); n = 0; prog.textContent = `得意先 ${done}/${allCust.size}件を削除中…`; }
      }
      if (n) await batch.commit();
      prog.textContent = `得意先 ${done}件を削除しました。コースを削除中…`;
      // コースを削除
      const allCourses = await db.collection('cm_courses').get();
      let cbatch = db.batch(), cn = 0;
      for (const d of allCourses.docs) {
        cbatch.delete(d.ref); cn++;
        if (cn >= 400) { await cbatch.commit(); cbatch = db.batch(); cn = 0; }
      }
      if (cn) await cbatch.commit();
      activeCourseId = null; mode = 'search'; dayFilter = 'all';
      closeModal(); await hardReload();
      toast('すべて削除しました');
    } catch (e) { toast('削除に失敗しました'); console.error(e); btn.disabled = false; btn.textContent = '完全に削除する'; }
  };
};

/* ==== 既存データの一回限りの最適化（コース単位の読み込みに必要な情報を付与） ==== */
async function migrateIfNeeded() {
  let done = false;
  try { done = localStorage.getItem('cm_schema_v2') === '1'; } catch (e) {}
  if (done) return;
  document.getElementById('content').innerHTML = `<div class="empty"><span class="spin"></span> 初回のみ、データを最適化しています…<br><span id="migProg" style="font-size:12px"></span></div>`;
  await ensureAllCustomersLoaded();
  const targets = customers.filter(c => !Array.isArray(c.courseIds) || c.courseIds.join() !== computeCourseIds(c.items).join());
  let batch = db.batch(), n = 0, doneCount = 0;
  for (const c of targets) {
    const courseIds = computeCourseIds(c.items);
    batch.set(db.collection('cm_customers').doc(c.id), { courseIds }, { merge: true });
    c.courseIds = courseIds;
    n++; doneCount++;
    if (n >= 400) { await batch.commit(); batch = db.batch(); n = 0; const el = document.getElementById('migProg'); if (el) el.textContent = `${doneCount}/${targets.length}件`; }
  }
  if (n) await batch.commit();
  try { localStorage.setItem('cm_schema_v2', '1'); } catch (e) {}
}

document.getElementById('reloadBtn').onclick = async () => {
  const keepMode = mode, keepCourse = activeCourseId;
  loadedCourseIds = new Set(); allCustomersLoaded = false; customers = [];
  await initialLoad();
  mode = keepMode; activeCourseId = courses.some(c => c.id === keepCourse) ? keepCourse : null;
  renderTopTabs(); renderCourseTabs();
  if (mode !== 'search' && activeCourseId) { try { await ensureCourseLoaded(activeCourseId); } catch (e) { console.error(e); } }
  renderContent();
  toast('最新データを読み込みました');
};

/* ==== init ==== */
const loadTimeout = setTimeout(() => showErr('読み込みに時間がかかっています。電波の良い場所で開き直すか、しばらくしてから再度お試しください。', false), 25000);
(async () => {
  try { await migrateIfNeeded(); } catch (e) { console.error('最適化エラー', e); }
  await initialLoad();
})().finally(() => { clearTimeout(loadTimeout); hideErr(); });

</script>
