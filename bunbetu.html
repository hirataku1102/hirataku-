<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>分別ラッシュ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* 1画面ゲーム:上=落下エリア(ゴミ集積所の壁)、下=色分けされた分別ボタン。単一テーマ固定 */
:root{
  --bg:#dfe5df; --wall:#eef1ec; --ink:#1f2a26; --muted:#5e6b65; --line:#c3ccc5;
  --burn:#d9542b; --nonburn:#4a6fa5; --res:#2e8b57; --pla:#c79a12; --haz:#7b3fa0;
  --display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding-inline:16px;padding-block:10px;box-sizing:border-box;gap:10px}
.hud{display:flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums}
.hud .t{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.02em;margin-right:auto}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.stat small{font-size:10px;color:var(--muted);letter-spacing:.08em}
.stat b{font-family:var(--display);font-size:18px}
.lives{font-size:16px;letter-spacing:2px;color:var(--burn)}
.snd{border:2px solid var(--line);background:var(--wall);color:var(--ink);font-family:var(--display);font-weight:800;font-size:12px;border-radius:999px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.snd[aria-pressed="false"]{color:var(--muted)}
.snd:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.stage{position:relative;flex:1;min-height:0;background:var(--wall);border:2px solid var(--line);border-radius:14px;overflow:hidden;
  background-image:repeating-linear-gradient(0deg,transparent 0 47px,#e3e8e2 47px 48px)}
canvas{display:block;width:100%;height:100%}
.bins{display:grid;gap:8px;grid-template-columns:repeat(var(--n,3),1fr)}
.bin{border:0;border-radius:12px 12px 8px 8px;color:#fff;font-family:var(--display);font-weight:800;font-size:15px;padding:14px 4px 12px;cursor:pointer;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.18);transition:transform .08s,filter .15s;line-height:1.2;min-width:0}
.bin small{display:block;font-family:var(--body);font-weight:500;font-size:10px;opacity:.9;margin-top:3px}
.bin:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.bin:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.bin.flash-ok{filter:brightness(1.25)}
.bin.flash-ng{animation:shake .3s}
.bin.new{animation:pop .6s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:20px;background:rgba(238,241,236,.94)}
.overlay h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,9vw,44px);margin:0;letter-spacing:.02em;text-wrap:balance}
.overlay p{margin:0;color:var(--muted);font-size:13px;line-height:1.7;max-width:30ch}
.big{font-family:var(--display);font-size:42px;font-weight:800;font-variant-numeric:tabular-nums}
.go{border:0;background:var(--ink);color:#fff;font-family:var(--display);font-weight:800;font-size:17px;padding:13px 34px;border-radius:999px;cursor:pointer}
.go:focus-visible{outline:3px solid var(--res);outline-offset:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:11px}
.legend span{padding:3px 8px;border-radius:999px;color:#fff;font-weight:700}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:#fff;font-family:var(--display);font-weight:800;padding:8px 16px;border-radius:999px;font-size:14px;white-space:nowrap;pointer-events:none;transition:opacity .3s}
.note{font-size:10px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){.bin,.bin.new,.bin.flash-ng{animation:none;transition:none}}
</style>

<div class="app">
  <div class="hud">
    <div class="t">分別ラッシュ</div>
    <div class="stat"><small>LV</small><b id="lv">1</b></div>
    <div class="stat"><small>SCORE</small><b id="sc">0</b></div>
    <div class="stat"><small>LIFE</small><span class="lives" id="lf">●●●</span></div>
    <button class="snd" id="snd" aria-pressed="true">♪ 音ON</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="toast" id="toast" style="opacity:0"></div>
    <div class="overlay" id="ov">
      <h1>分別ラッシュ</h1>
      <p>落ちてくるゴミを、下のボタンで正しく分別。いちばん下のゴミ(枠つき)から順に処理されます。</p>
      <div class="legend" id="legend"></div>
      <p>レベルが上がると速く・多く・分別の種類も増えていきます。ミス3回で終了。</p>
      <div id="best" class="note"></div>
      <button class="go" id="start">スタート</button>
    </div>
  </div>
  <div class="bins" id="bins"></div>
  <div class="note">※分別ルールは自治体によって異なります。PCは数字キー1〜5でも操作できます。</div>
</div>

<script>
const CATS=[
 {id:"burn",name:"燃える",sub:"可燃ごみ",color:"#d9542b",from:1,items:[["🍌","バナナの皮"],["🧻","ティッシュ"],["🥢","割りばし"],["🦴","魚の骨"],["🍂","落ち葉"],["🧦","古い靴下"]]},
 {id:"nonburn",name:"燃えない",sub:"不燃ごみ",color:"#4a6fa5",from:1,items:[["🍽️","割れた皿"],["🪞","鏡"],["☂️","壊れた傘"],["💡","電球"],["🏺","陶器"]]},
 {id:"res",name:"資源",sub:"缶・びん・紙",color:"#2e8b57",from:1,items:[["🥫","空き缶"],["🍾","空きびん"],["📰","新聞"],["📦","段ボール"],["🧃","紙パック"]]},
 {id:"pla",name:"プラ",sub:"容器包装",color:"#c79a12",from:3,items:[["🛍️","レジ袋"],["🍱","弁当容器"],["🥤","プラカップ"],["🧴","ボトル容器"]]},
 {id:"haz",name:"有害",sub:"電池・小型家電",color:"#7b3fa0",from:5,items:[["🔋","乾電池"],["🌡️","水銀体温計"],["📱","古いスマホ"],["🪫","充電池"]]}
];
const $=id=>document.getElementById(id);

/* ===== サウンド(Web Audioで合成。外部ファイル不要) ===== */
const Snd=(()=>{
  let ac=null,master=null,bgmGain=null,on=true,timer=null,step=0,nextT=0,bpm=120;
  try{on=localStorage.getItem("bunbetsu-sound")!=="off"}catch(e){}
  const hz=m=>440*Math.pow(2,(m-69)/12);
  function init(){
    if(ac){if(ac.state==="suspended")ac.resume();return}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    ac=new AC();master=ac.createGain();master.gain.value=on?1:0;master.connect(ac.destination);
    bgmGain=ac.createGain();bgmGain.gain.value=.5;bgmGain.connect(master);
  }
  function tone(m,t,d,type="square",vol=.12,dest=master,slide=0){
    if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(hz(m),t);if(slide)o.frequency.exponentialRampToValueAtTime(hz(m+slide),t+d);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.02);
  }
  // 明るい8小節ループ(メロディ・ベース)
  const MEL=[72,0,76,79,77,76,74,0,72,74,76,72,67,0,0,0,69,0,72,76,74,72,71,0,72,74,71,67,72,0,0,0];
  const ROOT=[48,53,55,48];
  function sched(){
    const sd=60/bpm/2;
    while(nextT<ac.currentTime+.12){
      const s=step%32,m=MEL[s];
      if(m)tone(m,nextT,sd*.9,"square",.05,bgmGain);
      if(s%2===0){const r=ROOT[Math.floor(s/8)];tone(s%4===0?r:r+7,nextT,sd*1.6,"triangle",.14,bgmGain)}
      if(s%4===2)tone(96,nextT,.03,"square",.015,bgmGain); // 軽いハイハット
      nextT+=sd;step++;
    }
  }
  return{
    init,
    get on(){return on},
    toggle(){on=!on;try{localStorage.setItem("bunbetsu-sound",on?"on":"off")}catch(e){}
      if(on)init();if(master)master.gain.setTargetAtTime(on?1:0,ac.currentTime,.02);return on},
    bgmStart(){if(!ac)return;this.bgmStop();step=0;nextT=ac.currentTime+.1;timer=setInterval(sched,25)},
    bgmStop(){clearInterval(timer);timer=null},
    tempo(lv){bpm=Math.min(176,120+(lv-1)*7)},
    ok(){if(!ac)return;const t=ac.currentTime;tone(84,t,.07,"square",.09);tone(91,t+.06,.1,"square",.09)},
    ng(){if(!ac)return;const t=ac.currentTime;tone(50,t,.28,"sawtooth",.12,master,-5)},
    drop(){if(!ac)return;const t=ac.currentTime;tone(64,t,.35,"triangle",.2,master,-14)},
    combo(){if(!ac)return;const t=ac.currentTime;[84,88,91,96].forEach((m,i)=>tone(m,t+i*.05,.09,"square",.07))},
    level(){if(!ac)return;const t=ac.currentTime;[72,76,79,84,79,84].forEach((m,i)=>tone(m,t+i*.08,.14,"square",.08))},
    start(){if(!ac)return;const t=ac.currentTime;[67,72,76,79].forEach((m,i)=>tone(m,t+i*.07,.12,"square",.08))},
    over(){if(!ac)return;const t=ac.currentTime;[72,71,69,67,64,60].forEach((m,i)=>tone(m,t+i*.16,.22,"triangle",.16))}
  };
})();
function sndLabel(){const b=$("snd");b.setAttribute("aria-pressed",Snd.on);b.textContent=Snd.on?"♪ 音ON":"音OFF"}
sndLabel();
$("snd").addEventListener("click",()=>{Snd.toggle();sndLabel()});
const cv=$("cv"),ctx=cv.getContext("2d"),stage=$("stage");
let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(2,window.devicePixelRatio||1);W=stage.clientWidth;H=stage.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",resize);

let S=null,best=0;
try{best=+localStorage.getItem("bunbetsu-best")||0}catch(e){}
$("legend").innerHTML=CATS.map(c=>`<span style="background:${c.color}">${c.name}${c.from>1?` <small>Lv${c.from}〜</small>`:""}</span>`).join("");
function showBest(){$("best").textContent=best?`ベスト:${best}点`:""}
showBest();

function active(){return CATS.filter(c=>c.from<=S.lv)}
function renderBins(){
  const a=S?active():CATS.filter(c=>c.from===1);
  const box=$("bins");box.style.setProperty("--n",a.length);
  const prev=new Set([...box.children].map(b=>b.dataset.id));
  box.innerHTML="";
  a.forEach((c,i)=>{const b=document.createElement("button");b.className="bin";b.id="bin-"+c.id;b.dataset.id=c.id;
    b.style.background=c.color;b.innerHTML=`${c.name}<small>${c.sub}</small>`;
    if(prev.size&&!prev.has(c.id))b.classList.add("new");
    b.addEventListener("pointerdown",e=>{e.preventDefault();sort(c.id)});box.appendChild(b)});
}
renderBins();

function toast(t,ms=1100){const el=$("toast");el.textContent=t;el.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.opacity=0,ms)}

function start(){
  resize();
  S={lv:1,score:0,life:3,sorted:0,combo:0,items:[],spawnT:0.3,t:0,fx:[],run:true};
  $("ov").hidden=true;renderBins();hud();last=performance.now();requestAnimationFrame(loop);
  Snd.init();Snd.tempo(1);Snd.start();Snd.bgmStart();
}
function params(){const lv=S.lv;return{speed:(0.075+lv*0.017)*H,gap:Math.max(.45,1.9-lv*.15),sway:lv>=4?Math.min(40,(lv-3)*9):0}}
function spawn(){
  const a=active();
  // 新しく増えた区分を少し多めに出す
  let c=a[Math.floor(Math.random()*a.length)];
  const newest=a[a.length-1];if(newest.from===S.lv&&S.lv>1&&Math.random()<.35)c=newest;
  const it=c.items[Math.floor(Math.random()*c.items.length)];
  const p=params();
  S.items.push({cat:c.id,e:it[0],name:it[1],x:40+Math.random()*(W-80),y:-30,vy:p.speed*(0.85+Math.random()*.3),ph:Math.random()*6.28,sw:p.sway,bx:0});
}
function target(){let t=null;for(const it of S.items)if(!t||it.y>t.y)t=it;return t}
function sort(id){
  if(!S||!S.run)return;
  const t=target();if(!t)return;
  const btn=$("bin-"+id);
  S.items.splice(S.items.indexOf(t),1);
  if(t.cat===id){
    S.combo++;S.sorted++;const pts=10*S.lv+Math.min(S.combo,20)*2;S.score+=pts;
    S.fx.push({x:t.x+t.bx,y:t.y,txt:"+"+pts,c:"#2e8b57",t:0});
    flash(btn,"flash-ok");
    if(S.combo>0&&S.combo%10===0){toast(`${S.combo}連続!`);Snd.combo()}else Snd.ok();
    if(S.sorted%10===0)levelUp();
  }else{
    const right=CATS.find(c=>c.id===t.cat);
    miss(`${t.name}は「${right.name}」`,t);flash(btn,"flash-ng");
  }
  hud();
}
function flash(b,cls){if(!b)return;b.classList.remove(cls);void b.offsetWidth;b.classList.add(cls);setTimeout(()=>b.classList.remove(cls),300)}
function miss(msg,t,dropped){
  dropped?Snd.drop():Snd.ng();
  S.life--;S.combo=0;toast(msg,1600);
  S.fx.push({x:t.x+t.bx,y:Math.min(t.y,H-40),txt:"×",c:"#d9542b",t:0});
  if(navigator.vibrate)try{navigator.vibrate(80)}catch(e){}
  if(S.life<=0)end();
}
function levelUp(){
  S.lv++;const added=CATS.find(c=>c.from===S.lv);
  Snd.level();Snd.tempo(S.lv);
  toast(added?`Lv${S.lv}!「${added.name}」が追加`:`Lv${S.lv}! スピードアップ`,1600);
  if(added)renderBins();
}
function end(){
  S.run=false;Snd.bgmStop();setTimeout(()=>Snd.over(),300);const nb=S.score>best;if(nb){best=S.score;try{localStorage.setItem("bunbetsu-best",best)}catch(e){}}
  const ov=$("ov");ov.hidden=false;
  ov.querySelector("h1").textContent="終了";
  ov.querySelectorAll("p")[0].innerHTML=`<span class="big">${S.score}</span><br>Lv${S.lv}・正しく分別 ${S.sorted}個${nb?"<br><b style='color:#2e8b57'>ベスト更新!</b>":""}`;
  ov.querySelectorAll("p")[1].textContent="もう一度挑戦できます。";
  $("start").textContent="もう一度";showBest();
}
function hud(){$("lv").textContent=S.lv;$("sc").textContent=S.score;$("lf").textContent="●".repeat(Math.max(0,S.life))+"○".repeat(3-Math.max(0,S.life))}

let last=0;
function loop(now){
  if(!S.run){draw();return}
  const dt=Math.min(.05,(now-last)/1000);last=now;S.t+=dt;
  S.spawnT-=dt;if(S.spawnT<=0){spawn();S.spawnT=params().gap*(0.75+Math.random()*.5)}
  for(const it of S.items.slice()){
    it.y+=it.vy*dt;it.bx=it.sw?Math.sin(S.t*2+it.ph)*it.sw:0;
    if(it.y>H-24){S.items.splice(S.items.indexOf(it),1);const r=CATS.find(c=>c.id===it.cat);miss(`落とした!${it.name}は「${r.name}」`,it,true);hud();if(!S.run)break}
  }
  for(const f of S.fx)f.t+=dt;S.fx=S.fx.filter(f=>f.t<.8);
  draw();requestAnimationFrame(loop);
}
function draw(){
  ctx.clearRect(0,0,W,H);
  // 地面ライン
  ctx.fillStyle="rgba(217,84,43,.12)";ctx.fillRect(0,H-24,W,24);
  ctx.strokeStyle="rgba(217,84,43,.5)";ctx.setLineDash([8,6]);ctx.beginPath();ctx.moveTo(0,H-24);ctx.lineTo(W,H-24);ctx.stroke();ctx.setLineDash([]);
  if(!S)return;
  const t=target();
  ctx.textAlign="center";ctx.textBaseline="middle";
  for(const it of S.items){
    const x=it.x+it.bx,y=it.y;
    if(it===t){ctx.strokeStyle="#1f2a26";ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,27,0,6.283);ctx.stroke();}
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x,y,23,0,6.283);ctx.fill();
    ctx.font="28px sans-serif";ctx.fillText(it.e,x,y+1);
    ctx.font="700 11px 'Zen Kaku Gothic New',sans-serif";ctx.fillStyle="#1f2a26";ctx.fillText(it.name,x,y+38);
  }
  for(const f of S.fx){ctx.globalAlpha=1-f.t/.8;ctx.fillStyle=f.c;ctx.font="800 20px 'M PLUS Rounded 1c',sans-serif";ctx.fillText(f.txt,f.x,f.y-f.t*50)}
  ctx.globalAlpha=1;
}
$("start").addEventListener("click",start);
addEventListener("keydown",e=>{
  if(!S||!S.run){if(e.key==="Enter"||e.key===" "){e.preventDefault();start()}return}
  const n=+e.key;if(n>=1){const a=active();if(a[n-1])sort(a[n-1].id)}
});
resize();draw();
</script>

</body></html>
