<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="分別ラッシュ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050b22">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}</style>
<title>分別ラッシュ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap">
<style>
/* 夜の街×ネオンのアーケード風。単一テーマ(ダーク固定)。上=HUDバー、中=落下エリア、下=光沢ボタン */
:root{
  --bg1:#0d2152; --bg2:#050b22; --panel:rgba(8,20,58,.78); --neon:#2ec6ff; --ink:#ffffff; --muted:#a9bde6;
  --lime:#7cf03a; --yellow:#ffe14a; --heart:#ff3b55; --splash-bg:#fefeff; --splash-ink:#14213d; --sun:#ff8a1f;
  --logo:"Dela Gothic One","M PLUS Rounded 1c",sans-serif;
  --ui:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg2);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}

/* オープニング */
#splash{position:fixed;inset:0;z-index:50;background:var(--splash-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(28px,8vh,64px);padding-inline:24px;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
#splash[hidden]{display:none}
.splash-logo{width:min(560px,86vw);height:auto;animation:logoIn .9s cubic-bezier(.2,.8,.2,1) both}
.splash-note{margin:0;font-family:var(--ui);font-weight:700;font-size:13px;letter-spacing:.2em;color:var(--splash-ink);opacity:.7;animation:logoIn .9s .3s both}
@keyframes logoIn{from{opacity:0;transform:translateY(12px) scale(.96)}}

.app{position:relative;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-inline:14px;padding-block:10px;box-sizing:border-box;
  background:
   radial-gradient(120% 70% at 50% 38%,rgba(46,198,255,.22),transparent 60%),
   radial-gradient(90% 60% at 50% 40%,var(--bg1),var(--bg2) 75%);
  overflow:hidden}
.app::before{content:"";position:absolute;inset:-20%;pointer-events:none;opacity:.35;
  background:repeating-conic-gradient(from 0deg at 50% 40%,rgba(46,198,255,0) 0 7deg,rgba(46,198,255,.18) 7deg 8deg,rgba(0,0,0,0) 8deg 15deg)}
.app>*{position:relative}

/* HUD */
.hud{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--neon);border-radius:999px;padding:6px 8px 6px 18px;
  box-shadow:0 0 14px rgba(46,198,255,.55),inset 0 0 12px rgba(46,198,255,.25);font-variant-numeric:tabular-nums}
.cell{display:flex;align-items:center;gap:8px;padding-right:10px;border-right:2px solid rgba(46,198,255,.35)}
.cell small{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.06em;line-height:1}
.cell b{font-family:var(--ui);font-weight:900;font-size:24px;line-height:1}
#lv{color:var(--lime);text-shadow:0 0 8px rgba(124,240,58,.7)}
.cell.score{flex:1;justify-content:space-between}
.cell.life{border-right:0}
.lives{display:flex;gap:2px;font-size:18px;line-height:1}
.lives .off{filter:grayscale(1) brightness(.5);opacity:.6}
.snd{margin-left:auto;display:flex;align-items:center;gap:6px;border:2px solid var(--lime);background:rgba(10,40,20,.6);color:var(--lime);
  font-family:var(--ui);font-weight:900;font-size:13px;border-radius:999px;padding:6px 12px;cursor:pointer;box-shadow:0 0 10px rgba(124,240,58,.45);white-space:nowrap}
.snd[aria-pressed="false"]{border-color:#5a6a8a;color:#8a9aba;box-shadow:none;background:rgba(20,28,50,.6)}
.snd:focus-visible,.bin:focus-visible,.go:focus-visible,.close:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

/* ステージ */
.stage{position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:12px 6px;overflow:hidden}
.deco{position:absolute;font-size:44px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));animation:bob 3s ease-in-out infinite;pointer-events:none}
@keyframes bob{50%{transform:translateY(-10px) rotate(var(--r,8deg))}}

.logo{position:relative;padding:18px 8px 6px}
.ring{position:absolute;left:50%;top:50%;width:150px;height:150px;transform:translate(-50%,-55%);opacity:.95;filter:drop-shadow(0 0 10px rgba(124,240,58,.8))}
.logo h1{position:relative;margin:0;font-family:var(--logo);font-weight:400;font-size:clamp(40px,12.5vw,62px);line-height:1;letter-spacing:-.01em;transform:skewX(-10deg) rotate(-3deg);white-space:nowrap}
.logo h1 span{-webkit-text-stroke:7px #0a2a78;paint-order:stroke fill;filter:drop-shadow(0 4px 0 #061445) drop-shadow(0 0 14px rgba(46,198,255,.7))}
.logo .a{color:#eaf8ff;background:linear-gradient(180deg,#ffffff 30%,#8fe3ff);-webkit-background-clip:text;background-clip:text}
.logo .b{color:var(--lime);background:linear-gradient(180deg,#f4ff6a 20%,#4fd61c);-webkit-background-clip:text;background-clip:text}
.bolt{position:absolute;top:50%;width:70px;height:8px;border-radius:4px;background:linear-gradient(90deg,transparent,var(--yellow),#ff9a1f)}
.bolt.l{left:-30px;transform:skewX(-30deg) rotate(-12deg)}
.bolt.r{right:-30px;transform:skewX(-30deg) rotate(-12deg) scaleX(-1)}
.tag{margin:0;font-family:var(--logo);font-weight:400;font-size:clamp(17px,5.4vw,24px);transform:rotate(-2deg);text-shadow:0 3px 0 #061445,0 0 10px rgba(0,0,0,.6)}
.tag em{font-style:normal;color:var(--yellow);background:linear-gradient(transparent 70%,rgba(124,240,58,.75) 70% 90%,transparent 90%)}
.desc{margin:0;font-size:13px;font-weight:700;line-height:1.7;color:#dce8ff;max-width:30ch;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:100%}
.chip{display:flex;align-items:center;gap:4px;padding:5px 10px 5px 7px;border-radius:12px;font-weight:900;font-size:13px;color:#fff;line-height:1.05;
  border:2px solid rgba(255,255,255,.35);box-shadow:0 0 10px var(--c),inset 0 1px 0 rgba(255,255,255,.5);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 70%,#000))}
.chip i{font-style:normal;font-size:15px}
.chip small{display:block;font-size:9px;font-weight:800;opacity:.9}
.best{font-weight:900;font-size:15px;color:#fff;text-shadow:0 0 8px rgba(255,225,74,.5)}
.best:empty{display:none}
.go{border:3px solid #d8ff9a;color:#fff;font-family:var(--logo);font-weight:400;font-size:clamp(22px,7vw,30px);padding:12px 34px 14px;border-radius:999px;cursor:pointer;letter-spacing:.02em;
  background:linear-gradient(180deg,#b6ff5a,#4fd61c 55%,#22a40c);text-shadow:0 3px 0 #13600a;
  box-shadow:0 0 0 4px rgba(18,70,12,.9),0 0 26px rgba(124,240,58,.8),inset 0 3px 0 rgba(255,255,255,.55);animation:pulse 1.6s ease-in-out infinite}
.go:active{transform:translateY(2px)}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(18,70,12,.9),0 0 40px rgba(124,240,58,1),inset 0 3px 0 rgba(255,255,255,.55)}}
.result{display:flex;flex-direction:column;align-items:center;gap:4px}
.result .over{font-family:var(--logo);font-size:34px;color:#ff6b6b;text-shadow:0 3px 0 #4a0a14,0 0 14px rgba(255,59,85,.7);transform:skewX(-8deg)}
.result .over.clear{color:var(--lime);text-shadow:0 3px 0 #13600a,0 0 16px rgba(124,240,58,.8);font-size:clamp(28px,9vw,38px);white-space:nowrap}
.result .big{font-family:var(--logo);font-size:56px;line-height:1.1;color:var(--yellow);text-shadow:0 4px 0 #6a4a00,0 0 18px rgba(255,225,74,.6);font-variant-numeric:tabular-nums}
.result .sub{font-weight:800;font-size:14px;color:#dce8ff}
.result .next{margin-top:6px;font-weight:900;font-size:15px;color:var(--ink);background:rgba(8,20,58,.8);border:2px solid var(--neon);border-radius:12px;padding:8px 14px;box-shadow:0 0 12px rgba(46,198,255,.5)}
.result .nb{font-weight:900;color:var(--lime);text-shadow:0 0 10px rgba(124,240,58,.8)}

/* 分別ボタン */
.bins{display:grid;gap:8px;grid-template-columns:repeat(var(--n,3),1fr)}
.bin{--c:#888;position:relative;min-width:0;border-radius:18px;padding:8px 2px 10px;cursor:pointer;color:#fff;font-family:var(--ui);
  border:3px solid color-mix(in srgb,var(--c) 55%,#fff);
  background:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--c) 55%,#fff),transparent 60%),linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 65%,#000));
  box-shadow:0 5px 0 color-mix(in srgb,var(--c) 45%,#000),0 0 16px color-mix(in srgb,var(--c) 70%,transparent),inset 0 2px 0 rgba(255,255,255,.5);
  transition:transform .07s,filter .15s;display:flex;flex-direction:column;align-items:center;gap:2px}
.bin .ic{font-size:clamp(26px,8vw,40px);line-height:1.1;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
.bin .nm{font-weight:900;font-size:clamp(14px,4.6vw,22px);line-height:1.1;-webkit-text-stroke:4px color-mix(in srgb,var(--c) 40%,#000);paint-order:stroke fill;white-space:nowrap}
.bin .sb{font-weight:800;font-size:clamp(8px,2.6vw,11px);opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
/* 6区分を3列×2段で常に表示。まだ使えない区分はグレー */
.bin.off{--c:#4a5570;opacity:.55;cursor:default;filter:saturate(.3)}
.bin.off:active{transform:none}
.bin .lk{position:absolute;top:-8px;right:-4px;background:#0a1430;border:1px solid #6a7896;color:#cfd8ea;font-size:10px;font-weight:900;padding:1px 6px;border-radius:999px;line-height:1.4}
.bins.n6{grid-template-columns:repeat(3,1fr);gap:7px}
.bins.n6 .bin{flex-direction:row;justify-content:center;gap:4px;border-radius:14px;padding:8px 2px 10px}
.bins.n6 .bin .ic{font-size:clamp(20px,6vw,28px)}
.bins.n6 .bin .nm{font-size:clamp(13px,4vw,18px)}
.bins.n6 .bin .sb{display:none}
.bin:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 45%,#000),0 0 16px color-mix(in srgb,var(--c) 70%,transparent),inset 0 2px 0 rgba(255,255,255,.5)}
.bin.flash-ok{filter:brightness(1.4)}
.bin.flash-ng{animation:shake .3s}
.bin.new{animation:pop .6s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.1)}}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(8,20,58,.92);border:2px solid var(--yellow);color:var(--yellow);font-weight:900;padding:8px 16px;border-radius:999px;font-size:14px;white-space:nowrap;pointer-events:none;transition:opacity .3s;box-shadow:0 0 14px rgba(255,225,74,.5);z-index:2}
.note{font-size:10px;font-weight:700;color:var(--muted);text-align:center;border-top:1px solid rgba(46,198,255,.35);padding-top:6px}
.ico-img{width:1.1em;height:1.1em;vertical-align:-.15em}

/* ポップアップ */
.modal{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(2,6,20,.72)}
.card{--c:var(--neon);width:100%;max-width:340px;box-sizing:border-box;text-align:center;padding:20px 18px 18px;border-radius:20px;
  background:linear-gradient(180deg,#12306e,#08143a);border:3px solid var(--c);box-shadow:0 0 28px color-mix(in srgb,var(--c) 70%,transparent);animation:pop .4s}
.card .eyebrow{font-weight:900;font-size:12px;letter-spacing:.12em;color:var(--yellow)}
.card h2{margin:6px 0 10px;font-family:var(--logo);font-weight:400;font-size:26px;line-height:1.2;color:#fff;text-wrap:balance;text-shadow:0 0 12px color-mix(in srgb,var(--c) 80%,transparent)}
.card .icons{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;font-size:30px;margin-bottom:10px}
.card .icons .ico-img{width:34px;height:34px}
.card p{margin:0 0 16px;font-weight:700;font-size:14px;line-height:1.75;color:#dce8ff;text-align:left}
.close{border:2px solid #fff;background:var(--c);color:#fff;font-family:var(--ui);font-weight:900;font-size:16px;padding:10px 40px;border-radius:999px;cursor:pointer;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 45%,#000)}
.close:active{transform:translateY(2px)}
@media (prefers-reduced-motion:reduce){.deco,.go,.bin.new,.bin.flash-ng,.card,.splash-logo,.splash-note{animation:none}}
</style>
</head>

/* ===== サウンド(Web Audioで合成。外部ファイル不要) ===== */
const Snd=(()=>{
  let ac=null,master=null,bgmGain=null,on=true,timer=null,step=0,nextT=0,bpm=120;
  try{on=localStorage.getItem("bunbetsu-sound")!=="off"}catch(e){}
  const hz=m=>440*Math.pow(2,(m-69)/12);
  function init(){
    if(ac){if(ac.state==="suspended")ac.resume();return}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    ac=new AC();master=ac.createGain();master.gain.value=on?1:0;master.connect(ac.destination);
    bgmGain=ac.createGain();bgmGain.gain.value=.5;bgmGain.connect(master);
  }
  function tone(m,t,d,type="square",vol=.12,dest=master,slide=0){
    if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(hz(m),t);if(slide)o.frequency.exponentialRampToValueAtTime(hz(m+slide),t+d);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.02);
  }
  const MEL=[72,0,76,79,77,76,74,0,72,74,76,72,67,0,0,0,69,0,72,76,74,72,71,0,72,74,71,67,72,0,0,0];
  const ROOT=[48,53,55,48];
  function sched(){
    const sd=60/bpm/2;
    while(nextT<ac.currentTime+.12){
      const s=step%32,m=MEL[s];
      if(m)tone(m,nextT,sd*.9,"square",.05,bgmGain);
      if(s%2===0){const r=ROOT[Math.floor(s/8)];tone(s%4===0?r:r+7,nextT,sd*1.6,"triangle",.14,bgmGain)}
      if(s%4===2)tone(96,nextT,.03,"square",.015,bgmGain);
      nextT+=sd;step++;
    }
  }
  return{
    init,
    get on(){return on},
    toggle(){on=!on;try{localStorage.setItem("bunbetsu-sound",on?"on":"off")}catch(e){}
      if(on)init();if(master)master.gain.setTargetAtTime(on?1:0,ac.currentTime,.02);return on},
    bgmStart(){if(!ac)return;this.bgmStop();step=0;nextT=ac.currentTime+.1;timer=setInterval(sched,25)},
    bgmStop(){clearInterval(timer);timer=null},
    tempo(lv){bpm=Math.min(176,120+(lv-1)*7)},
    ok(){if(!ac)return;const t=ac.currentTime;tone(84,t,.07,"square",.09);tone(91,t+.06,.1,"square",.09)},
    ng(){if(!ac)return;const t=ac.currentTime;tone(50,t,.28,"sawtooth",.12,master,-5)},
    drop(){if(!ac)return;const t=ac.currentTime;tone(64,t,.35,"triangle",.2,master,-14)},
    combo(){if(!ac)return;const t=ac.currentTime;[84,88,91,96].forEach((m,i)=>tone(m,t+i*.05,.09,"square",.07))},
    level(){if(!ac)return;const t=ac.currentTime;[72,76,79,84,79,84].forEach((m,i)=>tone(m,t+i*.08,.14,"square",.08))},
    start(){if(!ac)return;const t=ac.currentTime;[67,72,76,79].forEach((m,i)=>tone(m,t+i*.07,.12,"square",.08))},
    pop(){if(!ac)return;const t=ac.currentTime;tone(79,t,.08,"square",.07);tone(86,t+.07,.12,"square",.07)},
    over(){if(!ac)return;const t=ac.currentTime;[72,71,69,67,64,60].forEach((m,i)=>tone(m,t+i*.16,.22,"triangle",.16))}
  };
})();

const cv=$("cv"),ctx=cv.getContext("2d"),stage=$("stage");
let W=0,H=0,dpr=1,city=[];
function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);W=stage.clientWidth;H=stage.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  city=[];let x=0;while(x<W){const w=24+Math.random()*40,h=40+Math.random()*110;city.push({x,w,h,win:Math.random()});x+=w+2}

function active(){return CATS.filter(c=>c.from<=(S?S.lv:1))}
function renderBins(){
  const lv=S?S.lv:1,box=$("bins");
  const prevOff=new Set([...box.querySelectorAll(".bin.off")].map(b=>b.dataset.id));
  box.innerHTML="";
  CATS.forEach(c=>{const on=c.from<=lv;const b=document.createElement("button");
    b.className="bin"+(on?"":" off");b.id="bin-"+c.id;b.dataset.id=c.id;
    if(on)b.style.setProperty("--c",c.color);else{b.disabled=true;b.setAttribute("aria-label",`${c.name}(Lv${c.from}から使えます)`)}
    b.innerHTML=`<span class="ic">${on?c.icon:"🔒"}</span><span class="nm">${c.name}</span>${on?"":`<span class="lk">Lv${c.from}〜</span>`}`;
    if(on&&prevOff.has(c.id))b.classList.add("new");
    b.addEventListener("pointerdown",e=>{e.preventDefault();if(on)sort(c.id)});box.appendChild(b)});
}
renderBins();

function toast(t,ms=1100){const el=$("toast");el.textContent=t;el.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.opacity=0,ms)}

function start(){
  resize();
  S={lv:1,score:0,life:3,sorted:0,combo:0,items:[],spawnT:0.3,t:0,fx:[],state:"intro"};
  $("ov").hidden=true;renderBins();hud();draw();
  Snd.init();Snd.pop();
  introduce(CATS.filter(c=>c.from===1),beginPlay);
}
/* 区分の説明ポップアップを順番に出す */
function introduce(list,done,i=0){
  if(i>=list.length)return done();
  const c=list[i];
  showModal({eyebrow:S.lv===1?`分別のきほん ${i+1}/${list.length}`:`Lv${S.lv} 新しい分別が追加!`,title:c.title,color:c.color,
    icons:[...new Set(c.items.map(x=>x[0]))].slice(0,10),body:c.desc,onClose:()=>introduce(list,done,i+1)});
}
function params(){
  const lv=S.lv,boost=BOOSTS[Math.min(BOOSTS.length-1,Math.floor((S.sorted%PER_LEVEL)/BOOST_EVERY))];
  return{speed:(0.075+lv*0.017)*H*boost,gap:Math.max(.45,1.9-lv*.15)/boost,sway:lv>=4?Math.min(40,(lv-3)*9):0}}
function spawn(){
  const a=active();
  let c=a[Math.floor(Math.random()*a.length)];
  const newest=a[a.length-1];if(newest.from===S.lv&&S.lv>1&&Math.random()<.3)c=newest;
  const it=c.items[Math.floor(Math.random()*c.items.length)];
  const p=params();
  ctx.font="800 12px 'M PLUS Rounded 1c',sans-serif";
  const m=Math.max(40,ctx.measureText(it[1]).width/2+8)+p.sway;
  const img=it[0].startsWith("svg:")?IMG[it[0].slice(4)]:null;
  S.items.push({cat:c.id,e:it[0],img,name:it[1],x:m+Math.random()*Math.max(0,W-2*m),y:-30,vy:p.speed*(0.85+Math.random()*.3),ph:Math.random()*6.28,sw:p.sway,bx:0});
}
function target(){let t=null;for(const it of S.items)if(!t||it.y>t.y)t=it;return t}
function sort(id){
  if(!S||S.state!=="play")return;
  const t=target();if(!t)return;
  const btn=$("bin-"+id);
  S.items.splice(S.items.indexOf(t),1);
  if(t.cat===id){
    S.combo++;S.sorted++;const pts=10*S.lv+Math.min(S.combo,20)*2;S.score+=pts;
    S.fx.push({x:t.x+t.bx,y:t.y,txt:"+"+pts,c:"#7cf03a",t:0});
    flash(btn,"flash-ok");
    if(S.combo>0&&S.combo%10===0){toast(`${S.combo}連続!`);Snd.combo()}else Snd.ok();
    if(S.sorted%PER_LEVEL===0)levelClear();
    else if(S.sorted%BOOST_EVERY===0)toast("スピードアップ!",1200);
  }else{
    flash(btn,"flash-ng");miss(t,false);
  }
  hud();
}
function flash(b,cls){if(!b)return;b.classList.remove(cls);void b.offsetWidth;b.classList.add(cls);setTimeout(()=>b.classList.remove(cls),300)}
/* 間違えたら一時停止して正しい分別を説明 → 閉じたら再開 */
function miss(t,dropped){
  dropped?Snd.drop():Snd.ng();
  S.life--;S.combo=0;hud();
  S.fx.push({x:t.x+t.bx,y:Math.min(t.y,H-40),txt:"×",c:"#ff3b55",t:0});
  if(navigator.vibrate)try{navigator.vibrate(80)}catch(e){}
  if(dropped)S.items=[]; // 落としたら画面上のゴミを一旦全部消す
  S.state="pause";Snd.bgmStop();draw();
  const c=CATS.find(x=>x.id===t.cat);
  showModal({eyebrow:dropped?"落としちゃった!":"ざんねん!",title:`${t.name}は「${c.full}」です`,color:c.color,icons:[t.e],body:c.desc,
    onClose:()=>{if(S.life<=0)end();else resume()}});
}
function resume(){S.state="play";if(!S.items.length)S.spawnT=.5;Snd.init();Snd.bgmStart();last=performance.now();requestAnimationFrame(loop)}
function levelClear(){
  S.state="clear";S.items=[];Snd.bgmStop();Snd.level();
  const nx=S.lv+1,added=CATS.find(c=>c.from===nx);
  $("intro").style.display="none";$("best").style.display="none";
  const r=$("result");r.hidden=false;
  r.innerHTML=`<div class="over clear">LEVEL ${S.lv} CLEAR!</div><div class="sub">おめでとう!ここで一休み</div><div class="big">${S.score}</div>`+
    `<div class="next">${added?`次のレベルから「${added.name}」が追加!`:"次はもっと速くなるよ!"}</div>`;
  $("start").textContent=`▶ Lv${nx} スタート`;$("ov").hidden=false;draw();
}
function prepareNext(){
  S.lv++;const added=CATS.filter(c=>c.from===S.lv);
  $("ov").hidden=true;$("best").style.display="";hud();renderBins();draw();
  if(added.length){Snd.init();Snd.pop();introduce(added,beginPlay)}else beginPlay();
}
function beginPlay(){
  S.state="play";S.spawnT=.6;
  Snd.init();Snd.tempo(S.lv);Snd.start();Snd.bgmStart();
  toast(`Lv${S.lv} スタート!`,1200);
  last=performance.now();requestAnimationFrame(loop);
}
function end(){
  S.state="over";Snd.bgmStop();setTimeout(()=>Snd.over(),300);
  const nb=S.score>best;if(nb){best=S.score;try{localStorage.setItem("bunbetsu-best",best)}catch(e){}}
  $("intro").style.display="none";$("best").style.display="";
  const r=$("result");r.hidden=false;
  r.innerHTML=`<div class="over">GAME OVER</div><div class="big">${S.score}</div><div class="sub">Lv${S.lv}・正しく分別 ${S.sorted}個</div>${nb?'<div class="nb">ベスト更新!</div>':""}`;
  $("start").textContent="▶ もう一度";showBest();$("ov").hidden=false;
  setTimeout(()=>{if(S.state==="over")showModal({eyebrow:"お知らせ",title:"遊んでくれてありがとう!",
    body:"これはあくまでもゲームです。実際の分別ルールは地域や出し方によって異なります。詳しい分別については、お問い合わせください。"})},1300);
}
function hud(){
  $("lv").textContent=S?S.lv:1;$("sc").textContent=S?S.score:0;
  const l=S?Math.max(0,S.life):3;let h="";for(let i=0;i<3;i++)h+=`<span class="${i<l?"":"off"}">❤️</span>`;$("lf").innerHTML=h;
}
hud();

let last=0;
function loop(now){
  if(S.state!=="play"){draw();return}
  const dt=Math.min(.05,(now-last)/1000);last=now;S.t+=dt;
  S.spawnT-=dt;if(S.spawnT<=0){spawn();S.spawnT=params().gap*(0.75+Math.random()*.5)}
  for(const it of S.items.slice()){
    it.y+=it.vy*dt;it.bx=it.sw?Math.sin(S.t*2+it.ph)*it.sw:0;
    if(it.y>H-24){S.items.splice(S.items.indexOf(it),1);miss(it,true);break}
  }
  for(const f of S.fx)f.t+=dt;S.fx=S.fx.filter(f=>f.t<.8);
  draw();requestAnimationFrame(loop);
}
function draw(){
  ctx.clearRect(0,0,W,H);
  for(const b of city){
    ctx.fillStyle="rgba(10,26,70,.85)";ctx.fillRect(b.x,H-24-b.h,b.w,b.h);
    if(b.win>.4){ctx.fillStyle="rgba(46,198,255,.18)";for(let y=H-24-b.h+8;y<H-34;y+=14)for(let x=b.x+5;x<b.x+b.w-6;x+=10)ctx.fillRect(x,y,4,6)}
  }
  ctx.fillStyle="rgba(255,59,85,.12)";ctx.fillRect(0,H-24,W,24);
  ctx.save();ctx.shadowColor="#ff3b55";ctx.shadowBlur=10;ctx.strokeStyle="#ff3b55";ctx.lineWidth=2;ctx.setLineDash([10,6]);
  ctx.beginPath();ctx.moveTo(0,H-24);ctx.lineTo(W,H-24);ctx.stroke();ctx.restore();
  if(!S)return;
  const t=target();
  ctx.textAlign="center";ctx.textBaseline="middle";
  for(const it of S.items){
    const x=it.x+it.bx,y=it.y;
    ctx.save();
    if(it===t){ctx.shadowColor="#ffe14a";ctx.shadowBlur=16;ctx.strokeStyle="#ffe14a";ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,28*IS,0,6.283);ctx.stroke()}
    ctx.shadowColor="rgba(46,198,255,.6)";ctx.shadowBlur=12;
    const g=ctx.createRadialGradient(x-8*IS,y-10*IS,4,x,y,24*IS);g.addColorStop(0,"#ffffff");g.addColorStop(1,"#cfe6ff");
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,23*IS,0,6.283);ctx.fill();ctx.restore();
    if(it.img){if(it.img.complete)ctx.drawImage(it.img,x-17*IS,y-17*IS,34*IS,34*IS)}
    else{ctx.font=Math.round(28*IS)+"px sans-serif";ctx.fillText(it.e,x,y+1)}
    ctx.font="800 12px 'M PLUS Rounded 1c',sans-serif";ctx.lineWidth=4;ctx.strokeStyle="#050b22";ctx.strokeText(it.name,x,y+38*IS);ctx.fillStyle="#fff";ctx.fillText(it.name,x,y+38*IS);
  }
  for(const f of S.fx){ctx.globalAlpha=1-f.t/.8;ctx.fillStyle=f.c;ctx.font="900 22px 'M PLUS Rounded 1c',sans-serif";ctx.lineWidth=4;ctx.strokeStyle="#050b22";ctx.strokeText(f.txt,f.x,f.y-f.t*50);ctx.fillText(f.txt,f.x,f.y-f.t*50)}
  ctx.globalAlpha=1;
}
function go(){if(!$("modal").hidden)return;if(S&&S.state==="clear")prepareNext();else start()}
$("start").addEventListener("click",go);
addEventListener("keydown",e=>{
  if(!$("modal").hidden){if(e.key==="Enter"||e.key==="Escape"||e.key===" "){e.preventDefault();hideModal()}return}
  if(!S||S.state!=="play"){if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}return}
  const c=CATS[+e.key-1];if(c&&c.from<=S.lv)sort(c.id);
});
resize();draw();
</script>
