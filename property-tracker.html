function uploadPhotos(itemId, photos) {
  var tasks = (photos || []).map(function(p) {
    if (typeof p === "string" && p.indexOf("data:") === 0) {
      var path = "properties/" + itemId + "/" + uid() + ".jpg";
      var sref = storageRef(storage, path);
      return uploadString(sref, p, "data_url").then(function() {
        return getDownloadURL(sref);
      });
    }
    return Promise.resolve(p);
  });
  return Promise.all(tasks);
}
