function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function sleep(ms) { return new Promise(function(resolve){ setTimeout(resolve, ms); }); }
function withCityPrefix(s) { return /堺市|大阪/.test(s) ? s : ("堺市 " + s); }
function geocodeCandidates(address) {
  // Nominatim's Japan coverage often stops at town/chome level, so build a
  // ladder of queries from most specific (full address) to least specific
  // (drop the building name, then drop trailing banchi/chome numbers).
  var base = toHalfWidth((address || "").trim()).split(/\s+/)[0] || "";
  if (!base) return [];
  var levels = [withCityPrefix(base)];
  var cur = base;
  for (var i = 0; i < 4; i++) {
    var next = cur.replace(/[0-9０-９]+[-－][0-9０-９]+$/, "").replace(/[0-9０-９]+$/, "").replace(/[丁目]+$/, "").trim();
    if (!next || next === cur) break;
    cur = next;
    var q = withCityPrefix(cur);
    if (levels.indexOf(q) === -1) levels.push(q);
  }
  return levels;
}
async function geocodeAddress(address) {
  var levels = geocodeCandidates(address);
  var lastError = "住所が見つかりません";
  for (var i = 0; i < levels.length; i++) {
    if (i > 0) await sleep(1100);
    try {
      var res = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&q=" + encodeURIComponent(levels[i]));
      if (!res.ok) { lastError = "通信エラー(HTTP " + res.status + ")"; continue; }
      var data = await res.json();
      if (data && data[0]) return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), approx: i > 0 };
    } catch (err) {
      lastError = "通信ブロック(" + ((err && err.message) || "fetch failed") + ")";
    }
  }
  return { error: lastError };
}
function emptyForm() {
  return { name: "", address: "", priority: "普通", status: "更地", statusOther: "", type: "不明", memo: "", photos: [] };
}
function resizeImage(file) {
  return new Promise(function(resolve, reject) {
    var reader = new FileReader();
    reader.onload = function(ev) {
      var img = new Image();
      img.onload = function() {
        var maxDim = 1024;
        var width = img.width, height = img.height;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        var canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

}

function PropertyTracker() {
  var lockedState = useState(true); var locked = lockedState[0], setLocked = lockedState[1];
  var pwState = useState(""); var pwInput = pwState[0], setPwInput = pwState[1];
  var pwErrState = useState(false); var pwError = pwErrState[0], setPwError = pwErrState[1];
  var itemsState = useState([]); var items = itemsState[0], setItems = itemsState[1];
  var queryState = useState(""); var query = queryState[0], setQuery = queryState[1];
  var priFilterState = useState(new Set()); var priorityFilter = priFilterState[0], setPriorityFilter = priFilterState[1];
  var statFilterState = useState(new Set()); var statusFilter = statFilterState[0], setStatusFilter = statFilterState[1];
  var showFiltersState = useState(false); var showFilters = showFiltersState[0], setShowFilters = showFiltersState[1];
  var selectedState = useState(new Set()); var selected = selectedState[0], setSelected = selectedState[1];
  var formOpenState = useState(false); var formOpen = formOpenState[0], setFormOpen = formOpenState[1];
  var editingIdState = useState(null); var editingId = editingIdState[0], setEditingId = editingIdState[1];
  var formState = useState(emptyForm()); var form = formState[0], setForm = formState[1];
  var toastState = useState(""); var toast = toastState[0], setToast = toastState[1];
  var viewerState = useState(null); var viewer = viewerState[0], setViewer = viewerState[1];
  var importOpenState = useState(false); var importOpen = importOpenState[0], setImportOpen = importOpenState[1];
  var importTextState = useState(""); var importText = importTextState[0], setImportText = importTextState[1];
  var savingState = useState(false); var saving = savingState[0], setSaving = savingState[1];
  var mapOpenState = useState(false); var mapOpen = mapOpenState[0], setMapOpen = mapOpenState[1];
  var geoStatusState = useState(""); var geoStatus = geoStatusState[0], setGeoStatus = geoStatusState[1];
  var mapContainerRef = useRef(null);
  var mapInstanceRef = useRef(null);
  var markerLayerRef = useRef(null);

  useEffect(function() {
    if (loadJson(AUTH_KEY) === "ok") setLocked(false);
    var unsub = onSnapshot(propertiesCol, function(snapshot) {
      var list = [];
      snapshot.forEach(function(docSnap) {
        list.push(Object.assign({ id: docSnap.id }, docSnap.data()));
      });
      setItems(list);
    }, function(err) {
      showToast("データベースへの接続に失敗しました");
    });
    return unsub;
  }, []);

  useEffect(function() {
    if (!mapOpen) return;
    var mapEl = mapContainerRef.current;
    if (!mapEl || typeof L === "undefined") return;
    var map = L.map(mapEl).setView(SAKAI_CENTER, 12);
    mapInstanceRef.current = map;
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    var markerLayer = L.layerGroup().addTo(map);
    markerLayerRef.current = markerLayer;
    setTimeout(function(){ map.invalidateSize(); }, 80);
    return function() {
      map.remove();
      mapInstanceRef.current = null;
      markerLayerRef.current = null;
    };
  }, [mapOpen]);

  useEffect(function() {
    if (!mapOpen || !markerLayerRef.current) return;
    var layer = markerLayerRef.current;
    layer.clearLayers();
    items.forEach(function(it) {
      if (typeof it.lat === "number" && typeof it.lng === "number") {
        var pm = priorityMeta(it.priority);
        var marker = L.circleMarker([it.lat, it.lng], { radius: 8, color: pm.color, fillColor: pm.color, fillOpacity: it.approxLoc ? 0.45 : 0.85, weight: 2, dashArray: it.approxLoc ? "3,3" : null });
        marker.bindPopup(
          "<b>" + escapeHtml(it.name || "（物件名未登録）") + "</b><br>" +
          escapeHtml(it.address) + "<br>" +
          '<span style="color:' + pm.color + '">' + escapeHtml(it.priority) + "</span>　" + escapeHtml(it.status) +
          (it.approxLoc ? '<br><span style="color:#999;font-size:11px">※ 概算位置（丁目・地区レベル）</span>' : "")
        );
        marker.addTo(layer);
      }
    });
  }, [items, mapOpen]);

  useEffect(function() {
    if (!mapOpen) return;
    var toGeocode = items.filter(function(it){ return typeof it.lat !== "number" || typeof it.lng !== "number"; });
    if (!toGeocode.length) { setGeoStatus(""); return; }
    var cancelled = false;
    var i = 0;
    var okCount = 0, ngCount = 0, lastErr = "";
    function next() {
      if (cancelled) return;
      if (i >= toGeocode.length) {
        setGeoStatus(okCount + "件成功・" + ngCount + "件失敗" + (lastErr ? "（" + lastErr + "）" : ""));
        return;
      }
      var it = toGeocode[i];
      setGeoStatus("住所を確認中…（" + (i + 1) + "/" + toGeocode.length + "）");
      geocodeAddress(it.address).then(function(result) {
        if (cancelled) return;
        if (result && typeof result.lat === "number") {
          okCount++;
          saveItemDoc(it.id, Object.assign({}, it, { lat: result.lat, lng: result.lng, approxLoc: !!result.approx }));
        } else {
          ngCount++;
          if (result && result.error) lastErr = result.error;
        }
        i++;
        setTimeout(next, 1100);
      });
    }
    next();
    return function(){ cancelled = true; };
  }, [mapOpen, items.length]);

  function saveItemDoc(id, data) {
    setDoc(doc(propertiesCol, id), data).catch(function(err) {
      showToast("保存に失敗しました");
    });
  }
  function deleteItemDoc(id) {
    deleteDoc(doc(propertiesCol, id)).catch(function(err) {
      showToast("削除に失敗しました");
    });
  }
  function showToast(msg) {
    setToast(msg);
    setTimeout(function(){ setToast(""); }, 2200);
  }
  function submitPassword() {
    if (pwInput === APP_PASSWORD) {
      setLocked(false);
      setPwError(false);
      saveJson(AUTH_KEY, "ok");
    } else {
      setPwError(true);
    }
  }

  var filtered = useMemo(function() {
    var tokens = toHalfWidth(query).trim().split(/\s+/).filter(Boolean);
    return items.filter(function(it) {
      if (priorityFilter.size && !priorityFilter.has(it.priority)) return false;
      if (statusFilter.size && !statusFilter.has(it.status)) return false;
      if (!tokens.length) return true;
      var hay = toHalfWidth(it.name + " " + it.address + " " + it.status + " " + it.type + " " + it.memo).toLowerCase();
      return tokens.every(function(t){ return hay.includes(t.toLowerCase()); });
    }).sort(function(a, b) {
      var order = { "最優先": 0, "優先": 1, "普通": 2, "保留": 3 };
      var oa = order[a.priority]; if (oa===undefined) oa = 9;
      var ob = order[b.priority]; if (ob===undefined) ob = 9;
      if (oa !== ob) return oa - ob;
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
  }, [items, query, priorityFilter, statusFilter]);

  function togglePriorityFilter(key) {
    var next = new Set(priorityFilter);
    if (next.has(key)) next.delete(key); else next.add(key);
    setPriorityFilter(next);
  }
  function toggleStatusFilter(key) {
    var next = new Set(statusFilter);
    if (next.has(key)) next.delete(key); else next.add(key);
    setStatusFilter(next);
  }
  function toggleSelect(id) {
    var next = new Set(selected);
    if (next.has(id)) next.delete(id); else next.add(id);
