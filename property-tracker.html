function uploadPhotos(itemId, photos) {
  var tasks = (photos || []).map(function(p) {
    if (typeof p === "string" && p.indexOf("data:") === 0) {
      var path = "properties/" + itemId + "/" + uid() + ".jpg";
      var sref = storageRef(storage, path);
      return uploadString(sref, p, "data_url").then(function() {
        return getDownloadURL(sref);
      });
    }
    return Promise.resolve(p);
  });
  return Promise.all(tasks);
}

var e = React.createElement;
var F = React.Fragment;
var useState = React.useState, useEffect = React.useEffect, useMemo = React.useMemo;

var PRIORITIES = [
  { key: "最優先", color: "#C9481F", bg: "#FBE4D8" },
  { key: "優先", color: "#C97A1F", bg: "#FBEBD8" },
  { key: "普通", color: "#3F6577", bg: "#DCE7EB" },
  { key: "保留", color: "#7A7568", bg: "#E7E3D8" },
];
var STATUS_OPTIONS = ["更地", "建設中", "解体中", "内装中", "空室", "交渉中", "その他"];
var TYPE_OPTIONS = ["新規地", "跡地", "不明"];
var STORAGE_KEY = "daybreak_properties";
var AUTH_KEY = "daybreak_auth";
var APP_PASSWORD = "day9000";

function toHalfWidth(str) {
  str = str || "";
  return str.replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xfee0); }).replace(/　/g, " ");
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function formatDate(ts) {
  if (!ts) return "";
  var d = new Date(ts);
  return d.getFullYear() + "/" + (d.getMonth() + 1) + "/" + d.getDate();
}
function priorityMeta(key) {
  for (var i=0;i<PRIORITIES.length;i++){ if (PRIORITIES[i].key===key) return PRIORITIES[i]; }
  return PRIORITIES[2];
}
function emptyForm() {
  return { name: "", address: "", priority: "普通", status: "更地", statusOther: "", type: "不明", memo: "", photos: [] };
}
function resizeImage(file) {
  return new Promise(function(resolve, reject) {
    var reader = new FileReader();
    reader.onload = function(ev) {
      var img = new Image();
      img.onload = function() {
        var maxDim = 1024;
        var width = img.width, height = img.height;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        var canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

var fontDisplay = { fontFamily: "'Barlow Condensed', sans-serif" };

  var s = { display: "block", fontSize: 12, color: "#6b665a", marginBottom: 4, marginTop: 10 };
  Object.assign(s, fontBody);

}

function loadJson(key) {
  try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch (err) { return null; }
}
function saveJson(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch (err) { return false; }
}

  var importTextState = useState(""); var importText = importTextState[0], setImportText = importTextState[1];
  var savingState = useState(false); var saving = savingState[0], setSaving = savingState[1];

  useEffect(function() {

      showToast("保存に失敗しました");

  function deleteItemDoc(id) {

      showToast("削除に失敗しました");
    });
  }
  function showToast(msg) {
    setToast(msg);
    setTimeout(function(){ setToast(""); }, 2200);
  }
  function submitPassword() {
    if (pwInput === APP_PASSWORD) {
      setLocked(false);
      setPwError(false);
      saveJson(AUTH_KEY, "ok");
    } else {
      setPwError(true);
    }
  }

  var filtered = useMemo(function() {
    var tokens = toHalfWidth(query).trim().split(/\s+/).filter(Boolean);
    return items.filter(function(it) {
      if (priorityFilter.size && !priorityFilter.has(it.priority)) return false;
      if (statusFilter.size && !statusFilter.has(it.status)) return false;
      if (!tokens.length) return true;
      var hay = toHalfWidth(it.name + " " + it.address + " " + it.status + " " + it.type + " " + it.memo).toLowerCase();
      return tokens.every(function(t){ return hay.includes(t.toLowerCase()); });
    }).sort(function(a, b) {
      var order = { "最優先": 0, "優先": 1, "普通": 2, "保留": 3 };
      var oa = order[a.priority]; if (oa===undefined) oa = 9;
      var ob = order[b.priority]; if (ob===undefined) ob = 9;
      if (oa !== ob) return oa - ob;
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
  }, [items, query, priorityFilter, statusFilter]);

  function togglePriorityFilter(key) {
    var next = new Set(priorityFilter);
    if (next.has(key)) next.delete(key); else next.add(key);
    setPriorityFilter(next);
  }
  function toggleStatusFilter(key) {
    var next = new Set(statusFilter);
    if (next.has(key)) next.delete(key); else next.add(key);
    setStatusFilter(next);
  }
  function toggleSelect(id) {
    var next = new Set(selected);
    if (next.has(id)) next.delete(id); else next.add(id);
    setSelected(next);
  }
  function openAdd() { setForm(emptyForm()); setEditingId(null); setFormOpen(true); }
  function openEdit(it) {
    setForm({
      name: it.name, address: it.address, priority: it.priority,
      status: STATUS_OPTIONS.includes(it.status) ? it.status : "その他",
      statusOther: STATUS_OPTIONS.includes(it.status) ? "" : it.status,
      type: it.type || "不明", memo: it.memo || "", photos: it.photos || [],
    });
    setEditingId(it.id);
    setFormOpen(true);
  }
  function handlePhotoFiles(fileList) {
    var files = Array.from(fileList || []);
    if (!files.length) return;
    Promise.all(files.map(function(f){ return resizeImage(f).catch(function(){ return null; }); })).then(function(results){
      var ok = results.filter(function(r){ return r; });
      setForm(function(prev){ return Object.assign({}, prev, { photos: (prev.photos || []).concat(ok) }); });
    });
  }
  function removePhoto(idx) {
    setForm(function(prev){ return Object.assign({}, prev, { photos: prev.photos.filter(function(_, i){ return i !== idx; }) }); });
  }
  function saveForm() {
    if (!form.address.trim()) { showToast("住所を入力してください"); return; }
    var statusValue = form.status === "その他" ? (form.statusOther.trim() || "その他") : form.status;
    var targetId = editingId || uid();
    setSaving(true);
    uploadPhotos(targetId, form.photos || []).then(function(uploadedPhotos) {
      if (editingId) {
        var existing = items.find(function(it){ return it.id === editingId; }) || {};
        saveItemDoc(editingId, Object.assign({}, existing, { name: form.name.trim(), address: form.address.trim(), priority: form.priority, status: statusValue, type: form.type, memo: form.memo.trim(), photos: uploadedPhotos, updatedAt: Date.now() }));
      } else {
        saveItemDoc(targetId, { name: form.name.trim(), address: form.address.trim(), priority: form.priority, status: statusValue, type: form.type, memo: form.memo.trim(), photos: uploadedPhotos, createdAt: Date.now(), updatedAt: Date.now() });
      }
      setSaving(false);
      setFormOpen(false);
      showToast(editingId ? "更新しました" : "登録しました");
    }).catch(function(err) {
      setSaving(false);
      showToast("写真のアップロードに失敗しました");
    });
  }
  function deleteCurrent() {
    if (!editingId) return;
    if (!window.confirm("この物件を削除しますか？")) return;
    deleteItemDoc(editingId);
    var nextSel = new Set(selected);
    nextSel.delete(editingId);
    setSelected(nextSel);
    setFormOpen(false);
    showToast("削除しました");
  }
  function openInMaps(address) {
    window.open("https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(address), "_blank");
  }
  function openRoute() {
    var addrs = items.filter(function(it){ return selected.has(it.id); }).map(function(it){ return it.address; });
    if (!addrs.length) return;
    var destination = addrs[addrs.length - 1];
    var waypoints = addrs.slice(0, -1);
    var url = "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(destination) + "&travelmode=driving";
    if (waypoints.length) url += "&waypoints=" + waypoints.map(encodeURIComponent).join("|");
    window.open(url, "_blank");
  }
  function exportCsv() {
    var rows = items.filter(function(it){ return selected.has(it.id); });
    var target = rows.length ? rows : filtered;
    var header = ["物件名", "住所", "優先度", "状態", "区分", "メモ"];
    function esc(s) { return '"' + String(s == null ? "" : s).replace(/"/g, '""') + '"'; }
    var csv = [header.map(esc).join(",")].concat(target.map(function(it){ return [it.name, it.address, it.priority, it.status, it.type, it.memo].map(esc).join(","); })).join("\r\n");
    var blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "新規物件_マイマップ用_" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("CSVを書き出しました");
  }
  function parseCsvLine(line) {
    var out = []; var cur = ""; var inQuotes = false;
    for (var i = 0; i < line.length; i++) {
      var c = line[i];
      if (inQuotes) {
        if (c === '"') { if (line[i+1] === '"') { cur += '"'; i++; } else { inQuotes = false; } }
        else cur += c;
      } else if (c === '"') { inQuotes = true; }
      else if (c === ",") { out.push(cur); cur = ""; }
      else cur += c;
    }
    out.push(cur);
    return out;
  }
  function pickCol(headers, candidates) {
    for (var i=0;i<candidates.length;i++){
      var idx = headers.findIndex(function(h){ return h.trim() === candidates[i]; });
      if (idx !== -1) return idx;
    }
    return -1;
  }
  function handleImportFile(file) {
    file.text().then(function(text){ setImportText(text); });
  }
  function doImport() {
    var raw = importText.replace(/^\uFEFF/, "").replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n").filter(function(l){ return l.trim().length; });
    if (raw.length < 2) { showToast("データが見つかりません"); return; }

    var nameIdx = pickCol(headers, ["物件名", "近隣・目安", "目安", "名前"]);
    var priIdx = pickCol(headers, ["優先度"]);
    var statIdx = pickCol(headers, ["現状", "状態"]);
    var typeIdx = pickCol(headers, ["区分"]);
    var memoIdx = pickCol(headers, ["備考", "メモ"]);
    if (addrIdx === -1) { showToast("「住所」列が見つかりません"); return; }
    var existingAddrs = new Set(items.map(function(it){ return it.address.trim(); }));
    var added = []; var skipped = 0;

      existingAddrs.add(address);

        type: (typeIdx !== -1 && cols[typeIdx]) ? cols[typeIdx].trim() : "不明",
        memo: memoIdx !== -1 ? (cols[memoIdx] || "").trim() : "",
        createdAt: Date.now() - i,
        updatedAt: Date.now() - i,
      });
    }
    if (added.length) {
      added.forEach(function(item) {
        var id = item.id;
        var data = Object.assign({}, item);
        delete data.id;
        saveItemDoc(id, data);
      });
    }

    setImportText("");

  }

  if (locked) {
    return e('div', {style: Object.assign({minHeight:"100vh", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:24, background:"#1F2933", color:"#F4F1E8"}, fontBody)},
      e('div', {style: Object.assign({fontSize:24, fontWeight:700, marginBottom:4}, fontDisplay)}, "新規物件リスト"),

  var searchNode = e('div', {key:"searchbar", style:{padding:12, position:"sticky", top:0, background:"#E7E3D8", zIndex:10, borderBottom:"1px solid #C6C0AE"}},

      query ? e('button', {onClick:function(){ setQuery(""); }, "aria-label":"検索をクリア"}, e(XIcon,{size:16,color:"#8a8478"})) : null,
      e('button', {onClick:function(){ setShowFilters(function(s){ return !s; }); }, style:{display:"flex", alignItems:"center", gap:4, color: (showFilters||priorityFilter.size||statusFilter.size) ? "#C9481F":"#5B5648"}, "aria-label":"絞り込み"}, e(FilterIcon,{size:18})),
      e('button', {onClick:function(){ setImportOpen(true); }, style:{display:"flex", alignItems:"center", gap:4, color:"#5B5648"}, "aria-label":"CSV取込"}, e(UploadIcon,{size:18}))
