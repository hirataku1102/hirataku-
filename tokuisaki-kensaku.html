  .meta-bar::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(255,255,255,0) 55%, var(--bg) 100%);
    pointer-events:none;
  }
  .meta-bar > *{ position:relative; z-index:1; }
  main{
    max-width:900px;
    margin:0 auto;
    padding:16px;
  }
  .group{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    margin-bottom:12px;
    overflow:hidden;
  }
  .group-header{
    padding:14px 16px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .group-header:hover{ background:#fafbfc; }
  .group-title{
    font-weight:700;
    font-size:15px;
    color:var(--brand-blue-dark);
  }
  .group-sub{
    font-size:12px;
    color:var(--sub);
    margin-top:3px;
  }
  .group-count{
    font-size:12px;
    color:var(--sub);
    white-space:nowrap;
    flex-shrink:0;
  }
  .chevron{
    transition:transform .15s ease;
    color:var(--sub);
    flex-shrink:0;
  }
  .group.open .chevron{ transform:rotate(90deg); }
  .sites{
    display:none;
    border-top:1px solid var(--line);
  }
  .group.open .sites{ display:block; }
  .site{
    padding:12px 16px;
    border-bottom:1px solid var(--line);
    border-left:4px solid transparent;
  }
  .site:last-child{ border-bottom:none; }
  .site.kyuushi{
    background:var(--warn-bg);
    border-left-color:var(--warn-line);
  }
  .site.kaiyaku{
    background:var(--stop-bg);
    border-left-color:var(--stop-line);
  }
  .site-name{
    font-weight:600;
    font-size:14px;
  }
  .site.kaiyaku .site-name{
    color:var(--stop-text);
    text-decoration:line-through;
    text-decoration-color:#b7bcc4;
  }
  .status-tag{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    padding:1px 7px;
    border-radius:10px;
    margin-left:8px;
    vertical-align:middle;
  }
  .status-tag.kyuushi{ background:var(--warn-line); color:#fff; }
  .status-tag.kaiyaku{ background:var(--stop-line); color:#fff; }
  .site-addr{
    font-size:12.5px;
    color:var(--sub);
    margin-top:2px;
  }
  .addr-link{
    color:var(--brand-blue-dark);
    text-decoration:underline;
    text-decoration-color:rgba(30,91,143,.35);
    text-underline-offset:2px;
  }
  .addr-link:active{ opacity:.6; }
  .site-details{
    margin-top:6px;
    font-size:12.5px;
    color:var(--ink);
    display:flex;
    flex-wrap:wrap;
    gap:6px 14px;
  }
  .site-details span b{
    color:var(--sub);
    font-weight:500;
    margin-right:3px;
  }
  .site-code{
    margin-top:6px;
    font-size:10.5px;
    color:#b7bcc4;
    letter-spacing:.01em;
  }
  .price{
    font-weight:700;
    color:var(--brand-blue-dark);
  }
  .empty{
    text-align:center;
    color:var(--sub);
    padding:40px 20px;
    font-size:14px;
  }
  .legend{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    font-size:11.5px;
    color:var(--sub);
    padding:0 4px 10px;
  }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .legend i{
    width:10px;height:10px;border-radius:3px;display:inline-block;
  }
  .legend .lw{ background:var(--warn-bg); border:1px solid var(--warn-line); }
  .legend .lk{ background:var(--stop-bg); border:1px solid var(--stop-line); }

  /* ロック画面 */
  #lockScreen{

<body>

<div id="lockScreen">
  <div class="lock-box">
    <h2>得意先検索</h2>
    <p id="lockMsg">社内アカウントでログインしてください</p>
    <input id="emailInput" type="email" placeholder="メールアドレス" autocomplete="username" autocapitalize="off" spellcheck="false">
    <input id="pwInput" type="password" placeholder="パスワード" autocomplete="current-password">
    <button id="loginBtn">ログイン</button>
    <div class="err" id="pwErr"></div>
  </div>
</div>

<div id="appRoot">
<header>
  <h1>得意先検索</h1>
  <p>管理会社・得意先名・住所で検索できます</p>
  <button id="logoutBtn" class="logout-btn">ログアウト</button>
</header>
<div class="search-wrap">
  <input id="searchInput" type="text" placeholder="会社名・住所などで検索(スペース区切りで複数ワードOK)…" autocomplete="off">
  <div class="status-filters">
    <label><input type="checkbox" id="chkKyuushi"> 休止中を含める</label>
    <label><input type="checkbox" id="chkKaiyaku"> 解約済みを含める</label>
  </div>
</div>
<div class="meta-bar" id="metaBar"></div>

<main>
  <div class="legend">
    <span><i class="lw"></i>休止中</span>
    <span><i class="lk"></i>解約済み</span>
  </div>
  <div id="results"></div>
</main>
</div>

<!-- データはFirestoreから読み込みます -->
<script>
let RAW = [];
let GROUPED = [];


function groupData(records){
  const map = new Map();
  for(const r of records){
    const key = r.k1 + '||' + r.k2;
    if(!map.has(key)) map.set(key, { k1:r.k1, k2:r.k2, kaddr:r.kaddr, sites:[] });
    map.get(key).sites.push(r);
  }
  return Array.from(map.values());
}

// Firestore から届いたデータでアプリを起動する
window.bootApp = function(rows){
  RAW = rows || [];
  GROUPED = groupData(RAW);
  render();
};

function norm(s){ return (s||'').toString().normalize('NFKC').toLowerCase(); }

// 全角/半角スペース区切りで複数ワードに分割(AND検索)
function tokenize(q){
  return norm(q).split(/[\s　]+/).filter(Boolean);
}

function matches(group, tokens){
  if(!tokens.length) return true;
  const hay = norm(group.k1 + ' ' + group.k2 + ' ' + group.kaddr + ' ' +
    group.sites.map(s => s.t1+' '+s.t2+' '+s.taddr+' '+s.shohin+' '+s.code).join(' '));
  return tokens.every(t => hay.includes(t));
}

function siteMatches(site, tokens){
  if(!tokens.length) return true;
  const hay = norm(site.t1+' '+site.t2+' '+site.taddr+' '+site.shohin+' '+site.code);
  return tokens.every(t => hay.includes(t));
}

function escapeHtml(s){
  return (s||'').toString()
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 住所をタップするとGoogleマップで開くリンクにする
function mapLink(address){
  const addr = (address||'').toString().trim();
  if(!addr) return '—';
  const url = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(addr);
  return `<a href="${url}" class="addr-link" onclick="event.stopPropagation()">${escapeHtml(addr)}</a>`;
}

function fmtPrice(v){
  if(!v) return '0円';
  return Number(v).toLocaleString('ja-JP') + '円';
}

function siteStatusClass(site){
  if(site.kaiyaku) return 'kaiyaku';
  if(site.kyuushi) return 'kyuushi';
  return '';
}

function renderSite(site){
  const cls = siteStatusClass(site);
  let tag = '';
  if(site.kaiyaku) tag = `<span class="status-tag kaiyaku">解約 ${escapeHtml(site.kaiyaku)}</span>`;
  else if(site.kyuushi) tag = `<span class="status-tag kyuushi">休止 ${escapeHtml(site.kyuushi)}</span>`;

  const name2 = site.t2 ? ` <span style="font-weight:400;color:var(--sub)">/ ${escapeHtml(site.t2)}</span>` : '';

  return `
  <div class="site ${cls}">
    <div class="site-name">${escapeHtml(site.t1)}${name2}${tag}</div>
    <div class="site-addr">${mapLink(site.taddr)}</div>
    <div class="site-details">
      ${site.shohin ? `<span><b>商品</b>${escapeHtml(site.shohin)}</span>` : ''}
      <span><b>単価</b><span class="price">${fmtPrice(site.tanka)}</span>${site.taniname ? '/'+escapeHtml(site.taniname):''}${site.tekiyou ? ` <span style="color:var(--sub);font-weight:400;">(適用開始日: ${escapeHtml(site.tekiyou)})</span>`:''}</span>
      ${site.keiyaku ? `<span><b>契約日</b>${escapeHtml(site.keiyaku)}</span>` : ''}
    </div>
    ${site.code ? `<div class="site-code">管理番号:${escapeHtml(site.code)}</div>` : ''}
  </div>`;
}

function statusAllowed(site, showKyuushi, showKaiyaku){
  if(site.kaiyaku) return showKaiyaku;
  if(site.kyuushi) return showKyuushi;
  return true;
}

function applyStatusFilter(groups, showKyuushi, showKaiyaku){
  return groups
    .map(g => ({ k1:g.k1, k2:g.k2, kaddr:g.kaddr,
      sites: g.sites.filter(s => statusAllowed(s, showKyuushi, showKaiyaku)) }))
    .filter(g => g.sites.length > 0);
}

function renderGroup(group, tokens, forceOpen){
  // when searching, only show sites that individually match OR the group name matched broadly
  const groupNameMatch = tokens.every(t => norm(group.k1+' '+group.k2+' '+group.kaddr).includes(t));
  const siteList = tokens.length && !groupNameMatch ? group.sites.filter(s => siteMatches(s,tokens)) : group.sites;

  const name2 = group.k2 ? ` <span style="font-weight:400;color:var(--sub)">/ ${escapeHtml(group.k2)}</span>` : '';

  return `
  <div class="group ${forceOpen ? 'open':''}">
    <div class="group-header" onclick="this.parentElement.classList.toggle('open')">
      <div>
        <div class="group-title">${escapeHtml(group.k1)}${name2}</div>
        <div class="group-sub">${mapLink(group.kaddr)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="group-count">${siteList.length}件</div>
        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </div>
    </div>
    <div class="sites">
      ${siteList.map(renderSite).join('')}
    </div>
  </div>`;
}

function render(){
  if(!GROUPED.length){ return; }
  const rawQ = document.getElementById('searchInput').value;
  const tokens = tokenize(rawQ);
  const showKyuushi = document.getElementById('chkKyuushi').checked;
  const showKaiyaku = document.getElementById('chkKaiyaku').checked;
  const resultsEl = document.getElementById('results');
  const metaEl = document.getElementById('metaBar');

  // 検索前(未入力)は何も表示しない
  if(tokens.length === 0){
    metaEl.textContent = `全体 ${GROUPED.length}件`;
    resultsEl.innerHTML = `<div class="empty">検索ワードを入力してください</div>`;
    return;
  }

  const statusFiltered = applyStatusFilter(GROUPED, showKyuushi, showKaiyaku);
  let filtered = statusFiltered.filter(g => matches(g, tokens));

  metaEl.textContent = `管理会社 ${filtered.length}件 / 全体 ${GROUPED.length}件 中`;

  if(filtered.length === 0){
    resultsEl.innerHTML = `<div class="empty">該当するデータが見つかりません</div>`;
    return;
  }

  const forceOpen = tokens.length > 0;
  resultsEl.innerHTML = filtered
    .slice(0, 200)
    .map(g => renderGroup(g, tokens, forceOpen))
    .join('');
}

document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('chkKyuushi').addEventListener('change', render);
document.getElementById('chkKaiyaku').addEventListener('change', render);

// PWA: サービスワーカー登録(オフラインでも開けるように)
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('tokuisaki-sw.js').catch(()=>{});
  });
}
</script>

<!-- ===== Firebase(ログイン + データ読み込み) ===== -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
         setPersistence, browserLocalPersistence }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ▼▼▼ ここだけ書き換えてください ▼▼▼
   apiKey は editor.html の中の firebaseConfig からコピーして貼り付け */
const firebaseConfig = {
  apiKey: "AIzaSyD8JW9526h0TKa9_hEaGrmlpVG8NeW4c3Q",
  authDomain: "hirataku1102.firebaseapp.com",
  projectId: "hirataku1102",
  storageBucket: "hirataku1102.firebasestorage.app",
  messagingSenderId: "219252490669",
  appId: "1:219252490669:web:bb3d9dc019a17a5a01e124"
};
/* ▲▲▲ ここまで ▲▲▲ */

const COLLECTION = "ts_customers";   // コース表アプリ(cm_*)とは別のコレクション
const CACHE_KEY  = "ts_cache_v1";

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const $ = (id) => document.getElementById(id);
const lockScreen = $('lockScreen');
const appRoot    = $('appRoot');
const emailInput = $('emailInput');
const pwInput    = $('pwInput');
const loginBtn   = $('loginBtn');
const pwErr      = $('pwErr');
const lockMsg    = $('lockMsg');
const resultsEl  = $('results');

function showError(msg){
  pwErr.textContent = msg;
  pwErr.style.display = 'block';
}
function clearError(){
  pwErr.textContent = '';
  pwErr.style.display = 'none';
}
function setBusy(busy, label){
  loginBtn.disabled = busy;
  loginBtn.textContent = busy ? (label || '確認中…') : 'ログイン';
}

/* --- ログイン --- */
async function doLogin(){
  const email = emailInput.value.trim();
  const pw    = pwInput.value;
  if(!email || !pw){ showError('メールアドレスとパスワードを入力してください'); return; }
  clearError();
  setBusy(true);
  try{
    await setPersistence(auth, browserLocalPersistence);  // 次回から自動ログイン
    await signInWithEmailAndPassword(auth, email, pw);
  }catch(err){
    const code = (err && err.code) || '';
    let msg = 'ログインできませんでした';
    if(code.includes('invalid-credential') || code.includes('wrong-password') || code.includes('user-not-found')){
      msg = 'メールアドレスかパスワードが違います';
    }else if(code.includes('invalid-email')){
      msg = 'メールアドレスの形式が正しくありません';
    }else if(code.includes('too-many-requests')){
      msg = '試行回数が多すぎます。しばらく待ってからお試しください';
    }else if(code.includes('network')){
      msg = 'ネットワークに接続できません';
    }
    showError(msg);
    setBusy(false);
  }
}
loginBtn.addEventListener('click', doLogin);
[emailInput, pwInput].forEach(el => {
  el.addEventListener('keydown', (e) => { if(e.key === 'Enter') doLogin(); });
});

/* --- ログアウト --- */
$('logoutBtn').addEventListener('click', async () => {
  try{ localStorage.removeItem(CACHE_KEY); }catch(e){}
  await signOut(auth);
  location.reload();
});

/* --- キャッシュ(同じ端末で2回目以降を速く・オフラインでも開けるように) --- */
function readCache(){
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    if(!raw) return null;
    const obj = JSON.parse(raw);
    if(!obj || !Array.isArray(obj.rows)) return null;
    return obj;
  }catch(e){ return null; }
}
function writeCache(stamp, rows){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ stamp, rows })); }catch(e){}
}

/* --- Firestore からデータを読み込む --- */
async function loadData(){
  resultsEl.innerHTML = '<div class="loading"><div class="spin"></div>データを読み込んでいます…</div>';

  let meta = null;
  try{
    const snap = await getDoc(doc(db, COLLECTION, 'meta'));
    if(snap.exists()) meta = snap.data();
  }catch(e){
    // オフライン等。キャッシュがあればそれで動かす
  }

  const cache = readCache();
  const stamp = meta ? String(meta.updatedAt || '') : '';

  if(cache && (!meta || cache.stamp === stamp)){
    window.bootApp(cache.rows);
    return;
  }

  if(!meta){
    resultsEl.innerHTML = '<div class="empty">データを読み込めませんでした。通信状況を確認して開き直してください。</div>';
    return;
  }

  try{
    const qs = await getDocs(collection(db, COLLECTION));
    const chunks = [];
    qs.forEach(d => {
      if(d.id === 'meta') return;
      const v = d.data();
      if(v && Array.isArray(v.rows)) chunks.push({ id: d.id, rows: v.rows });
    });
    chunks.sort((a, b) => a.id.localeCompare(b.id));
    const rows = chunks.flatMap(c => c.rows);
    writeCache(stamp, rows);
    window.bootApp(rows);
  }catch(e){
    resultsEl.innerHTML = '<div class="empty">データを読み込めませんでした。' +
      '権限の設定を確認してください。</div>';
  }
}

/* --- ログイン状態の監視 --- */
onAuthStateChanged(auth, (user) => {
  if(user){
    lockScreen.classList.add('hidden');
    appRoot.style.display = 'block';
    loadData();
  }else{
    lockScreen.classList.remove('hidden');
    appRoot.style.display = 'none';
    setBusy(false);
    lockMsg.textContent = '社内アカウントでログインしてください';
  }
});
</script>
</body>
</html>
